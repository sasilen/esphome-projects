# Board: Wemos D1 Mini (ESP8266) (Wemos)
# Definition: definitions/boards/d1_mini/manifest.yaml

esphome:
  name: aidon
  friendly_name: Aidon

esp8266:
  board: d1_mini
  restore_from_flash: true

external_components:
  - source:
      type: git
      url: https://github.com/psvanstrom/esphome-p1reader
      # Kiinnitetty commitiin, koska repossa ei ole tageja. Ilman tätä
      # refresh hakee oletushaaran pään vuorokauden välein, eli sama YAML
      # kääntyy eri tavalla ilman että täällä muuttuu mitään.
      ref: bec7fc96476fa615f431a29fbe2db22e35c728b7
    refresh: never

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Aidon Fallback Hotspot
    password: !secret ap_password

captive_portal:

logger:
  baud_rate: 0          # pakollinen: vapauttaa UART0:n
  level: DEBUG

api:
  encryption:
    # Jaettu avain kaikkien laitteiden kesken, kontin /config/secrets.yaml:sta.
    # **Aidon oli ajossa omalla avaimellaan ennen versionhallintaa**, joten
    # ensimmäinen flashaus tällä vaihtaa sen — ja HA tarvitsee uuden avaimen
    # ennen kuin entiteetit palaavat. Se on kertaluonteinen ja tiedossa.
    key: !secret api_encryption_key

ota:
  - platform: esphome

uart:
  id: uart_bus
  rx_pin:
    number: GPIO13
    inverted: true
  baud_rate: 115200
  rx_buffer_size: 3072

p1reader:
  - id: p1reader_esp
    uart_id: uart_bus
    protocol: ascii

binary_sensor:
  - platform: status
    name: "Status"

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

  - platform: wifi_signal
    name: "Wi-Fi"
    update_interval: 60s

  - platform: p1reader
    p1reader_id: p1reader_esp
    # HUOM: kumulatiivisiin kWh-lukemiin EI delta-suodinta - ne ovat
    # Energia-paneelin lähde ja kasvavat muutenkin hitaasti.
    cumulative_active_import:
      name: "Kulutus yhteensä"
    cumulative_active_export:
      name: "Tuotanto yhteensä"

    # Hetkelliset tehot (kW): mittari lähettää sähkeen 10 s välein ja arvo on
    # pyöristämätön float, joten ilman suodinta jokainen sähke on uusi
    # states-rivi HA:n kannassa - 27 800 riviä/vrk eli 37 % koko
    # kirjoitusmäärästä (mitattu kannasta 19.9.2026).
    #
    # delta 0.01 = 10 W: julkaisee vasta aidosta muutoksesta, mutta säilyttää
    # täyden tarkkuuden - toisin kuin round, joka menettäisi sen myös isoissa
    # muutoksissa. heartbeat julkaisee arvon uudelleen 5 min välein vaikka se
    # ei olisi muuttunut, jottei lukema jää roikkumaan jos se ajelehtii
    # pikkuaskelin; muuttumaton arvo ei kirjoita kantaan riviä.
    # Yhteisvaikutus: -17 250 riviä/vrk.
    momentary_active_import:
      name: "Teho"
      filters: &teho_filter
        - or:
            - delta: 0.01
            - heartbeat: 300s
    momentary_active_export:
      name: "Syöttö"
      filters: *teho_filter
    momentary_active_import_l1:
      name: "Teho L1"
      filters: *teho_filter
    momentary_active_import_l2:
      name: "Teho L2"
      filters: *teho_filter
    momentary_active_import_l3:
      name: "Teho L3"
      filters: *teho_filter

    # Jännitteet ja virrat eivät ole recorderin include-listalla, joten nämä
    # eivät vähennä kannan kasvua lainkaan - vain API-liikennettä ja HA:n
    # turhaa tilankäsittelyä 10 s välein. Kynnykset ovat väljemmät, koska
    # verkkojännite heiluu jatkuvasti parin voltin sisällä.
    voltage_l1:
      name: "Jännite L1"
      filters: &volt_filter
        - or:
            - delta: 0.5
            - heartbeat: 300s
    voltage_l2:
      name: "Jännite L2"
      filters: *volt_filter
    voltage_l3:
      name: "Jännite L3"
      filters: *volt_filter
    current_l1:
      name: "Virta L1"
      filters: &amp_filter
        - or:
            - delta: 0.1
            - heartbeat: 300s
    current_l2:
      name: "Virta L2"
      filters: *amp_filter
    current_l3:
      name: "Virta L3"
      filters: *amp_filter
