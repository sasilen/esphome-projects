  <text x="74" y="546" font-size="12" font-weight="700" fill="#A3301F">KONDENSAATTORIN NAPAISUUS</text>
  <text x="74" y="565" font-size="11.5" fill="#16212B">Raidalla merkitty puoli ja lyhyempi jalka = miinus &#8594; <tspan font-weight="700">G</tspan>.</text>
  <text x="74" y="580" font-size="11.5" fill="#16212B">V&#228;&#228;rin p&#228;in se kuumenee ja voi revet&#228;.</text>

  <text x="50" y="622" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">JUOTOSTEKNIIKKA</text>
  <text x="50" y="644" font-size="11.5" fill="#16212B">Johtimet <tspan font-weight="700">reikien l&#228;pi</tspan> ylh&#228;&#228;lt&#228;, juotos alapuolelta &#8212; ne kantavat vedon.</text>
  <text x="50" y="662" font-size="11.5" fill="#16212B">Vastus ja kondensaattori <tspan font-weight="700">padien p&#228;&#228;lle</tspan>, koska rei&#228;t ovat silloin t&#228;ynn&#228;.</text>
  <text x="50" y="680" font-size="11.5" fill="#16212B">Kierr&#228; ja tinaa johdinparit yhdeksi nipuksi ennen reik&#228;&#228;n ty&#246;nt&#246;&#228;.</text>

  <rect x="50" y="710" width="660" height="82" fill="#16212B"/>
  <text x="74" y="736" font-size="11" font-weight="700" fill="#7C8B99" letter-spacing="1">TARKISTA T&#196;SS&#196; J&#196;RJESTYKSESS&#196;</text>
  <text x="74" y="758" font-size="11.5" fill="#E9ECEF">1. Piip-mittaus: <tspan fill="#FF9E8F" font-weight="700">5V ja G eiv&#228;t saa piipata kesken&#228;&#228;n</tspan></text>
  <text x="74" y="775" font-size="11.5" fill="#E9ECEF">2. USB kiinni &#8594; laite Online ESPHomessa</text>
  <text x="74" y="785" font-size="10.5" fill="#7C8B99">    Vasta t&#228;m&#228;n j&#228;lkeen kuumaliima ja kutistesukka.</text>

  <text x="50" y="828" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">WIFI ENNEN LOPULLISTA ASENNUSTA</text>
  <text x="50" y="850" font-size="11.5" fill="#16212B">Vie levy varavirralla kaappiin, sulje luukku, lue RSSI HA:sta:</text>
  <text x="70" y="872" font-size="11.5" fill="#16212B">&#8722;70 dBm tai parempi &#8594; hyv&#228;</text>
  <text x="70" y="890" font-size="11.5" fill="#16212B">&#8722;70&#8230;&#8722;80 &#8594; toimii, katkoja tulee</text>
  <text x="70" y="908" font-size="11.5" fill="#A3301F">alle &#8722;85 &#8594; siirr&#228; levy kaapin ulkopuolelle</text>

  <line x1="20" y1="936" x2="740" y2="936" stroke="#A8B3BC"/>
  <text x="50" y="964" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">MITTARIIN</text>
  <text x="50" y="986" font-size="11.5" fill="#16212B">USB irti &#8594; pistoke mittariin &#8594; Logs auki. 10 s sis&#228;ll&#228; pit&#228;isi n&#228;ky&#228;:</text>
  <text x="50" y="1006" font-size="11.5" font-weight="700" fill="#0E6E7C">/ADN9 ... &#183; PASS = YES</text>
