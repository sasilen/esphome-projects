<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" width="760" height="900" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="760" height="900" fill="#E9ECEF"/>
  <rect x="20" y="20" width="720" height="860" fill="none" stroke="#A8B3BC"/>

  <text x="40" y="58" font-size="21" font-weight="700" fill="#16212B" letter-spacing="1.5">1-WIRE &#8212; KYTKENT&#196;</text>
  <text x="40" y="80" font-size="12" fill="#5A6772">Nelj&#228; johdinta, kaksi paria, yksi vastus &#183; nastakartta luettu vanhasta pistokkeesta</text>
  <line x1="20" y1="98" x2="740" y2="98" stroke="#A8B3BC"/>

  <text x="50" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">IS&#196;NT&#196;</text>
  <text x="470" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">RJ45-PISTOKE</text>

  <rect x="50" y="150" width="180" height="250" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <text x="140" y="176" font-size="13" font-weight="700" fill="#16212B" text-anchor="middle">ESP32-C3</text>
  <g font-size="11" fill="#16212B">
    <text x="150" y="196">GND</text>
    <text x="158" y="226">5V</text>
    <text x="126" y="276">GPIO4</text>
    <text x="150" y="356">3V3</text>
  </g>
  <text x="140" y="382" font-size="9.5" fill="#5A6772" text-anchor="middle">sy&#246;tt&#246; USB-C:st&#228;</text>

  <rect x="470" y="150" width="190" height="250" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <g font-size="11" fill="#16212B">
    <text x="482" y="196">1</text><text x="482" y="226">2</text><text x="482" y="256">3</text>
    <text x="482" y="286">4</text><text x="482" y="316">5</text><text x="482" y="346">6</text>
    <text x="482" y="371">7</text><text x="482" y="391">8</text>
  </g>
  <g font-size="10.5" font-weight="700">
    <text x="506" y="196" fill="#16212B">musta</text>
    <text x="506" y="226" fill="#A3301F">punainen</text>
    <text x="506" y="286" fill="#8A6D1F">keltainen</text>
    <text x="506" y="316" fill="#5A6772">valkoinen</text>
  </g>
  <g font-size="10" fill="#5A6772">
    <text x="600" y="196">GND</text>
    <text x="600" y="226">5 V</text>
    <text x="600" y="256">&#8212;</text>
    <text x="600" y="286">data</text>
    <text x="600" y="316">GND</text>
    <text x="600" y="346">&#8212;</text>
    <text x="600" y="371">&#8212;</text>
    <text x="600" y="391">&#8212;</text>
  </g>

  <g stroke="#A3301F" stroke-width="1.5" fill="none">
    <path d="M 662 188 L 670 188 L 670 218 L 662 218"/>
  </g>
  <text x="676" y="207" font-size="9.5" font-weight="700" fill="#A3301F">oranssi</text>
  <g stroke="#0E6E7C" stroke-width="1.5" fill="none">
    <path d="M 662 278 L 670 278 L 670 308 L 662 308"/>
  </g>
  <text x="676" y="297" font-size="9.5" font-weight="700" fill="#0E6E7C">sininen</text>

  <g stroke="#16212B" stroke-width="1.5" fill="none">
    <line x1="230" y1="192" x2="470" y2="192"/>
    <path d="M 380 192 L 380 312 L 470 312"/>
  </g>
  <g stroke="#A3301F" stroke-width="1.5" fill="none">
    <line x1="230" y1="222" x2="470" y2="222"/>
  </g>
  <g stroke="#8A6D1F" stroke-width="1.5" fill="none">
    <line x1="230" y1="272" x2="470" y2="272"/>
  </g>

  <g stroke="#0E6E7C" stroke-width="1.5" fill="none">
    <line x1="300" y1="272" x2="300" y2="296"/>
    <line x1="300" y1="330" x2="300" y2="352"/>
    <line x1="230" y1="352" x2="300" y2="352"/>
  </g>
  <rect x="288" y="296" width="24" height="34" rx="2" fill="#FFFFFF" stroke="#0E6E7C" stroke-width="1.5"/>
  <text x="322" y="318" font-size="11" font-weight="700" fill="#0E6E7C">4,7 k&#8486;</text>

  <text x="50" y="428" font-size="11.5" fill="#16212B"><tspan font-weight="700">Molemmat maat kytket&#228;&#228;n.</tspan> Ne ovat rinnan &#8212; yhdistyv&#228;t C3:n GND-nastassa ja jokaisen</text>
  <text x="50" y="446" font-size="11.5" fill="#16212B">anturin GND-nastassa &#8212; joten toisen unohtaminen ei riko mit&#228;&#228;n eik&#228; siksi n&#228;y mitenk&#228;&#228;n,</text>
  <text x="50" y="464" font-size="11.5" fill="#16212B">ennen kuin pitk&#228;n vedon j&#228;nnitteh&#228;vi&#246; alkaa oireilla kaukaisimmalla anturilla.</text>

  <line x1="20" y1="486" x2="740" y2="486" stroke="#A8B3BC"/>

  <text x="50" y="514" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">KAKSI J&#196;NNITETASOA, JA SE ON TARKOITUS</text>
  <text x="50" y="536" font-size="11.5" fill="#16212B"><tspan font-weight="700">Sy&#246;tt&#246; on 5 V, yl&#246;sveto 3,3 V.</tspan> DS18B20:n datanasta on avokollektori &#8212; se osaa vain</text>
  <text x="50" y="554" font-size="11.5" fill="#16212B">vet&#228;&#228; alas &#8212; joten <tspan font-weight="700">yl&#228;tason m&#228;&#228;r&#228;&#228; yksin yl&#246;sveto.</tspan> Anturit saavat t&#228;yden j&#228;nnitteen</text>
  <text x="50" y="572" font-size="11.5" fill="#16212B">pitk&#228;lle vedolle, mutta datalinja heilahtaa vain 3,3 volttiin ja on turvallinen C3:lle.</text>
  <text x="50" y="594" font-size="11.5" fill="#16212B">Raspberryn GPIO4 on selvinnyt vuosia t&#228;sm&#228;lleen samasta syyst&#228;.</text>

  <line x1="20" y1="616" x2="740" y2="616" stroke="#A8B3BC"/>

  <text x="50" y="644" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">PARISUUS &#8212; PID&#196; SE</text>
  <text x="50" y="666" font-size="11.5" fill="#16212B">Data ja sen maa ovat <tspan font-weight="700">sinisess&#228; parissa</tspan> (4 ja 5), sy&#246;tt&#246; ja sen maa <tspan font-weight="700">oranssissa</tspan> (1 ja 2).</text>
  <text x="50" y="684" font-size="11.5" fill="#16212B">Kumpikin signaali kulkee oman paluujohtimensa kanssa samassa kierteess&#228;. Jos data ja</text>
  <text x="50" y="702" font-size="11.5" fill="#16212B">sy&#246;tt&#246; p&#228;&#228;tyv&#228;t samaan pariin, kaapeli n&#228;ytt&#228;&#228; samalta mutta menett&#228;&#228; sen ominaisuuden</text>
  <text x="50" y="720" font-size="11.5" fill="#16212B">jonka takia parit ovat olemassa.</text>

  <rect x="50" y="748" width="660" height="114" fill="#FFFFFF" stroke="#A3301F" stroke-width="1.5"/>
  <rect x="50" y="748" width="6" height="114" fill="#A3301F"/>
  <text x="74" y="774" font-size="12" font-weight="700" fill="#A3301F">KAKSI ASIAA JOTKA EIV&#196;T SAA MENN&#196; V&#196;&#196;RIN</text>
  <text x="74" y="798" font-size="11.5" fill="#16212B"><tspan font-weight="700">Yl&#246;sveto menee 3V3:een eik&#228; viiteen</tspan>, ja se j&#228;&#228; C3:n p&#228;&#228;h&#228;n. Verkkoon l&#228;htee nelj&#228;</text>
  <text x="74" y="816" font-size="11.5" fill="#16212B">johdinta, ei viitt&#228;. Viiteen vedetty yl&#246;sveto tuhoaisi GPIO:n.</text>
  <text x="74" y="840" font-size="11.5" fill="#16212B"><tspan font-weight="700">Yksi is&#228;nt&#228; kerrallaan.</tspan> Kun C3 menee holkkiin, Raspberryn pistoke tulee pois.</text>
</svg>
