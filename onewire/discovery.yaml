# Talon 1-Wire-väylä — kartoitusajo
#
# Tämä konfiguraatio ei mittaa mitään. Se on olemassa yhtä kysymystä varten:
# **mitä väylällä on?**
#
# Yhtäkään sensoria ei määritellä, koska osoitteita ei vielä tiedetä. Osoitteeton
# `one_wire`-väylä luetteloi löytämänsä ROM-osoitteet käynnistysvedoksessa, ja
# yksi käynnistys riittää kertomaan montako anturia verkossa on ja mitkä ne ovat.
#
# Kytkentä: data GPIO4:ään ja **4,7 kΩ ylösveto 3,3 V:iin**. Syöttö kolmella
# johtimella, ei loiskäyttöä — ks. CLAUDE.md siitä miksi.
#
# Tämä on kertakäyttöinen: kun osoitteet on luettu ja kartoitettu sijainteihin,
# tilalle kirjoitetaan oikea konfiguraatio jossa jokaisella anturilla on osoite
# ja nimi.

esphome:
  name: onewire-discovery
  friendly_name: 1-Wire kartoitus

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# **Älä laske tätä INFO:on.** Löydetyt osoitteet tulostuvat CONFIG-tason
# vedoksessa, ja INFO vaientaa juuri sen rivin jota tässä ollaan hakemassa.
# Tuloste näyttäisi silloin siltä ettei antureita löytynyt lainkaan.
#
# Sama mekanismi piilotti stiebelin solmun IP-osoitteen käyttöönotossa.
logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # **Ei salasanaa.** Laite tarjoaa jo salatun OTA:n API-avaimella, ja
    # pelkkä `encryption:` vaatii sen — silloin salaamaton lähetys hylätään.
    # Salasana veisi noin 3,5 kB flashia ja 60 tavua RAMia eikä suojaisi
    # ketään joka on saanut API-avaimen käsiinsä.
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # **ESP32:n oletus on `LIGHT`**, joka nukuttaa radion majakkavälien välissä
  # ja herättää sen vain tarkistamaan tukiasemalle jonossa olevat paketit.
  # Jokaiseen saapuvaan pakettiin tulee silloin jopa majakkavälin viive, ja
  # megatavun OTA on tuhansia kuittauskierroksia.
  #
  # `NONE` pitää vastaanottimen auki jatkuvasti. Hinta on noin 20–40 mA eli
  # ~0,1 W — verkkovirralla merkityksetön, akulla ei olisi.
  #
  # **ESP8266:lla tätä ei tarvita: siellä oletus on jo `NONE`.**
  power_save_mode: NONE
  ap:
    ssid: "1-Wire fallback"
    password: !secret ap_password

captive_portal:


# ----------------------------------------------------------------- 1-Wire
# GPIO4, samasta syystä kuin stiebelin solmussa: SuperMinillä se on samalla
# reunalla kuin 3V3 ja GND, eikä se ole strappausnasta. GPIO2, GPIO8 ja GPIO9
# ovat, ja GPIO8 ajaa lisäksi levyn LEDiä.
#
# Väylä pidetään yhtenä. Jos kartoitus paljastaa epävakautta — antureita
# katoaa ajojen välillä tai CRC-virheitä tulee — silloin tähti haaroitetaan
# omille nastoilleen, ja se on tässä komponentissa pelkkä toinen `one_wire`-
# merkintä eri nastalla.

one_wire:
  - platform: gpio
    pin: GPIO4
    id: bus_a


# Ei yhtäkään `dallas_temp`-sensoria. Ne kirjoitetaan vasta kun osoitteet on
# luettu ja jokainen on kartoitettu sijaintiin lämmittämällä yksi anturi
# kerrallaan ja katsomalla mikä osoite liikkuu.

sensor:
  - platform: wifi_signal
    name: "Wi-Fi"
    update_interval: 60s
    entity_category: diagnostic

  # Ainoa rivi joka erottaa uudelleenkäynnistyksen siitä että lokiasiakas
  # liittyi. Kartoitusajossa se on tarpeen: käynnistysvedos toistuu jokaiselle
  # liittyvälle asiakkaalle, joten osoiteluettelon näkeminen ei yksin todista
  # että laite kävi käynnissä.
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic
