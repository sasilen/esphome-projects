<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 800" width="760" height="800" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="760" height="800" fill="#E9ECEF"/>
  <rect x="20" y="20" width="720" height="760" fill="none" stroke="#A8B3BC"/>

  <text x="40" y="58" font-size="21" font-weight="700" fill="#16212B" letter-spacing="1.5">RJ45 &#8212; MIK&#196; NASTA ON MIK&#196;</text>
  <text x="40" y="80" font-size="12" fill="#5A6772">Sininen pari kantaa 1-Wiren &#183; oranssi pari syötön &#183; luettu vanhasta pistokkeesta</text>
  <line x1="20" y1="98" x2="740" y2="98" stroke="#A8B3BC"/>

  <text x="50" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">RJ45-RASIA EDESTÄ, SALPA ALASPÄIN</text>

  <!-- jack -->
  <rect x="120" y="150" width="400" height="120" rx="6" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <rect x="280" y="270" width="80" height="22" rx="3" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>

  <g stroke="#A8B3BC" stroke-width="1">
    <line x1="160" y1="160" x2="160" y2="235"/><line x1="205" y1="160" x2="205" y2="235"/>
    <line x1="250" y1="160" x2="250" y2="235"/><line x1="295" y1="160" x2="295" y2="235"/>
    <line x1="340" y1="160" x2="340" y2="235"/><line x1="385" y1="160" x2="385" y2="235"/>
    <line x1="430" y1="160" x2="430" y2="235"/><line x1="475" y1="160" x2="475" y2="235"/>
  </g>

  <g font-size="12" font-weight="700" text-anchor="middle">
    <text x="160" y="258" fill="#5A6772">1</text>
    <text x="205" y="258" fill="#5A6772">2</text>
    <text x="250" y="258" fill="#5A6772">3</text>
    <text x="295" y="258" fill="#0E6E7C">4</text>
    <text x="340" y="258" fill="#16212B">5</text>
    <text x="385" y="258" fill="#5A6772">6</text>
    <text x="430" y="258" fill="#5A6772">7</text>
    <text x="475" y="258" fill="#5A6772">8</text>
  </g>

  <rect x="276" y="160" width="38" height="75" fill="#0E6E7C" opacity="0.13"/>
  <rect x="321" y="160" width="38" height="75" fill="#16212B" opacity="0.10"/>

  <text x="295" y="182" font-size="10" font-weight="700" fill="#0E6E7C" text-anchor="middle">DQ</text>
  <text x="340" y="182" font-size="10" font-weight="700" fill="#16212B" text-anchor="middle">GND</text>

  <text x="550" y="176" font-size="11.5" font-weight="700" fill="#0E6E7C">4 = DATA</text>
  <text x="550" y="194" font-size="10.5" fill="#5A6772">sininen</text>
  <text x="550" y="222" font-size="11.5" font-weight="700" fill="#16212B">5 = PALUU</text>
  <text x="550" y="240" font-size="10.5" fill="#5A6772">valkosininen</text>

  <text x="50" y="316" font-size="11.5" fill="#16212B"><tspan font-weight="700">Sininen pari on keskimmäinen pari</tspan>, ja se ei ole sattumaa. RJ11-pistoke istuu RJ45-rasian</text>
  <text x="50" y="334" font-size="11.5" fill="#16212B">keskelle, jolloin sen kuusi nastaa osuvat rasian nastoihin 2&#8211;7.</text>

  <line x1="20" y1="356" x2="740" y2="356" stroke="#A8B3BC"/>

  <text x="50" y="384" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">DS9490R:N RJ11 JA MIHIN SE OSUU</text>

  <rect x="50" y="402" width="300" height="104" rx="4" fill="#FFFFFF" stroke="#A8B3BC"/>
  <g font-size="11" fill="#16212B">
    <text x="70" y="428" font-weight="700">RJ11</text>
    <text x="150" y="428" font-weight="700">signaali</text>
    <text x="270" y="428" font-weight="700">RJ45</text>
    <text x="70" y="452">3</text>
    <text x="150" y="452" fill="#0E6E7C">1-Wire data</text>
    <text x="270" y="452" fill="#0E6E7C" font-weight="700">4</text>
    <text x="70" y="474">4</text>
    <text x="150" y="474">1-Wire paluu</text>
    <text x="270" y="474" font-weight="700">5</text>
    <text x="70" y="496" fill="#5A6772">1, 2, 5, 6</text>
    <text x="150" y="496" fill="#5A6772">ei 1-Wirea</text>
    <text x="270" y="496" fill="#5A6772">2, 3, 6, 7</text>
  </g>

  <text x="376" y="428" font-size="11.5" fill="#16212B"><tspan font-weight="700">Sovitin ajaa väylää loiskäytöllä</tspan>,</text>
  <text x="376" y="446" font-size="11.5" fill="#16212B">eli se tarvitsee vain nämä kaksi</text>
  <text x="376" y="464" font-size="11.5" fill="#16212B">johdinta. Syöttöä se ei anna.</text>
  <text x="376" y="490" font-size="11.5" fill="#16212B">Juuri siksi se on turvallisin tapa</text>
  <text x="376" y="508" font-size="11.5" fill="#16212B">todentaa verkko: VDD:tä ei tarvitse</text>
  <text x="376" y="526" font-size="11.5" fill="#16212B">arvata lainkaan.</text>

  <line x1="20" y1="552" x2="740" y2="552" stroke="#A8B3BC"/>

  <text x="50" y="580" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">SYÖTTÖ ON NASTASSA 2, MAAT NASTOISSA 1 JA 5</text>
  <text x="50" y="602" font-size="11.5" fill="#16212B">Tämän verkon kartta on luettu: <tspan font-weight="700">1 musta GND, 2 punainen 5 V, 4 keltainen data,</tspan></text>
  <text x="50" y="620" font-size="11.5" fill="#16212B"><tspan font-weight="700">5 valkoinen GND.</tspan> Kaksi kokonaista paria: data maansa kanssa sinisessä, syöttö maansa</text>
  <text x="50" y="638" font-size="11.5" fill="#16212B">kanssa oranssissa. VDD ei ole yleisesti vakiintunut &#8212; tässä se on luettu, ei oletettu.</text>

  <rect x="50" y="664" width="660" height="98" fill="#FFFFFF" stroke="#A3301F" stroke-width="1.5"/>
  <rect x="50" y="664" width="6" height="98" fill="#A3301F"/>
  <text x="74" y="690" font-size="12" font-weight="700" fill="#A3301F">MAAT TUNNISTAA ILMAN MITÄÄN VIITETTÄ</text>
  <text x="74" y="714" font-size="11.5" fill="#16212B">Kaksi maata soivat keskenään, koska ne yhdistyvät jokaisen anturin GND-nastassa. Jatkuvuus</text>
  <text x="74" y="732" font-size="11.5" fill="#16212B">kahden RJ45-nastan välillä löytää ne siis pelkästä pistokkeesta, ilman viittausta isäntään.</text>
  <text x="74" y="750" font-size="11.5" fill="#16212B">Data ja syöttö eivät soi mihinkään: toinen on avokollektorin, toinen antureiden VDD:n takana.</text>
</svg>
