# ------------------------------------------------------- Sarjoitettu luku
# **ESPHome ei lukitse väylää muunnoksen ajaksi.** `dallas_temp::update()`
# lähettää CONVERT T:n ja jatkaa `set_timeout`illa, joten niiden 750 ms:n
# aikana pääsilmukka pyörii — ja jokainen toisen anturin `update()` aloittaa
# omalla `reset()`illään, joka vetää linjan alas 480 µs:ksi. Se **keskeyttää
# kesken olevan muunnoksen ja pudottaa vahvan ylösvedon** samalla.
#
# Linuxin w1-alijärjestelmä pitää väylämutexia koko tapahtuman ajan. Siinä on
# se ero Raspberryyn, jota etsittiin koko ilta ylösvedosta ja syötöstä.
#
# Se selittää myös sen mikä oli ristiriitaista: `PollingComponent`-vaiheet
# lukitaan käynnistyksessä ja toistuvat tasan 60 000 ms:n välein, joten samat
# parit törmäävät joka kierros identtisesti — **21 kierrosta ilman yhtään
# poikkeusta.** Ja jos törmäys osuu ikkunan alkuun, ikkunan lyhentäminen
# 750 ms:sta 94 ms:iin ei auta, mikä on juuri se mitä `resolution: 9` -kokeessa
# nähtiin.
#
# Tässä tehdään mitä Linux tekee: anturit irrotetaan omista kelloistaan
# (`update_interval: never`) ja ajetaan yksi kerrallaan. Sekunnin väli kattaa
# 750 ms:n muunnoksen; 22 anturia on 22 s, eli minuuttiin mahtuu reilusti.
#
# **Jos tämä ei auta, hypoteesi kaatuu** eikä ole maksanut kuin yhden
# flashauksen — ja silloin jäljellä on kaapelointi.

interval:
  - interval: 60s
    then:
      - lambda: 'id(t00).update();'   # Keittiö ikkuna sisä
      - delay: 1s
      - lambda: 'id(t01).update();'   # Keittiö ikkuna ulko
      - delay: 1s
      - lambda: 'id(t02).update();'   # Keittiö sisä
      - delay: 1s
      - lambda: 'id(t03).update();'   # Keittiö sisä ovi katto
      - delay: 1s
      - lambda: 'id(t04).update();'   # Kodinhoitohuone sisä ovi katto
      - delay: 1s
      - lambda: 'id(t05).update();'   # Makuuhuone 1 etelä sisä
      - delay: 1s
      - lambda: 'id(t06).update();'   # Makuuhuone 1 länsi
      - delay: 1s
      - lambda: 'id(t07).update();'   # Makuuhuone 1 sisä ovi katto
      - delay: 1s
      - lambda: 'id(t08).update();'   # Makuuhuone 2 itä
      - delay: 1s
      - lambda: 'id(t09).update();'   # Makuuhuone 3 itä
      - delay: 1s
      - lambda: 'id(t10).update();'   # Makuuhuone 3 pohjoinen
      - delay: 1s
      - lambda: 'id(t11).update();'   # Makuuhuone 4 länsi
      - delay: 1s
      - lambda: 'id(t12).update();'   # Makuuhuone 4 pohjoinen sisä
      - delay: 1s
      - lambda: 'id(t13).update();'   # Makuuhuone 4 pohjoinen ulko
      - delay: 1s
      - lambda: 'id(t14).update();'   # Olohuone sisä
      - delay: 1s
      - lambda: 'id(t15).update();'   # Olohuone sisä ovi katto
      - delay: 1s
      - lambda: 'id(t16).update();'   # Olohuone ulko
      - delay: 1s
      - lambda: 'id(t17).update();'   # Vaatehuone etelä sisä
      - delay: 1s
      - lambda: 'id(t18).update();'   # Vaatehuone etelä ulko
      - delay: 1s
      - lambda: 'id(t19).update();'   # Nimeämätön DS18S20
      - delay: 1s
      - lambda: 'id(t20).update();'   # Leivinuuni 1
      - delay: 1s
      - lambda: 'id(t21).update();'   # Leivinuuni 2
      - delay: 1s
      - lambda: 'id(t22).update();'   # Leivinuuni 3
      - delay: 1s
      - lambda: 'id(t23).update();'   # Tuntematon 28 FF90D8
      - delay: 1s
