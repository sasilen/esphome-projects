# Talon 1-Wire-väylä — ESP32-C3 + 19 DS18B20:tä
#
# Osoitteet on **laskettu vanhan OWFS-toteutuksen kartasta**, ei luettu väylältä.
# OWFS kirjoittaa osoitteen muodossa perhekoodi.sarjanumero ja ESPHome täytenä
# 64-bittisenä ROM-osoitteena; muunnos on sarjatavujen käännös ja Dallasin
# CRC8 päälle. CRC ei ole satunnainen vaan laskettu muista tavuista, joten
# täysi osoite on johdettavissa ilman että väylään kosketaan.
#
# **Tarkista silti ensimmäisellä käynnistyksellä.** Jos jokin osoite ei vastaa
# mitään laitetta, ESPHome sanoo sen suoraan — ja silloin tavujärjestys on
# väärinpäin, mikä on muunnoksen ainoa epävarma kohta.
#
# Kytkentä on wiring.svg:ssä. Neljä johdinta: RJ45:n nasta 2 on 5 V, nasta 4 on
# data GPIO4:ään, nastat 1 ja 5 ovat maita. Ylösveto 4,7 kΩ GPIO4:n ja 3V3:n
# välissä, C3:n päässä — ei verkkoon.

esphome:
  name: onewire
  friendly_name: 1-Wire

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# **DEBUG eikä INFO.** Väylän luettelo löydetyistä osoitteista tulostuu
# CONFIG-tason viesteinä käynnistysvedoksessa, ja INFO vaientaa ne. Se luettelo
# on ainoa tapa nähdä laitteet joita **ei** ole tässä konfiguraatiossa — kartta
# on vuodelta 2020 ja verkko on kasvanut kerran jo sen jälkeen.
#
# **`level: CONFIG` ei kelpaa**, vaikka viestit ovat sen tasoisia: ESPHome
# hyväksyy vain NONE, ERROR, WARN, INFO, DEBUG, VERBOSE ja VERY_VERBOSE. DEBUG
# on siis matalin taso joka näyttää vedoksen.
#
# Hinta on jaarittelu: kaksikymmentä anturia minuutin välein tarkoittaa noin
# kahtakymmentä riviä minuutissa. **Laske INFO:on kun osoitteet on vahvistettu**
# — siihen asti luettelo on tärkeämpi kuin hiljaisuus.
logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "1-Wire fallback"
    password: !secret ap_password

captive_portal:


# ----------------------------------------------------------------- 1-Wire
# GPIO4 samasta syystä kuin stiebelin solmussa: SuperMinillä se on samalla
# reunalla kuin 3V3 ja GND, eikä se ole strappausnasta. GPIO2, GPIO8 ja GPIO9
# ovat, ja GPIO8 ajaa lisäksi levyn LEDiä.

one_wire:
  - platform: gpio
    pin: GPIO4
    id: bus_a


# ------------------------------------------------------------------ Anturit
# Huonekoodit on laajennettu vanhan OWFS-kartan lyhenteistä: K on keittiö, KHH
# kodinhoitohuone, MH1-MH4 makuuhuoneet, OH olohuone. **Paikkasanat on jätetty
# ennalleen** — "sisä", "ulko", "itä", "ovi katto" ovat mittauksen kuvauksia
# eikä niitä tulkita uudelleen.
#
# Pari "sisä" ja "ulko" samassa paikassa tarkoittaa rakenteen kahta puolta, ei
# huoneilmaa. Alkuperäinen lyhennemuoto on kunkin anturin OWFS-kommentissa.
#
# **VH on laajennettu vaatehuoneeksi omistajan muistin mukaan**, ei aineistosta.
# Anturit ovat eteläseinän sisä- ja ulkoparina, mikä sopisi yhtä hyvin
# vierashuoneeseen — lyhenne säilyy OWFS-kommentissa, jos se joskus osoittautuu
# toiseksi.
#
# Muunnosnopeus on 750 ms per anturi täydellä 12 bitin tarkkuudella, ja näitä
# on kaksikymmentä. Jos väyläaika alkaa painaa, `resolution: 11` puolittaa sen
# ja jättää tarkkuudeksi 0,125 astetta — enemmän kuin rakenteen lämpötilalta
# tarvitaan.

sensor:
  - platform: dallas_temp
    one_wire_id: bus_a
    address: 0x0E0004755A26FF28          # 28.FF265A750400
    name: "Keittiö ikkuna sisä"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 60s

