# --------------------------------------------------------------- Ovisensorit
# Kuusi DS2406:tta ovat **ovikoskettimia**. Se selittää sen mikä näytti
# oudolta: yksi latch per asennusvaihe ei ollut erikoista, vaan huone
# asennettiin kerralla — lämpötila-anturit ja oven kosketin samaan syssyyn.
#
# **Nimenä on sarjanumero.** Asennusvaihe kertoo milloin eikä mitä ovea, ja
# neljäs vaihe lisäsi kaksi latchia kolmeen huoneeseen. Oven avaaminen kertoo
# sen minuutissa — ja **nimeä ei vaihdeta täällä vaan HA:ssa**, muuten
# entity_id vaihtuu ja historia katkeaa.
#
# **`inverted:` on arvaus.** Kumpi taso on auki selviää avaamalla yksi ovi.
#
# **`latch: true` poistaa minuutin sokean hetken.** Sarjoituksen takia ovia
# pollataan kerran kierroksessa, joten nopea avaus ja sulkeminen jäisi
# huomaamatta — mutta piiri muistaa sen. Ohjaustavussa on silloin ALR=1, joka
# palauttaa salvan tilan ja **nollaa sen samalla**, jolloin jokainen kierros
# vastaa kysymykseen "liikkuiko ovi edellisen jälkeen".
#
# Julkaistu tila tarkoittaa siis **auki nyt tai ollut auki välissä**. Se on
# ovelle oikea merkitys: yhden kierroksen mittainen "auki" on totta jostakin
# hetkestä sen sisällä, ja vaihtoehto olisi ettei tapahtumaa näy lainkaan.
#
# **Yksi asia varmistuu vasta ensimmäisellä ajolla.** Datalehden mukaan Channel
# Info lähetetään ennen nollausta, eli salvan tilan pitäisi näkyä. Jos
# `latch=NO` on jatkuvasti vaikka ovia liikutellaan, nollaus tapahtuukin ennen
# raportointia — ja silloin tämä ominaisuus ei toimi tällä tavalla.

binary_sensor:
  - platform: ds2406
    one_wire_id: bus_a
    id: d0
    address: 0x3F000000B62E8912      # 12.892EB6000000 · keittiö
    name: "Ovi 892EB6"
    device_class: door
    channel: A
    latch: true
    update_interval: never
  - platform: ds2406
    one_wire_id: bus_a
    id: d1
    address: 0x2B000000B62E3712      # 12.372EB6000000 · makuuhuoneet
    name: "Ovi 372EB6"
    device_class: door
    channel: A
    latch: true
    update_interval: never
  - platform: ds2406
    one_wire_id: bus_a
    id: d2
    address: 0xB6000000B637BC12      # 12.BC37B6000000 · olohuone
    name: "Ovi BC37B6"
    device_class: door
    channel: A
    latch: true
    update_interval: never
  - platform: ds2406
    one_wire_id: bus_a
    id: d3
    address: 0x38000000B6302E12      # 12.2E30B6000000 · neljäs vaihe
    name: "Ovi 2E30B6"
    device_class: door
    channel: A
    latch: true
    update_interval: never
  - platform: ds2406
    one_wire_id: bus_a
    id: d4
    address: 0xF0000000B62DA812      # 12.A82DB6000000 · neljäs vaihe
    name: "Ovi A82DB6"
    device_class: door
    channel: A
    latch: true
    update_interval: never
  - platform: ds2406
    one_wire_id: bus_a
    id: d5
    address: 0xC0000000B62E3212      # 12.322EB6000000 · ei kartassa
    name: "Ovi 322EB6"
    device_class: door
    channel: A
    # **Ainoa ilman salpaa, ja se on pakko.** `ALR=1` nollaa *molempien*
    # kanavien salvat — se todettiin siitä että ensimmäinen A-kanavan luku
    # nollasi myös B:n salvan. Tällä piirillä B on se jota kannattaa vahtia,
    # joten A luetaan ALR=0:lla eikä se häiritse B:n lukua.
    latch: false
    update_interval: never

  - platform: ds2406
    one_wire_id: bus_a
    id: b5
    address: 0xC0000000B62E3212      # sama piiri, toinen kanava
    # **Tämä ei ole ovi.** PIOB vaihtaa tilaa itsestään viiden-kahdeksan
    # minuutin välein, ja ovi ei tee niin. Se on jokin joka kytkeytyy päälle ja
    # pois: pumppu, puhallin, termostaatti tai vastaava.
    #
    # Viidellä muulla latchilla PIOB on vakaasti korkealla eli kytkemättä.
    # Tämä on ainoa jonka molemmat kanavat ovat käytössä — ja samalla se ainoa
    # latch jota ei ole vuoden 2020 kartassa.
    #
    # **Nimi kertoo mitä tiedetään eikä mitä arvataan.** Rytmi tallentuu nyt
    # HA:han, ja tunnistus käy vertaamalla mihin muuhun se osuu yksiin.
    name: "Tuntematon tulo 322EB6 B"
    channel: B
    latch: true
    update_interval: never


# ------------------------------------------------- B-kanavat, koeluontoisesti
# **Viiden oven PIOA ei liikkunut kertaakaan.** 360 lukemaa kukin yön aikana ja
# nolla salpaa, eikä myöskään silloin kun ulko-ovea käytettiin. PIOA on
# pysyvästi matalalla, mikä sopii kiinni olevaan koskettimeen — mutta myös
# siihen ettei siinä ole kosketinta lainkaan.
#
# Nämä viisi lukevat saman piirin **toisen kanavan**, jotta yksi oven avaus
# testaa molemmat nastat kerralla. Jos kosketin onkin PIOB:ssä ylösvedon
# kanssa, korkea tarkoittaa kiinni ja avaus vetää sen alas.
#
# **`latch: false` on pakko.** `ALR=1` nollaa molempien kanavien salvat, ja
# A-kanava luetaan tässä ensin — B:n salpa olisi siis aina nolla. Tasolukema
# riittää kokeeseen: pidä ovi auki yli minuutin, niin pollaus osuu varmasti.
#
# **Nämä ovat koe eivätkä kalusto.** Jos PIOB osoittautuu tyhjäksi, ne
# poistetaan — ja jos se on se oikea kanava, nimet vaihtuvat kerran.

  - platform: ds2406
    one_wire_id: bus_a
    id: b0
    address: 0x3F000000B62E8912      # 892EB6 · keittiö
    name: "Tuntematon tulo 892EB6 B"
    channel: B
    latch: false
    update_interval: never
  - platform: ds2406
    one_wire_id: bus_a
    id: b1
    address: 0x2B000000B62E3712      # 372EB6 · makuuhuoneet
    name: "Tuntematon tulo 372EB6 B"
    channel: B
    latch: false
    update_interval: never
  - platform: ds2406
    one_wire_id: bus_a
    id: b2
    address: 0xB6000000B637BC12      # BC37B6 · olohuone
    name: "Tuntematon tulo BC37B6 B"
    channel: B
    latch: false
    update_interval: never
  - platform: ds2406
    one_wire_id: bus_a
    id: b3
    address: 0x38000000B6302E12      # 2E30B6 · neljäs vaihe
    name: "Tuntematon tulo 2E30B6 B"
    channel: B
    latch: false
    update_interval: never
  - platform: ds2406
    one_wire_id: bus_a
    id: b4
    address: 0xF0000000B62DA812      # A82DB6 · neljäs vaihe
    name: "Tuntematon tulo A82DB6 B"
    channel: B
    latch: false
    update_interval: never

