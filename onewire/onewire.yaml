# Talon 1-Wire-väylä — ESP32-C3 + 19 DS18B20:tä
#
# Osoitteet on **laskettu vanhan OWFS-toteutuksen kartasta**, ei luettu väylältä.
# OWFS kirjoittaa osoitteen muodossa perhekoodi.sarjanumero ja ESPHome täytenä
# 64-bittisenä ROM-osoitteena; muunnos on sarjatavujen käännös ja Dallasin
# CRC8 päälle. CRC ei ole satunnainen vaan laskettu muista tavuista, joten
# täysi osoite on johdettavissa ilman että väylään kosketaan.
#
# **Väylä on vahvistanut tämän.** Ensimmäinen luettelointi löysi 19 näistä
# 20:stä sellaisenaan, eli tavujärjestys oli oikein. Ainoa joka puuttuu on
# DS18S20 `10.0ED2A0020800`, joka oli isännän pään laite — samasta päästä
# puuttuu myös DS2438, ja ne katosivat yhdessä.
#
# **Mutta vain viisi antaa lukeman; neljätoista palauttaa `nan`.** Loki nimeää
# syyn: `dropping reading caused by sensor reset` eli rekisterissä on tasan
# 85,0 °C ja tavu 6 on 0x0C. Anturi vastaa, CRC on kunnossa — **ne puhuvat
# mutta eivät muunna.**
#
# Jako on kategorinen eikä asteittainen: 21 kierrosta, 5/5 onnistui ja 14/14
# epäonnistui, ei yhtään poikkeusta kumpaankaan suuntaan.
#
# **Isännän sähkö ei ole syy.** ESPHome jättää nastan OUTPUT-tilaan ajamaan
# linjaa ylös push-pullina, eli vahva ylösveto on päällä koko muunnoksen ajan.
#
# **Isännän ohjelmisto voi silti olla.** `dallas_temp` ei lukitse väylää
# muunnoksen ajaksi, joten toisen anturin `update()` keskeyttää sen — ja juuri
# siinä on ero Raspberryyn, jonka w1-ajuri pitää mutexia. Anturit ajetaan nyt
# sarjassa; perustelu on alempana sarjoituslohkossa.
#
# Koko päättelyketju kumottuine välivaiheineen on CLAUDE.md:ssä.
#
# Kytkentä on wiring.svg:ssä. Neljä johdinta: RJ45:n nasta 2 on 5 V, nasta 4 on
# data GPIO4:ään, nastat 1 ja 5 ovat maita. Ylösveto 4,7 kΩ GPIO4:n ja 3V3:n
# välissä, C3:n päässä — ei verkkoon.

esphome:
  name: onewire
  friendly_name: 1-Wire

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# **DEBUG eikä INFO.** Väylän luettelo löydetyistä osoitteista tulostuu
# CONFIG-tason viesteinä käynnistysvedoksessa, ja INFO vaientaa ne. Se luettelo
# on ainoa tapa nähdä laitteet joita **ei** ole tässä konfiguraatiossa — kartta
# on vuodelta 2020 ja verkko on kasvanut kerran jo sen jälkeen.
#
# **`level: CONFIG` ei kelpaa**, vaikka viestit ovat sen tasoisia: ESPHome
# hyväksyy vain NONE, ERROR, WARN, INFO, DEBUG, VERBOSE ja VERY_VERBOSE. DEBUG
# on siis matalin taso joka näyttää vedoksen.
#
# Hinta on jaarittelu: kaksikymmentä anturia minuutin välein tarkoittaa noin
# kahtakymmentä riviä minuutissa.
#
# **Osoitteet on nyt vahvistettu, ja taso pysyy silti DEBUGissa.** Alkuperäinen
# peruste täyttyi, mutta tilalle tuli parempi: `Got Temperature=nan` kertoo
# anturikohtaisesti kumpaan joukkoon kukin kuuluu, ja se on se mittari jolla
# ylösvedon vaihdon onnistuminen luetaan. **Laske INFO:on kun väylä lukee.**
logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Oletus LIGHT nukuttaa radion majakkavälien välissä, ja megatavun OTA on
  # tuhansia kuittauskierroksia joista jokaiseen tulee herätysviive. Tämä on
  # repon vakiosuositus heikkoon radioon ja katkeileviin OTA-lähetyksiin.
  power_save_mode: NONE
  ap:
    ssid: "1-Wire fallback"
    password: !secret ap_password

captive_portal:


# ----------------------------------------------------------------- 1-Wire
# GPIO4 samasta syystä kuin stiebelin solmussa: SuperMinillä se on samalla
# reunalla kuin 3V3 ja GND, eikä se ole strappausnasta. GPIO2, GPIO8 ja GPIO9
# ovat, ja GPIO8 ajaa lisäksi levyn LEDiä.

one_wire:
  - platform: gpio
    pin: GPIO4
    id: bus_a


# ------------------------------------------------------------------ Anturit
# Huonekoodit on laajennettu vanhan OWFS-kartan lyhenteistä: K on keittiö, KHH
# kodinhoitohuone, MH1-MH4 makuuhuoneet, OH olohuone. **Paikkasanat on jätetty
# ennalleen** — "sisä", "ulko", "itä", "ovi katto" ovat mittauksen kuvauksia
# eikä niitä tulkita uudelleen.
#
# Pari "sisä" ja "ulko" samassa paikassa tarkoittaa rakenteen kahta puolta, ei
# huoneilmaa. Alkuperäinen lyhennemuoto on kunkin anturin OWFS-kommentissa.
#
# **VH on laajennettu vaatehuoneeksi omistajan muistin mukaan**, ei aineistosta.
# Anturit ovat eteläseinän sisä- ja ulkoparina, mikä sopisi yhtä hyvin
# vierashuoneeseen — lyhenne säilyy OWFS-kommentissa, jos se joskus osoittautuu
# toiseksi.
#
# **`resolution: 9` kokeiltiin neljällätoista ja se ei auttanut.** Ei yhtään
# lukemaa, ei yhtäkään kierrosta. Asetus on siksi poistettu: epäonnistunutta
# koetta ei jätetä paikalleen, koska seuraava lukija luulisi sitä valinnaksi.
#
# **Älä myöskään laske ylösvetoa.** Se oli tässä ohjeena kahdesti ja on kumottu:
# ESPHome ajaa linjaa ylös push-pullina muunnoksen ajan, joten isäntä ei ole
# se joka jättää virtaa antamatta. Pienempi vastus ei lisäisi mitään.
#
# Kolmas kokeiltava sen sijaan on kesken, ja se on alempana: **väylää ei
# lukita muunnoksen ajaksi.** Anturit ajetaan nyt sarjassa `interval`-lohkosta,
# ja se on ensimmäinen selitys joka osoittaa isännän *ohjelmistoon* eikä
# sähköön. Perustelu on sarjoituslohkon kommentissa.
#
# `device_class`, `state_class`, `unit_of_measurement` ja `accuracy_decimals`
# eivät ole tässä, koska **`dallas_temp` asettaa ne jo itse** — asteet,
# yksi desimaali, lämpötila, mittaus. Kirjoitettuina ne olivat kahdeksankymmentä
# riviä jotka eivät tee mitään.

sensor:
  - platform: dallas_temp
    one_wire_id: bus_a
    id: t00
    address: 0x0E0004755A26FF28          # 28.FF265A750400
    name: "Keittiö ikkuna sisä"
    update_interval: never

