# --------------------------------------------------------------- Perhe 3B
# Kolme laitetta joita ei ole vuoden 2020 kartassa lainkaan. Perhe 0x3B on
# **todennäköisesti leivinuunin anturit**, koska DS18B20 loppuu +125 °C:een
# eikä uuni pysy siellä — mutta se on päättely, ei aineistoa, joten nimet ovat
# toistaiseksi sarjanumeroita. Nimeäminen myöhemmin katkaisee HA:n historian,
# joten se tehdään kerran ja vasta kun asia on varma.
#
# **`dallas_temp` lukee nämä ilman erillistä komponenttia.** Se erikoiskäsittelee
# vain perheen 0x10 ja kohtelee kaikkea muuta DS18B20:nä — perhekoodia ei
# tarkisteta lainkaan.
#
# **Nämä lukevat, ja ne ovat MAX31850:itä.** Kolme kolmesta joka kierroksella,
# 23,5–24,25 °C eli huoneenlämpöä. Skaalaus on siis oikein eikä `multiply`-
# suodatinta tarvita.
#
# Piirin tunnistaa askeleesta. Lukemat liikkuvat **0,25 °C:n portain** —
# 23,50 · 23,75 · 24,00 · 24,25 — kun taas 12 bitin DS18B20 antaa samassa
# lokissa 25,0625. **0,25 °C on MAX31850:n termoparitarkkuus**; DS1825 antaisi
# 0,0625:n portaita. Perheen toinen piiri on siis poissuljettu mittaamalla.
#
# Termopari tarkoittaa korkeaa lämpötilaa — kukaan ei mittaa huoneilmaa
# K-tyypin parilla — joten leivinuunioletus vahvistui. **Se ei silti ole vielä
# todistettu.** Uunin lämmittäminen kymmeneksi minuutiksi todistaisi sen, ja
# vasta sitten nämä nimetään kerran.
#
# Ne saavat myös virtaa, toisin kuin se neljätoista. Ne ovat siis verkon
# syötetyssä osassa.

  - platform: dallas_temp
    one_wire_id: bus_a
    id: t20
    address: 0x000000001916163B          # 3B.161619000000
    name: "Tuntematon 3B 161619"
    update_interval: never

  - platform: dallas_temp
    one_wire_id: bus_a
    id: t21
    address: 0xCC0000001915A13B          # 3B.A11519000000
    name: "Tuntematon 3B A11519"
    update_interval: never

  - platform: dallas_temp
    one_wire_id: bus_a
    id: t22
    address: 0x6D0000001870913B          # 3B.917018000000
    name: "Tuntematon 3B 917018"
    update_interval: never

  - platform: wifi_signal
    name: "Wi-Fi"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic


# ------------------------------------------------------- Sarjoitettu luku
# **ESPHome ei lukitse väylää muunnoksen ajaksi.** `dallas_temp::update()`
# lähettää CONVERT T:n ja jatkaa `set_timeout`illa, joten niiden 750 ms:n
# aikana pääsilmukka pyörii — ja jokainen toisen anturin `update()` aloittaa
# omalla `reset()`illään, joka vetää linjan alas 480 µs:ksi. Se **keskeyttää
# kesken olevan muunnoksen ja pudottaa vahvan ylösvedon** samalla.
#
# Linuxin w1-alijärjestelmä pitää väylämutexia koko tapahtuman ajan. Siinä on
# se ero Raspberryyn, jota etsittiin koko ilta ylösvedosta ja syötöstä.
#
# Se selittää myös sen mikä oli ristiriitaista: `PollingComponent`-vaiheet
# lukitaan käynnistyksessä ja toistuvat tasan 60 000 ms:n välein, joten samat
# parit törmäävät joka kierros identtisesti — **21 kierrosta ilman yhtään
# poikkeusta.** Ja jos törmäys osuu ikkunan alkuun, ikkunan lyhentäminen
# 750 ms:sta 94 ms:iin ei auta, mikä on juuri se mitä `resolution: 9` -kokeessa
# nähtiin.
#
# Tässä tehdään mitä Linux tekee: anturit irrotetaan omista kelloistaan
# (`update_interval: never`) ja ajetaan yksi kerrallaan. Sekunnin väli kattaa
# 750 ms:n muunnoksen; 22 anturia on 22 s, eli minuuttiin mahtuu reilusti.
#
# **Jos tämä ei auta, hypoteesi kaatuu** eikä ole maksanut kuin yhden
# flashauksen — ja silloin jäljellä on kaapelointi.

interval:
  - interval: 60s
    then:
      - lambda: 'id(t00).update();'   # Keittiö ikkuna sisä
      - delay: 1s
      - lambda: 'id(t01).update();'   # Keittiö ikkuna ulko
      - delay: 1s
      - lambda: 'id(t02).update();'   # Keittiö sisä
      - delay: 1s
      - lambda: 'id(t03).update();'   # Keittiö sisä ovi katto
      - delay: 1s
      - lambda: 'id(t04).update();'   # Kodinhoitohuone sisä ovi katto
      - delay: 1s
      - lambda: 'id(t05).update();'   # Makuuhuone 1 etelä sisä
      - delay: 1s
      - lambda: 'id(t06).update();'   # Makuuhuone 1 länsi
      - delay: 1s
      - lambda: 'id(t07).update();'   # Makuuhuone 1 sisä ovi katto
      - delay: 1s
      - lambda: 'id(t08).update();'   # Makuuhuone 2 itä
      - delay: 1s
      - lambda: 'id(t09).update();'   # Makuuhuone 3 itä
      - delay: 1s
      - lambda: 'id(t10).update();'   # Makuuhuone 3 pohjoinen
      - delay: 1s
      - lambda: 'id(t11).update();'   # Makuuhuone 4 länsi
      - delay: 1s
      - lambda: 'id(t12).update();'   # Makuuhuone 4 pohjoinen sisä
      - delay: 1s
      - lambda: 'id(t13).update();'   # Makuuhuone 4 pohjoinen ulko
      - delay: 1s
      - lambda: 'id(t14).update();'   # Olohuone sisä
      - delay: 1s
      - lambda: 'id(t15).update();'   # Olohuone sisä ovi katto
      - delay: 1s
      - lambda: 'id(t16).update();'   # Olohuone ulko
      - delay: 1s
      - lambda: 'id(t17).update();'   # Vaatehuone etelä sisä
      - delay: 1s
      - lambda: 'id(t18).update();'   # Vaatehuone etelä ulko
      - delay: 1s
      - lambda: 'id(t19).update();'   # Nimeämätön DS18S20
      - delay: 1s
      - lambda: 'id(t20).update();'   # Tuntematon 3B 161619
      - delay: 1s
      - lambda: 'id(t21).update();'   # Tuntematon 3B A11519
      - delay: 1s
      - lambda: 'id(t22).update();'   # Tuntematon 3B 917018

