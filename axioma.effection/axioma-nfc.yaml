# Axioma Qalcosonic W1 — the NFC route
#
# **This is a second node, not a replacement.** `axioma.effection.yaml`
# stays up with the CC1101 until an NFC read has told us whether the meter's
# radio is switched on at all. That is the only question the radio node can
# still answer, and dismantling it before the answer closes it permanently.
#
# Wiring: `nfc-c3-mount.svg`. Rationale and polling budget: `CLAUDE.md`.
#
# ---------------------------------------------------------------------
# STAGE 1 — PASSED
#
# This file was flashed first without SPI and without the NFC component,
# because **Wi-Fi, the API and OTA have to be verified separately from
# whether the component's configuration is right.** Two unknowns at once is
# one too many.
#
# That order earned itself twice over: on a bare board `BOOT` and `RESET`
# can be pressed with a finger before the header takes the space beside
# them, and after soldering the same skeleton served as a functional test —
# the board came up and joined the network, which proves that no strapping
# pin (`GPIO2`, `GPIO8`, `GPIO9`) is being held.
#
# **And it earned itself a third time.** Stage 2 was once commented out as
# an isolation experiment when the device disappeared from the network, and
# returning to a known-good skeleton cost one build. Without the component
# the node stayed up — but that does not yet point at the component,
# because `power_save_mode: NONE` was added at the same time and the two
# had never been tried together.
#
# To repeat the experiment: comment out from the `external_components` line
# to the end.
# ---------------------------------------------------------------------

esphome:
  name: axioma-nfc
  friendly_name: Axioma NFC

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  # **EXPERIMENT, not committed: `hardware_uart` removed entirely.**
  #
  # Compared across three nodes, this line is now the only difference left:
  #
  #   onewire    C3, same room, ESPHome 2026.9.0, DEBUG, no hardware_uart   works
  #   wpc-can    C3, ESPHome 2026.9.0, INFO, no hardware_uart               works
  #   axioma-nfc C3, ESPHome 2026.9.0, tried both levels, USB_SERIAL_JTAG   fails
  #
  # Two working nodes at different log levels, and neither has the line.
  # Lowering the level to INFO was tested and changed nothing — but that
  # tested the volume, not whether the USB Serial/JTAG peripheral is in use
  # at all. Those are different things.
  #
  # With `hardware_uart` omitted, ESPHome logs to `UART0` — exactly what the
  # two working nodes do. The cost is that the serial log over USB
  # disappears; verify from the server with `ping` or `esphome logs`
  # instead.
  #
  # If this is the cause, the meter still reads — the NFC side does not
  # depend on logging — and the log comes back over the API.
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # **No password**, same as the repo's other nodes: a bare `encryption:`
    # rejects unencrypted uploads and leans on the API key.
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # **`power_save_mode: NONE` was here and it was never a fix.**
  #
  # It was added on the strength of a single successful association and
  # flagged at the time as a hypothesis. Removing it changed nothing: the
  # node fails to associate with it and without it, on two different
  # boards, at every signal level from −53 to −88 dB. It is gone because a
  # setting that fixes nothing gets read later as a choice.
  #
  # **If Wi-Fi is still the problem, the next thing to try costs one flash
  # and no soldering:**
  #
  #   output_power: 8.5dB
  #
  # That lowers the transmit current peak by roughly two-thirds. If the
  # cause is a supply dip during a burst it may get through where full
  # power does not; if the cause is the antenna being detuned by the
  # PN5180's ground plane, it will not help. See CLAUDE.md.

  # **A static address, and it is instrumentation rather than a fix.**
  #
  # The address is the owner's, given for this node, and it has to stay
  # **outside the router's DHCP pool.** A collision is intermittent and
  # presents as a node that is sometimes unreachable — indistinguishable
  # from the fault being investigated here, and therefore able to spoil the
  # measurement rather than merely inconvenience it.
  #
  # **`dns1` is `.2`, not the gateway.** The resolver on this network is a
  # separate host, so do not "correct" it to `.1` — that is the kind of
  # tidying that looks right and quietly breaks name resolution. It matters
  # little to this node either way, since the API and OTA are reached by
  # address, but wrong is wrong.
  #
  # **It cannot fix the current symptom, and that is worth stating so it is
  # not read later as an attempted cure.** A static address removes DHCP,
  # and DHCP happens *after* association, authentication and the four-way
  # handshake. What fails now is the handshake — `Auth Expired`,
  # `4-Way Handshake Timeout` — i.e. a step upstream of the one this
  # removes. It was also tried once already and changed nothing.
  #
  # **What it buys is observability, and that changed when the logger did.**
  # With `hardware_uart` removed the serial log is gone, so the only way to
  # watch this node is from the server — and mDNS has already misled once
  # here, with `esphome` still resolving a stale address after it had been
  # changed. A fixed address plus `use_address` takes mDNS out of the chain
  # entirely:
  #
  #   ping -c 3 192.168.1.42        answers = the handshake completed
  #   no answer                      it did not, and no log is needed to know
  #
  # That turns a question that needed a serial cable into one command.
  manual_ip:
    static_ip: 192.168.1.42
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.2

  # **Point the tooling at the address, not at the name.** Without this
  # `esphome` resolves `axioma-nfc.local` over mDNS, which is the part that
  # went stale before. This is a tooling setting and does not affect the
  # device's own behaviour.
  use_address: 192.168.1.42

  ap:
    ssid: "Axioma NFC fallback"
    password: !secret ap_password

captive_portal:

sensor:
  - platform: wifi_signal
    name: "Wi-Fi"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

# ---------------------------------------------------------------------
# STAGE 2 — ONLY ONCE THE BOARD IS VERIFIED AND SOLDERED
#
# The key names are **verified from the source**, not from the README:
# `components/qalcosonicnfc/__init__.py`. In this project the README has
# been wrong three times, and this time too the first guess was wrong on
# every key — the component's name, the pins' prefix, and whether a
# separate `spi:` block is needed.
#
# **No separate `spi:` block is needed.** The component's `AUTO_LOAD`
# includes `spi` and it takes all six pins as its own options. If
# validation still complains about a missing SPI bus, that is the first
# thing to try.
#
# **The source is pinned to a commit, not a branch**, as in the radio node:
# `@main` is a moving reference, and the same YAML can build differently
# without anything changing in the repo.

external_components:
  - source:
      type: git
      url: https://github.com/dbmaxpayne/esphome_qalcosonicnfc
      ref: bed6773b803a7ebf71613585aad8a73376d38b8e
    components: [qalcosonicnfc]
    refresh: never

qalcosonicnfc:
  # Pins from `nfc-c3-mount.svg`, orientation A.
  #
  # **Two pins to avoid, both learned the hard way — see CLAUDE.md:**
  #
  #   `GPIO20` `GPIO21`   UART0. They are free as far as the logger is
  #                       concerned, and they still hang the boot at
  #                       `Using HW SPI: SPI2_HOST`. Do not use them for
  #                       SPI control lines.
  #
  # And verify the board's pins before soldering — `pintesti.yaml`. The
  # first C3 used here had dead `GPIO5` and `GPIO6` pads, which cost an
  # evening because continuity measured fine and only a driven pin revealed
  # it.
  pn5180_rst_pin: GPIO5      # RST   — header pin
  pn5180_nss_pin: GPIO6      # NSS   — header pin
  pn5180_mosi_pin: GPIO7     # MOSI  — header pin
  pn5180_busy_pin: GPIO10    # BUSY  — header pin
  # **MISO and SCK are swapped relative to the first drawing, and that is
  # fine.** They were soldered the other way round, and on the C3 SPI goes
  # through the GPIO matrix — either pin serves either signal, and ESPHome
  # takes them from here. Changing two lines was cheaper and safer than
  # desoldering two wires beside a mounted C3.
  pn5180_miso_pin: GPIO4     # MISO  — enamelled wire
  pn5180_sck_pin: GPIO3      # SCK   — enamelled wire

  # **Fifteen minutes, and it knowingly exceeds the budget written below.**
  #
  # One successful read takes **1027 ms** — the `took a long time for an
  # operation` warning reports it directly. At 15 min that is 96 reads a day,
  # about 98.6 s/day, i.e. **roughly 49 min/month against an assumed budget
  # of 20 min/month: about 250 %.**
  #
  #   15 min   96 reads   98.6 s/day   ~250 %   ← here
  #    1 h     24 reads   24.6 s/day     62 %
  #    2 h     12 reads   12.3 s/day     31 %
  #    3 h      8 reads    8.2 s/day     21 %
  #
  # **The budget is now the weakest number in the chain, not the interval.**
  # The 20 min/month credit is a general figure that has never been verified
  # on this meter, and there is a working counter-example:
  # `kosla-dev/qalcosonic-w1-nfc-reader` reads the same meter with the same
  # component **every 300 s** — 288 reads a day, about 148 min/month by this
  # same arithmetic, i.e. seven times the assumed budget — and reports no
  # trouble with it. Either the credit is much larger than 20 min/month, or
  # it is not consumed the way this file assumed.
  #
  # Both cannot be true at once, and **the only way to learn which is to
  # exceed the assumed figure and watch.** A margin chosen against a number
  # that may be wrong protects nothing; it only postpones finding out.
  #
  # **Being wrong is cheap and visible, which is what makes this safe.** If
  # the credit does run out the interface locks until the hour turns, nothing
  # breaks, no setting is lost, and the `Consecutive read errors` sensor below
  # rises. That sensor is the experiment's instrument — if it stays at zero
  # for a month, the credit is measured rather than assumed. If it starts
  # climbing, raise the interval and the answer is still cheaper than the
  # guess it replaced.
  #
  # **Totals are correct at any interval** — water is cumulative. What 15 min
  # buys over an hour is four samples per hour instead of one, so Home
  # Assistant's hourly statistics stop being a single point, and a running
  # toilet shows up the same day rather than the next.
  #
  # The bench value of 2 min would be 720 reads a day, which is another
  # sevenfold on top of this. That one stays out.
  #
  # Old text, kept because the reasoning still applies:
  #
  # The meter's communication credit is about 20 min/month, i.e. 40 s/day,
  # and a two-minute interval is 720 reads per day — roughly 36 times over.
  # When the limit is reached the interface locks until the hour turns, and
  # it returns no error: the read simply fails and the old value stays put,
  # looking fresh.
  #
  # **During the build this is still harmless**, and the reason is worth
  # knowing: credit is consumed by an NFC transaction with the meter. A
  # failed attempt — the PN5180 not answering, or the alignment missing the
  # coil — does not communicate with the meter at all and consumes nothing.
  # **The interval only starts costing from the first successful read.**
  update_interval: 15min

  # **Required, although it looks optional.** `timepoint_sensor` is the
  # component's only entity whose default is an empty `{}` rather than
  # `{name: ...}`: the name's default is declared in the inner schema and
  # `.extend(text_sensor_schema())` redeclares the same key without one.
  # Without this block validation fails with
  # `At least one of 'id:' or 'name:' is required!` and does not say where.
  timepoint_sensor:
    name: "Meter timestamp"
    timezone: Europe/Helsinki
    entity_category: diagnostic

  water_usage_sensor:
    name: "Water usage"
  water_flow_sensor:
    name: "Water flow"
  water_temperature_sensor:
    name: "Water temperature"
  battery_level_sensor:
    name: "Battery"
    entity_category: diagnostic

  # **The failure mode is silence, so it is made visible.** When the credit
  # is exhausted the interface locks until the hour turns and returns no
  # error — the read simply fails and the old value keeps looking fresh.
  # This counter is the line that separates "no change" from "no
  # visibility".
  consecutive_errors_sensor:
    name: "Consecutive read errors"
    entity_category: diagnostic

  error_low_battery:
    name: "Low battery"
  error_leakage:
    name: "Leakage"
  error_burst:
    name: "Burst pipe"
  error_reverse_flow:
    name: "Reverse flow"

  # On the first read these tell what the meter actually is. The serial
  # number and Meter ID stay on the device and do not enter this repo.
  meter_id_sensor:
    name: "Meter ID"
    entity_category: diagnostic
  serial_number_sensor:
    name: "Serial number"
    entity_category: diagnostic
