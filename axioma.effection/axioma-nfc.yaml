# Axioma Qalcosonic W1 — NFC-reitti
#
# **Tämä on toinen solmu, ei korvaaja.** `axioma.effection.yaml` jää
# pystyyn CC1101:n kanssa kunnes NFC-luku on kertonut onko mittarin radio
# ylipäätään päällä. Se on ainoa kysymys johon radiosolmu voi vielä
# vastata, ja purkaminen ennen vastausta sulkee sen pysyvästi.
#
# Kytkentä: `nfc-c3-mount.svg`. Perustelut ja pollausbudjetti: `CLAUDE.md`.
#
# ---------------------------------------------------------------------
# VAIHE 1 — LÄPÄISTY
#
# Tiedosto fläshättiin ensin ilman SPI:tä ja ilman NFC-komponenttia, koska
# **WiFi, API ja OTA on todennettava erillään siitä onko komponentin
# konfiguraatio oikein.** Kaksi tuntematonta kerralla on yksi liikaa.
#
# Se järjestys ansaitsi itsensä kahdesti: paljaalla levyllä `BOOT` ja
# `RESET` ovat sormin painettavissa ennen kuin rima vie tilan niiden
# vierestä, ja juotosten jälkeen sama runko toimi funktionaalisena testinä
# — levy nousi ja liittyi verkkoon, mikä todistaa ettei yksikään strapping-
# nasta (`GPIO2`, `GPIO8`, `GPIO9`) ole pidossa.
#
# **Ja se ansaitsi itsensä kolmannen kerran.** Vaihe 2 kommentoitiin kerran
# pois rajauskokeeksi kun laite katosi verkosta, ja paluu todistetusti
# toimivaan runkoon maksoi yhden käännöksen. Ilman komponenttia solmu pysyi
# pystyssä — mutta se ei vielä osoita komponenttiin, koska
# `power_save_mode: NONE` lisättiin samaan aikaan eikä niitä ollut siihen
# mennessä kokeiltu yhdessä.
#
# Jos koe on toistettava: kommentoi `external_components`-rivistä loppuun.
# ---------------------------------------------------------------------

esphome:
  name: axioma-nfc
  friendly_name: Axioma NFC

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  # **C3 SuperMinissä loki kulkee USB:n yli, ei UART-nastoja pitkin.**
  # Ilman tätä riviä `esphome logs` sarjaportin kautta on hiljainen ja
  # levy näyttää kuolleelta vaikka se toimisi.
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # **Ei salasanaa**, sama kuin repon muissa solmuissa: pelkkä `encryption:`
    # hylkää salaamattoman lähetyksen ja nojaa API-avaimeen.
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # **`NONE` on korjaus eikä oletus, ja tämä laite ansaitsi sen.**
  # Repon sääntö on ettei tätä aseteta ilman oiretta joka sen oikeuttaa,
  # koska asetus joka ei korjaa mitään luetaan myöhemmin valinnaksi.
  #
  # Oire: laite liittyi, sai MikroTikilta DHCP-osoitteen ja putosi hetken
  # päästä ulos syykoodeilla `Auth Expired` ja `Association Expired`.
  # Ne eivät ole torjuntoja vaan **vanhentumisia** — tukiasema pudottaa
  # asiakkaan jonka se uskoo kadonneen. MikroTik lähettää keepalive-kehyksiä
  # ja sen `disconnect-timeout` on lyhyt, ja C3:n oletus `LIGHT` nukuttaa
  # vastaanottimen majakkavälien välissä. Nukkuva radio missaa kuittaukset.
  #
  # Sarjaportissa tämä näytti loputtomalta liittymisyritykseltä, koska
  # ESPHome kirjaa vain oman puolensa. **DHCP-loki tukiasemalta oli se
  # havainto joka erotti pudotuksen liittymisvirheestä** — ja se tulee
  # laitteesta jota ESPHomen loki ei näe lainkaan.
  power_save_mode: NONE

  ap:
    ssid: "Axioma NFC fallback"
    password: !secret ap_password

captive_portal:

sensor:
  - platform: wifi_signal
    name: "Wi-Fi"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

# ---------------------------------------------------------------------
# VAIHE 2 — VASTA KUN LEVY ON TODENNETTU JA JUOTETTU
#
# Avainten nimet on **todennettu lähdekoodista**, ei README:stä:
# `components/qalcosonicnfc/__init__.py`. Tässä projektissa README on
# kaatunut kolmesti, ja tälläkin kerralla ensimmäinen arvaus meni väärin
# joka avaimella — komponentin nimessä, nastojen etuliitteessä ja siinä
# tarvitaanko erillinen `spi:`-lohko.
#
# **Erillistä `spi:`-lohkoa ei tarvita.** Komponentin `AUTO_LOAD` sisältää
# `spi`:n ja se ottaa kaikki kuusi nastaa omina asetuksinaan. Jos validointi
# silti valittaa puuttuvaa SPI-väylää, se on ensimmäinen asia jota kokeilla.
#
# **Lähde on kiinnitetty commitiin eikä haaraan**, kuten radiosolmussakin:
# `@main` on liikkuva viittaus, ja sama YAML voi kääntyä eri tavalla ilman
# että repossa muuttuu mitään.

external_components:
  - source:
      type: git
      url: https://github.com/dbmaxpayne/esphome_qalcosonicnfc
      ref: bed6773b803a7ebf71613585aad8a73376d38b8e
    components: [qalcosonicnfc]
    refresh: never

qalcosonicnfc:
  # Nastat kaaviosta `nfc-c3-mount.svg`, asento A.
  pn5180_rst_pin: GPIO5      # RST   — rimanasta
  pn5180_nss_pin: GPIO6      # NSS   — rimanasta
  pn5180_mosi_pin: GPIO7     # MOSI  — rimanasta
  pn5180_busy_pin: GPIO10    # BUSY  — rimanasta
  pn5180_miso_pin: GPIO3     # MISO  — lakkalanka
  pn5180_sck_pin: GPIO4      # SCK   — lakkalanka

  # **Kolme tuntia, ei komponentin oletus 60 s.** Mittarin kommunikointikredit
  # on noin 20 min/kk eli 40 s/vrk, ja minuutin väli polttaisi kuukauden
  # budjetin puolessa päivässä. Mittaa yhden luvun kesto ja johda väli siitä
  # kertoimella 2–3 — ks. CLAUDE.md.
  update_interval: 3h

  # **Pakollinen, vaikka näyttää valinnaiselta.** `timepoint_sensor` on
  # komponentin ainoa entiteetti jonka oletus on tyhjä `{}` eikä
  # `{name: ...}`: nimen oletus määritellään sisemmässä skeemassa ja
  # `.extend(text_sensor_schema())` määrittelee saman avaimen uudelleen
  # ilman oletusta. Ilman tätä lohkoa validointi kaatuu riviin
  # `At least one of 'id:' or 'name:' is required!` eikä kerro mistä.
  timepoint_sensor:
    name: "Mittarin aikaleima"
    timezone: Europe/Helsinki
    entity_category: diagnostic

  water_usage_sensor:
    name: "Vesimittari"
  water_flow_sensor:
    name: "Virtaama"
  water_temperature_sensor:
    name: "Veden lämpötila"
  battery_level_sensor:
    name: "Paristo"
    entity_category: diagnostic

  # **Vikatila on hiljaisuus, joten se tehdään näkyväksi.** Kreditin
  # täyttyessä rajapinta lukkiutuu tunnin vaihtumiseen asti eikä palauta
  # virhettä — luku vain epäonnistuu ja vanha arvo jää näyttämään tuoreelta.
  # Tämä laskuri on se rivi joka erottaa "ei muutosta" ja "ei näkyvyyttä".
  consecutive_errors_sensor:
    name: "Peräkkäisiä lukuvirheitä"
    entity_category: diagnostic

  error_low_battery:
    name: "Paristo vähissä"
  error_leakage:
    name: "Vuoto"
  error_burst:
    name: "Putkirikko"
  error_reverse_flow:
    name: "Takaisinvirtaus"

  # Ensimmäisellä luvulla nämä kertovat mitä mittari oikeasti on. Sarjanumero
  # ja Meter ID jäävät laitteelle eivätkä tule tähän repoon.
  meter_id_sensor:
    name: "Meter ID"
    entity_category: diagnostic
  serial_number_sensor:
    name: "Sarjanumero"
    entity_category: diagnostic
