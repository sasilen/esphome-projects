# Axioma Qalcosonic W1 — the NFC route
#
# **This is a second node, not a replacement.** `axioma.effection.yaml`
# stays up with the CC1101 until an NFC read has told us whether the meter's
# radio is switched on at all. That is the only question the radio node can
# still answer, and dismantling it before the answer closes it permanently.
#
# Wiring: `nfc-c3-mount.svg`. Rationale and polling budget: `CLAUDE.md`.
#
# ---------------------------------------------------------------------
# STAGE 1 — PASSED
#
# This file was flashed first without SPI and without the NFC component,
# because **Wi-Fi, the API and OTA have to be verified separately from
# whether the component's configuration is right.** Two unknowns at once is
# one too many.
#
# That order earned itself twice over: on a bare board `BOOT` and `RESET`
# can be pressed with a finger before the header takes the space beside
# them, and after soldering the same skeleton served as a functional test —
# the board came up and joined the network, which proves that no strapping
# pin (`GPIO2`, `GPIO8`, `GPIO9`) is being held.
#
# **And it earned itself a third time.** Stage 2 was once commented out as
# an isolation experiment when the device disappeared from the network, and
# returning to a known-good skeleton cost one build. Without the component
# the node stayed up — but that does not yet point at the component,
# because `power_save_mode: NONE` was added at the same time and the two
# had never been tried together.
#
# To repeat the experiment: comment out from the `external_components` line
# to the end.
# ---------------------------------------------------------------------

esphome:
  name: axioma-nfc
  friendly_name: Axioma NFC

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  # **On the C3 SuperMini the log goes over USB, not over UART pins.**
  # Without this line `esphome logs` through the serial port is silent and
  # the board looks dead even when it is working.
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # **No password**, same as the repo's other nodes: a bare `encryption:`
    # rejects unencrypted uploads and leans on the API key.
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # **`NONE` is a fix, not a default, and this device earned it.**
  # The repo's rule is not to set this without a symptom that justifies it,
  # because a setting that fixes nothing gets read later as a preference.
  #
  # Symptom: the device associated, got a DHCP address from the MikroTik and
  # dropped out shortly after with the reason codes `Auth Expired` and
  # `Association Expired`. Those are not rejections but **expirations** —
  # the access point drops a client it believes has vanished. MikroTik sends
  # keepalive frames and its `disconnect-timeout` is short, and the C3's
  # default `LIGHT` puts the receiver to sleep between beacons. A sleeping
  # radio misses the acknowledgements.
  #
  # On the serial port this looked like an endless association attempt,
  # because ESPHome logs only its own side. **The DHCP log from the router
  # was the observation that separated a drop from a join failure** — and it
  # comes from a device ESPHome's log cannot see at all.
  #
  # Caveat: see CLAUDE.md. A single successful association was read as
  # proof at the time, and the justification is a hypothesis rather than a
  # verified fix. It stays because on mains power it costs nothing.
  power_save_mode: NONE

  ap:
    ssid: "Axioma NFC fallback"
    password: !secret ap_password

captive_portal:

sensor:
  - platform: wifi_signal
    name: "Wi-Fi"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

# ---------------------------------------------------------------------
# STAGE 2 — ONLY ONCE THE BOARD IS VERIFIED AND SOLDERED
#
# The key names are **verified from the source**, not from the README:
# `components/qalcosonicnfc/__init__.py`. In this project the README has
# been wrong three times, and this time too the first guess was wrong on
# every key — the component's name, the pins' prefix, and whether a
# separate `spi:` block is needed.
#
# **No separate `spi:` block is needed.** The component's `AUTO_LOAD`
# includes `spi` and it takes all six pins as its own options. If
# validation still complains about a missing SPI bus, that is the first
# thing to try.
#
# **The source is pinned to a commit, not a branch**, as in the radio node:
# `@main` is a moving reference, and the same YAML can build differently
# without anything changing in the repo.

external_components:
  - source:
      type: git
      url: https://github.com/dbmaxpayne/esphome_qalcosonicnfc
      ref: bed6773b803a7ebf71613585aad8a73376d38b8e
    components: [qalcosonicnfc]
    refresh: never

qalcosonicnfc:
  # Pins from `nfc-c3-mount.svg`, orientation A.
  #
  # **Two pins to avoid, both learned the hard way — see CLAUDE.md:**
  #
  #   `GPIO20` `GPIO21`   UART0. They are free as far as the logger is
  #                       concerned, and they still hang the boot at
  #                       `Using HW SPI: SPI2_HOST`. Do not use them for
  #                       SPI control lines.
  #
  # And verify the board's pins before soldering — `pintesti.yaml`. The
  # first C3 used here had dead `GPIO5` and `GPIO6` pads, which cost an
  # evening because continuity measured fine and only a driven pin revealed
  # it.
  pn5180_rst_pin: GPIO5      # RST   — header pin
  pn5180_nss_pin: GPIO6      # NSS   — header pin
  pn5180_mosi_pin: GPIO7     # MOSI  — header pin
  pn5180_busy_pin: GPIO10    # BUSY  — header pin
  # **MISO and SCK are swapped relative to the first drawing, and that is
  # fine.** They were soldered the other way round, and on the C3 SPI goes
  # through the GPIO matrix — either pin serves either signal, and ESPHome
  # takes them from here. Changing two lines was cheaper and safer than
  # desoldering two wires beside a mounted C3.
  pn5180_miso_pin: GPIO4     # MISO  — enamelled wire
  pn5180_sck_pin: GPIO3      # SCK   — enamelled wire

  # **BENCH VALUE. The production value is `3h` — raise it before leaving
  # the device running.**
  #
  # The meter's communication credit is about 20 min/month, i.e. 40 s/day,
  # and a two-minute interval is 720 reads per day — roughly 36 times over.
  # When the limit is reached the interface locks until the hour turns, and
  # it returns no error: the read simply fails and the old value stays put,
  # looking fresh.
  #
  # **During the build this is still harmless**, and the reason is worth
  # knowing: credit is consumed by an NFC transaction with the meter. A
  # failed attempt — the PN5180 not answering, or the alignment missing the
  # coil — does not communicate with the meter at all and consumes nothing.
  # **The interval only starts costing from the first successful read.**
  #
  # That is therefore also the moment to raise it: measure the duration of
  # one read from the log timestamps and derive the interval from it with a
  # factor of 2–3. Rationale and table: CLAUDE.md.
  update_interval: 2min

  # **Required, although it looks optional.** `timepoint_sensor` is the
  # component's only entity whose default is an empty `{}` rather than
  # `{name: ...}`: the name's default is declared in the inner schema and
  # `.extend(text_sensor_schema())` redeclares the same key without one.
  # Without this block validation fails with
  # `At least one of 'id:' or 'name:' is required!` and does not say where.
  timepoint_sensor:
    name: "Meter timestamp"
    timezone: Europe/Helsinki
    entity_category: diagnostic

  water_usage_sensor:
    name: "Water usage"
  water_flow_sensor:
    name: "Water flow"
  water_temperature_sensor:
    name: "Water temperature"
  battery_level_sensor:
    name: "Battery"
    entity_category: diagnostic

  # **The failure mode is silence, so it is made visible.** When the credit
  # is exhausted the interface locks until the hour turns and returns no
  # error — the read simply fails and the old value keeps looking fresh.
  # This counter is the line that separates "no change" from "no
  # visibility".
  consecutive_errors_sensor:
    name: "Consecutive read errors"
    entity_category: diagnostic

  error_low_battery:
    name: "Low battery"
  error_leakage:
    name: "Leakage"
  error_burst:
    name: "Burst pipe"
  error_reverse_flow:
    name: "Reverse flow"

  # On the first read these tell what the meter actually is. The serial
  # number and Meter ID stay on the device and do not enter this repo.
  meter_id_sensor:
    name: "Meter ID"
    entity_category: diagnostic
  serial_number_sensor:
    name: "Serial number"
    entity_category: diagnostic
