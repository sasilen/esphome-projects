# Axioma Effectio (Qalcosonic W1) — stage 1: listen before interpreting
#
# This configuration cannot read the meter's values and does not try. It
# verifies four things at once: the radio works, the SPI wiring is right,
# the frequency is right, and the meter is audible to the receiver. All four
# show up in a single log line:
#
#   Received T1 A frame from 12345678 RSSI -70
#
# That line appears even when the telegram is encrypted, so **no AES key is
# needed for this stage.** Put the key request in motion straight away
# anyway, because it takes calendar time — and when it arrives, what is left
# is one sensor block, not new investigation.
#
# The meter transmits roughly every 16 seconds, so the first telegram may
# take a moment. Do not read silence as a fault before you have waited a
# couple of minutes.

substitutions:
  # The meter's serial number from the nameplate. This is an **assumption**,
  # not knowledge: the Meter ID is confirmed from a received telegram, and
  # only then may it be believed. If the log shows a different number, the
  # log is right.
  meter_id: "12345678"

esphome:
  # `name` is the technical identity: it becomes the network name
  # `axioma.local`, and it is what OTA targets. It follows the convention of
  # the other devices in `/config` (`aidon`, `wpc-can`), i.e. the repo's
  # directory name.
  #
  # `friendly_name` is the readable form of the same name, not a descriptive
  # alternative — that is how it is elsewhere in the repo too: `wpc-can` →
  # "WPC 07 CAN", not "Heat pump". A device is named for what it is, not
  # what it does, because the function already shows in the entity's own
  # name.
  name: axioma
  friendly_name: Axioma

esp32:
  board: esp32dev

logger:
  # **DEBUG for a day of listening, VERY_VERBOSE only for a serial session.**
  #
  # The frame line and `RX FIFO overflow` are at D and W level, so they show
  # up here. VV has exactly one justification and that is the `version` line
  # below — but it is printed during setup, which **the API log stream never
  # sees**, so VV is useless without a serial port. The cost would be a
  # megabyte of log per hour and CPU load alongside a streaming API
  # connection, and starving the CPU is itself one symptom of the upstream
  # bug suspected here. The listening run has to be a clean measurement.
  #
  # When you can get to the board, raise the level and read from serial:
  #
  #   level: VERY_VERBOSE
  #   logs: {spi: INFO, spi_device: INFO, api: INFO, wifi: INFO}
  #
  # The line to look for comes from the radio driver's setup, under the tag
  # `CC1101`:
  #
  #   [VV][CC1101]: part: 00, version: XX
  #
  # **`version` must be 04 or 14.** If it is 00 or FF, MISO is not
  # answering. This matters because the component's own check compares only
  # the part number and fails only if it is something other than zero — and
  # a dead bus reads zero. `Invalid part number` therefore never comes from
  # wrong wiring, even though it is the only error the driver produces.
  #
  # `RX FIFO overflow` and `RX timeout after N bytes` show at this level too
  # — they are at W level, and they are exactly the difference between this
  # device and upstream bug #425. Not one has appeared. See CLAUDE.md.
  #
  # **The `sensor` tag must not be silenced.** It is the tag of the `Uptime`
  # line, and this repo's OTA procedure leans on it: an upload is verified
  # from the device, not from the command's exit status. The same line also
  # reveals that repeated `ESPHome version` banners in the log are not
  # reboots.
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # **No password.** The device already offers encrypted OTA via the API
    # key, and a bare `encryption:` requires it — unencrypted uploads are
    # then rejected. A password would cost about 3.5 kB of flash and 60
    # bytes of RAM and would not protect anyone from someone who already has
    # the API key.
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    # The AP's name is broadcast and is not a secret. The password is.
    # The name follows the device name rather than the friendly name: this
    # network is looked for when Wi-Fi is not working, and then one is
    # looking for that device.
    ssid: "Axioma fallback"
    password: !secret ap_password

captive_portal:


# ------------------------------------------------------------------ Diagnostics
# This is here before a single line of meter data arrives, because it
# answers the question that has to be settled first: **is the board audible
# from the place it is going to.** wM-Bus is radio, so the receiver's
# location is yours to choose — and this sensor is the instrument that makes
# the choice.
#
# In the aidon project the same question was left open after installation
# and is still at the top of its open-issues list: −80 dBm with the hatch
# open, −87…−90 closed. It was measured too late. There is no such
# constraint here, so measure before you fix anything in place.
binary_sensor:
  - platform: status
    name: "Status"

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

  - platform: wifi_signal
    name: "Wi-Fi"
    update_interval: 60s


# ------------------------------------------------------------------- Radio
# The component's schema changed after this project's notes were written.
# The old form was a single `wmbus:` block containing the SPI pins and
# separate gdo0/gdo2 pins; the current one uses ESPHome's own `spi:`
# component and a `wmbus_radio:` block with a single `irq_pin`.
#
# **This file was pinned to the wrong branch.** It pointed at `@version_4`
# and still wrote the new schema — and those are different generations:
#
#   version_4   last release 4.1.4 (2/2025), old `wmbus:` block
#   5.x         "full refactor/rewrite", `spi:` + `wmbus_radio:` + `wmbus_meter:`
#
# The build would have failed on the unknown key `wmbus_radio`. The fault
# was not in the choice of schema but in pinning a version without reading
# what belongs to it.
#
# **And the release tag was no good either.** `@5.1.6` is the newest release
# and has the right schema, but it **does not know CC1101 at all**:
#
#   Unknown value 'CC1101', valid options are 'SX1276'.
#   'reset_pin' is a required option for [wmbus_radio].
#   [frequency] is an invalid option for [wmbus_radio].
#
# The five series' rewrite started from the SX1276, and CC1101 came back
# only afterwards — into the main branch, which has never been released.
# No release exists that has both CC1101 and this schema:
#
#   version_4   4.1.4, 2/2025   CC1101 yes, old `wmbus:` schema
#   5.1.6       8/2025          new schema, no CC1101
#   main                        both, no release
#
# **The pin is therefore a commit hash.** It is the only form that gives
# both CC1101 and immobility — a branch moves, a tag has no CC1101.
# Verified from the source rather than the README, which has misled twice
# here: `wmbus_radio/__init__.py` discovers radio types from the
# `transceiver_*.cpp` files, `reset_pin` is optional and `frequency` belongs
# to the CC1101, defaulting to exactly 868.95 MHz.
#
# The commit is the tip of main as of 20.8.2026. Development is active, but
# this is unreleased code — a deliberate trade, not carelessness.
#
# **Validated with ESPHome 2026.8.2: `Configuration is valid!`** The
# framework reservation held here — that the component might require
# `esp-idf` — is unnecessary: ESPHome already picks it by default
# (esp-idf 5.5.5).
#
# `wmbus_common` is included because `wmbus_radio` depends on it. It is not
# a key you write yourself — validation failed with
# `Component not found: wmbus_common` on the first run, because the
# `components:` restriction prevented the dependency from loading. The
# restriction is still here: it keeps visible what the repo pulls in, and a
# missing module shows immediately rather than quietly.
#
# `refresh: never` because a commit hash cannot change. The default would
# check for updates daily against a fixed point, which is pure waiting.
#
# **Temporarily a local working copy, not GitHub.** The reason is a one-byte
# test change that cannot be made to a remote source: `FIFOTHR` 0x07 → 0x00,
# i.e. GDO0 fires at four bytes instead of 32. That is version_4's value and
# issue #425's leading suspicion for why frames are never assembled.
#
# The tree is checked out from the same commit as the pin below, so **the
# only difference is that one line.** `upstream/` is in .gitignore and
# third-party code does not enter this repo; the change is recorded in
# CLAUDE.md so that it is reproducible without that tree.
#
# **Restore the line below as soon as the test resolves** — either way. A
# local tree does not update and is not visible to anyone else.
#
# The path is relative to this file, which means `upstream/` has to be in a
# directory the container can see, next to the YAML. If the build says the
# path does not exist, copy the directory there by hand.
external_components:
  - source:
      type: local
      path: upstream/esphome-components/components
    components: [wmbus_common, wmbus_radio, wmbus_meter]

  # - source: github://SzczepanLeon/esphome-components@7eae51c8fcefe854623b029b27bbe42e11c103ea
  #   components: [wmbus_common, wmbus_radio, wmbus_meter]
  #   refresh: never

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

wmbus_radio:
  radio_type: CC1101
  cs_pin: GPIO5
  # The old wiring table specifies both GDO0 (GPIO4) and GDO2 (GPIO2). The
  # current component needs only one interrupt line, and that is GDO0.
  #
  # **Disconnect the GDO2 wire, do not leave it in place.** This used to say
  # it could stay because it does no harm. GPIO2 is a strapping pin: it
  # wants LOW or floating at reset, and GDO2 is an output of the CC1101. If
  # it drives the pin high during startup, the board does not come up in
  # normal mode — and this project's own troubleshooting lists exactly that
  # as a cause of boot loops.
  irq_pin: GPIO4

  # **Back to T/C mode, and this time at the right hour.**
  #
  #   S      868.30 MHz   <- tried, silent
  #   T, C   868.95 MHz   <- this now, the W1's default
  #
  # Both earlier measurements fell outside the meter's transmission window
  # or on the wrong frequency, so neither proves anything about the meter:
  #
  #   8.5 h at 868.95   Sun 21:15 → Mon 05:45   outside the window
  #   6 min at 868.30   Mon morning             inside the window, wrong frequency
  #
  # The Qalcosonic W1's default schedule is **Mon–Fri 6:00–18:00**, and
  # outside it the radio is silent altogether — the battery is specified for
  # 15 years. Zero telegrams on a Sunday night is therefore an expected
  # result, not an observation.
  #
  # The schedule is masked at both weekday and month level, and the masks
  # are readable from the meter over NFC without a password. That is the
  # check on this assumption if a daytime listening run is still silent.
  frequency: 868.95MHz

  # Without this the component prints a received packet like so:
  #
  #   [D][packet:106]: Have data from radio (8 bytes)
  #   [D][wmbusmeters:351]: raw packet "320C800948884A28"
  #
  # That is enough to prove the radio works, but **it says nothing about
  # RSSI or whether the frame is complete.** Those two are exactly what
  # separates "the meter is far away" from "reception breaks up" — and
  # without them troubleshooting is guesswork, as it turned out to be with
  # the example line above.
  #
  # This is precisely what stage 1 needs: **print every frame from every
  # audible meter.** It requires neither a Meter ID nor an AES key — both
  # are for interpretation, and at this stage the question is whether
  # anything is audible at all.
  #
  # A neighbour's meter is as good a proof as our own: it proves the radio,
  # the wiring and the frequency work. Our own is identified only from the
  # ID.
  on_frame:
    - then:
        - logger.log:
            format: "Frame: RSSI %d dBm, %d bytes: %s"
            args:
              - frame->rssi()
              - (int) frame->data().size()
              - frame->as_hex().c_str()


# --------------------------------------------------------------- Meter
# This block is commented out on purpose. It waits for two things, and both
# arrive only once the radio has been shown to work:
#
#   1. The Meter ID from the log — not from the nameplate
#   2. The AES-128 key from the water utility
#
# Uncomment only when both are known. Before that this block would produce
# entities that never fill, and this repo has already recorded what
# permanently unknown entities cost.
#
# **The driver is `q400`, not `axioma`.** This said the meter
# manufacturer's name for a long time, and no such driver exists.
# wmbusmeters auto-detects the Qalcosonic W1 poorly but reads it with the
# `q400` driver, and the component offers the drivers straight from
# wmbusmeters.
#
# **Sensors are their own platform, not a `sensors:` list.** In 5.x they
# reference the meter by `parent_id`; a nested list was the 4.x form and
# would fail the same way the wrong branch did.
#
# wmbus_meter:
#   - id: water
#     meter_id: ${meter_id}
#     type: q400
#     key: !secret meter_key
#     mode: [T1]
#
# **These go into the `sensor:` block above, after `wifi_signal`.** Do not
# create a second `sensor:` key — YAML does not allow two of the same name,
# and the error appears only when the comments are removed, i.e. at the
# worst possible moment.
#
#   - platform: wmbus_meter
#     parent_id: water
#     field: total_m3
#     name: "Water meter"
#     unit_of_measurement: "m³"
#     device_class: water
#     state_class: total_increasing
#     accuracy_decimals: 3
#
#   # The field name has not been confirmed. `q400`'s published output has
#   # total_m3, consumption_at_set_date_m3, meter_datetime, set_datetime,
#   # status and rssi_dbm — **temperature is not in that list**, even though
#   # the W1 measures one. The first decoded telegram will say what fields
#   # this particular meter actually offers; add this only after that.
#   # - platform: wmbus_meter
#   #   parent_id: water
#   #   field: temperature_c
#   #   name: "Water temperature"
#   #   unit_of_measurement: "°C"
#   #   device_class: temperature
#   #   state_class: measurement
#   #   accuracy_decimals: 1
