# Axioma Effectio (Qalcosonic W1) — vaihe 1: kuuntele ennen kuin tulkitset
#
# Tämä konfiguraatio ei osaa lukea mittarin arvoja eikä yritäkään. Se todentaa
# neljä asiaa yhdellä kertaa: radio toimii, SPI-kytkennät ovat oikein, taajuus
# on oikein, ja mittari kuuluu vastaanottimeen. Kaikki neljä näkyvät yhdestä
# lokirivistä:
#
#   Received T1 A frame from 12345678 RSSI -70
#
# Se rivi tulee myös silloin kun telegrammi on salattu, eli **AES-avainta ei
# tarvita tähän vaiheeseen.** Avainpyyntö kannattaa laittaa liikkeelle silti
# heti, koska siihen menee kalenteriaikaa — ja kun se saapuu, jäljelle jää yksi
# sensorilohko, ei uutta selvitystyötä.
#
# Mittari lähettää noin 16 sekunnin välein, joten ensimmäistä telegrammia voi
# joutua odottamaan hetken. Älä tulkitse hiljaisuutta viaksi ennen kuin olet
# odottanut pari minuuttia.

substitutions:
  # Mittarin sarjanumero tyyppikilvestä. Tämä on **oletus**, ei tieto: Meter ID
  # varmistetaan vastaanotetusta telegrammista, ja vasta silloin sen saa uskoa.
  # Jos lokissa näkyy eri numero, lokki on oikeassa.
  meter_id: "12345678"

esphome:
  # `name` on tekninen identiteetti: siitä tulee verkkonimi `axioma.local`, ja
  # se on se johon OTA osuu. Se seuraa `/config`:n muiden laitteiden tapaa
  # (`aidon`, `wpc-can`) eli repon hakemistonimeä.
  #
  # `friendly_name` on saman nimen luettava muoto, ei kuvaileva vaihtoehto —
  # niin se on repon muissakin: `wpc-can` → "WPC 07 CAN", ei "Lämpöpumppu".
  # Laite nimetään sen mukaan mikä se on, ei mitä se tekee, koska funktio
  # näkyy jo entiteetin omassa nimessä.
  name: axioma
  friendly_name: Axioma

esp32:
  board: esp32dev

logger:
  # DEBUG, ei VERY_VERBOSE. Telegrammi tulee kerran 16 sekunnissa, joten tässä
  # ei ole samaa kuormaongelmaa kuin CAN-väylällä — mutta VERY_VERBOSE tulostaa
  # myös SPI-liikenteen, ja se hukuttaa juuri sen yhden rivin jota tässä
  # vaiheessa etsitään.
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    # AP:n nimi lähetetään ilmaan eikä ole salaisuus. Salasana on.
    # Nimi seuraa laitenimeä eikä ystävällistä nimeä: tätä verkkoa etsitään
    # silloin kun WiFi ei toimi, ja silloin haetaan sitä laitetta.
    ssid: "Axioma varayhteys"
    password: !secret ap_password

captive_portal:


# ------------------------------------------------------------------ Diagnostiikka
# Tämä on tässä ennen kuin mittarista tulee riviäkään dataa, koska se vastaa
# kysymykseen jonka pitää ratketa ensin: **kuuluuko levy siitä paikasta johon
# se on tulossa.** wM-Bus on radio, joten vastaanottimen paikan valitsee itse —
# ja tämä sensori on se mittari jolla valinnan tekee.
#
# Aidonissa sama kysymys jäi auki asennuksen jälkeen ja on siellä yhä avointen
# asioiden listan kärjessä: −80 dBm luukku auki, −87…−90 kiinni. Se mitattiin
# liian myöhään. Täällä ei ole samaa pakkoa, joten mittaa ennen kuin kiinnität.
# Nimet ovat englanniksi kuten aidonissa, joka on repon ainoa tuotannossa oleva
# laite: siellä diagnostiikka on englanniksi ja mittausdata suomeksi. Home
# Assistantissa laitteet näyttävät silloin samalta, ja mittarin omat entiteetit
# erottuvat siitä että ne ovat suomeksi.
binary_sensor:
  - platform: status
    name: "Status"

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

  - platform: wifi_signal
    name: "Wi-Fi"
    update_interval: 60s


# ------------------------------------------------------------------- Radio
# Komponentin skeema on muuttunut sen jälkeen kun tämän projektin muistiinpanot
# kirjoitettiin. Vanha muoto oli yksi `wmbus:`-lohko joka sisälsi SPI-pinnit ja
# erilliset gdo0/gdo2 -pinnit; nykyinen käyttää ESPHomen omaa `spi:`-komponenttia
# ja `wmbus_radio:`-lohkoa jossa on yksi `irq_pin`.
#
# **Tämä tiedosto oli kiinnitetty väärään haaraan.** Se osoitti `@version_4`:ään
# ja kirjoitti silti uutta skeemaa — ja ne ovat eri sukupolvia:
#
#   version_4   viimeinen julkaisu 4.1.4 (2/2025), vanha `wmbus:`-lohko
#   5.x         "full refactor/rewrite", `spi:` + `wmbus_radio:` + `wmbus_meter:`
#
# Käännös olisi kaatunut tuntemattomaan avaimeen `wmbus_radio`. Vika ei ollut
# skeemassa vaan siinä että versio kiinnitettiin lukematta mitä siihen kuuluu.
#
# **Eikä julkaisutagi kelvannut sekään.** `@5.1.6` on uusin julkaisu ja sillä on
# oikea skeema, mutta se **ei tunne CC1101:tä lainkaan**:
#
#   Unknown value 'CC1101', valid options are 'SX1276'.
#   'reset_pin' is a required option for [wmbus_radio].
#   [frequency] is an invalid option for [wmbus_radio].
#
# Viiden sarjan uudelleenkirjoitus lähti liikkeelle SX1276:sta, ja CC1101 tuli
# takaisin vasta sen jälkeen — päähaaraan, jota ei ole koskaan julkaistu.
# Yhtään julkaisua jossa olisi sekä CC1101 että tämä skeema ei ole olemassa:
#
#   version_4   4.1.4, 2/2025   CC1101 kyllä, vanha `wmbus:`-skeema
#   5.1.6       8/2025          uusi skeema, ei CC1101:tä
#   main                        molemmat, ei julkaisua
#
# **Kiinnitys on siis commit-tunniste.** Se on ainoa muoto joka antaa sekä
# CC1101:n että liikkumattomuuden — haara liikkuu, tagissa ei ole CC1101:tä.
# Tarkistettu lähdekoodista eikä READMEsta, joka on tässä johtanut harhaan
# kahdesti: `wmbus_radio/__init__.py` löytää radiotyypit
# `transceiver_*.cpp`-tiedostoista, `reset_pin` on valinnainen ja `frequency`
# on CC1101:n oma, oletuksena juuri 868.95 MHz.
#
# Commit on päähaaran kärki 20.8.2026. Kehitys on aktiivista, mutta tämä on
# julkaisematonta koodia — se on tietoinen vaihtokauppa, ei huolimattomuus.
#
# **Validoitu ESPHome 2026.8.2:lla: `Configuration is valid!`** Kehysvaraus jota
# tässä pidettiin — että komponentti ehkä vaatii `esp-idf`:n — on tarpeeton:
# ESPHome valitsee sen jo oletuksena (esp-idf 5.5.5).
#
# `wmbus_common` on mukana koska `wmbus_radio` nojaa siihen. Se ei ole avain
# jonka kirjoittaa itse — validointi kaatui `Component not found: wmbus_common`
# ensimmäisellä ajolla, koska `components:`-rajaus esti riippuvuuden
# latautumisen. Rajaus on silti tässä: se pitää näkyvissä mitä repo tuo, ja
# puuttuva moduuli näkyy heti eikä hiljaa.
#
# `refresh: never` koska commit-tunniste ei voi muuttua. Oletus tarkistaisi
# päivityksiä vuorokausittain kiinteälle pisteelle, mikä on pelkkää odotusta.
external_components:
  - source: github://SzczepanLeon/esphome-components@7eae51c8fcefe854623b029b27bbe42e11c103ea
    components: [wmbus_common, wmbus_radio, wmbus_meter]
    refresh: never

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

wmbus_radio:
  radio_type: CC1101
  cs_pin: GPIO5
  # Vanha kytkentätaulukko määrittää sekä GDO0:n (GPIO4) että GDO2:n (GPIO2).
  # Nykyinen komponentti tarvitsee vain yhden keskeytyslinjan, ja se on GDO0.
  #
  # **Irrota GDO2:n johto, älä jätä sitä paikalleen.** Tässä luki aiemmin että
  # sen voi jättää koska se ei häiritse. GPIO2 on strapping-nasta: se haluaa
  # LOW:n tai kellumisen nollauksessa, ja GDO2 on CC1101:n lähtö. Jos se ajaa
  # nastaa ylös käynnistyksen aikana, levy ei tule normaalitilaan — ja tämän
  # projektin vianetsintä listaa juuri sen boot-loopin syyksi.
  irq_pin: GPIO4
  frequency: 868.95MHz

  # Ilman tätä komponentti tulostaa vastaanotetun paketin näin:
  #
  #   [D][packet:106]: Have data from radio (8 bytes)
  #   [D][wmbusmeters:351]: raw packet "320C800948884A28"
  #
  # Se riittää todistamaan että radio toimii, mutta **ei kerro RSSI:tä eikä
  # sitä onko kehys kokonainen.** Juuri ne kaksi erottavat toisistaan
  # "mittari on kaukana" ja "vastaanotto katkeaa" — ja ilman niitä
  # vianetsintä on arvailua, kuten yllä olevan esimerkkirivin kohdalla kävi.
  #
  # Tämä on juuri se mitä vaihe 1 tarvitsee: **tulostaa jokaisen kehyksen
  # jokaiselta kuuluvalta mittarilta.** Se ei vaadi Meter ID:tä eikä
  # AES-avainta — molemmat ovat vasta tulkintaa varten, ja tässä vaiheessa
  # kysymys on kuuluuko mitään.
  #
  # Naapurin mittari kelpaa todisteeksi yhtä hyvin kuin oma: se todistaa että
  # radio, kytkentä ja taajuus toimivat. Oman tunnistaa vasta ID:stä.
  on_frame:
    - then:
        - logger.log:
            format: "Kehys: RSSI %d dBm, %d tavua: %s"
            args:
              - frame->rssi()
              - (int) frame->data().size()
              - frame->as_hex().c_str()


# --------------------------------------------------------------- Mittari
# Tämä lohko on tarkoituksella kommentoituna. Se odottaa kahta asiaa, ja
# molemmat tulevat vasta kun radio on todettu toimivaksi:
#
#   1. Meter ID lokista — ei tyyppikilvestä
#   2. AES-128-avain vesilaitokselta
#
# Poista kommentit vasta kun molemmat ovat tiedossa. Sitä ennen tämä lohko
# tuottaisi entiteettejä jotka eivät koskaan täyty, ja tässä repossa on jo
# kirjattu mitä ikuisesti tuntemattomat entiteetit maksavat.
#
# **Ajuri on `q400`, ei `axioma`.** Tässä luki pitkään mittarin valmistajan
# nimi, jota ei ole olemassa ajurina. wmbusmeters tunnistaa Qalcosonic W1:n
# automaattisesti huonosti mutta lukee sen `q400`-ajurilla, ja komponentti
# tarjoaa ajurit suoraan wmbusmetersista.
#
# **Anturit ovat oma alustansa, eivät `sensors:`-lista.** 5.x:ssä ne
# viittaavat mittariin `parent_id`:llä; sisäkkäinen lista oli 4.x:n muoto ja
# kaatuisi samalla tavalla kuin väärä haara.
#
# wmbus_meter:
#   - id: vesi
#     meter_id: ${meter_id}
#     type: q400
#     key: !secret meter_key
#     mode: [T1]
#
# **Nämä menevät yllä olevaan `sensor:`-lohkoon `wifi_signal`in perään.** Älä
# luo toista `sensor:`-avainta — YAML ei salli kahta samannimistä, ja virhe
# tulee vasta silloin kun kommentit poistetaan eli pahimpaan aikaan.
#
#   - platform: wmbus_meter
#     parent_id: vesi
#     field: total_m3
#     name: "Vesimittari"
#     unit_of_measurement: "m³"
#     device_class: water
#     state_class: total_increasing
#     accuracy_decimals: 3
#
#   # Kentän nimeä ei ole varmistettu. `q400`:n julkaistussa tulosteessa on
#   # total_m3, consumption_at_set_date_m3, meter_datetime, set_datetime,
#   # status ja rssi_dbm — **lämpötilaa ei ole siinä listassa**, vaikka W1
#   # sellaisen mittaa. Ensimmäinen purettu telegrammi kertoo mitä kenttiä
#   # tämä yksilö oikeasti tarjoaa; lisää tämä vasta sen jälkeen.
#   # - platform: wmbus_meter
#   #   parent_id: vesi
#   #   field: temperature_c
#   #   name: "Veden lämpötila"
#   #   unit_of_measurement: "°C"
#   #   device_class: temperature
#   #   state_class: measurement
#   #   accuracy_decimals: 1
