  <text x="40" y="58" font-size="21" font-weight="700" fill="#16212B" letter-spacing="1.5">C3 RIMAAN &#8212; KAKSI ASENTOA</text>
  <text x="40" y="80" font-size="12" fill="#5A6772">C3 seisoo kohtisuorassa JP1:ss&#228;, t&#228;ss&#228; k&#228;&#228;nnetty sivuun n&#228;kyviin &#183; musta padi = juotetaan</text>
  <line x1="20" y1="98" x2="840" y2="98" stroke="#A8B3BC"/>
  <text x="40" y="126" font-size="10" fill="#5A6772">Nelj&#228; nastaa kantaa levyn. Harmaat GPIO:t vedet&#228;&#228;n irti rimasta &#8212; GPIO8 ja GPIO9 ovat strapping, GPIO20 osuisi maahan.</text>

  <text x="170" y="156" font-size="12" font-weight="700" fill="#16212B">A &#8212; GPIO5 ylimm&#228;ksi</text>
