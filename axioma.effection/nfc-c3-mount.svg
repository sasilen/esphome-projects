  <text x="170" y="486" font-size="12" font-weight="700" fill="#16212B">B &#8212; GPIO21 ylimm&#228;ksi (k&#228;&#228;nnetty)</text>
  <rect x="170" y="500" width="420" height="234" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
