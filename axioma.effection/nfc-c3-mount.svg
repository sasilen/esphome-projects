  <g font-size="11" fill="#16212B">
    <text x="52" y="906" font-weight="700">Langat juotetaan nyt yl&#228;puolelta, ei alta.</text>
    <text x="52" y="923" fill="#5A6772">C3 on rimalla 2,5&#8211;6 mm ilmassa, joten padin p&#228;&#228;ll&#228; on tilaa. Alapinta pysyy siistimp&#228;n&#228;</text>
    <text x="52" y="939" fill="#5A6772">kun sinne j&#228;&#228;v&#228;t vain neljä rimanastaa &#8212; ja ne katkaistaan tasan juotoksen j&#228;lkeen.</text>
    <text x="52" y="961" font-weight="700">B maksaa UART0:n.</text>
    <text x="52" y="977" fill="#5A6772">GPIO20 ja GPIO21 ovat RX ja TX. USB CDC riitt&#228;&#228; lokiin, mutta sarjakonsoli menee.</text>
