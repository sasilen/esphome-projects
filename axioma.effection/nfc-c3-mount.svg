  <g font-size="11" fill="#16212B">
    <text x="52" y="918" font-weight="700">Riman korkeus s&#228;&#228;t&#228;&#228; et&#228;isyyden sovituspiiriin.</text>
    <text x="52" y="936" fill="#5A6772">C3:n maataso leijuu `L1`/`L2`:n yll&#228;, ja mit&#228; matalampi rima, sit&#228; l&#228;hemp&#228;n&#228;. Vakiorima</text>
    <text x="52" y="952" fill="#5A6772">j&#228;tt&#228;&#228; noin kuusi milli&#228; ilmaa &#8212; &#228;l&#228; paina C3:a kiinni pintaan vaikka se mahtuisi.</text>
    <text x="52" y="974" fill="#5A6772">C3:n sis&#228;reuna yltt&#228;&#228; ~21 mm:iin; antenni alkaa ~30 mm:st&#228;, joten kela j&#228;&#228; vapaaksi.</text>
