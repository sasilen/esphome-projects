  <text x="40" y="80" font-size="12" fill="#5A6772">Suora rima pinoaa levyt yhdensuuntaisiksi &#183; C3 peitt&#228;&#228; vasemman kolmanneksen, antenni j&#228;&#228; vapaaksi</text>
