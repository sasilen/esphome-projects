    <path d="M60 828 V866" stroke="#16212B" stroke-width="1"/>
    <text x="52" y="850" font-size="9" fill="#16212B" text-anchor="end">~11 mm</text>
    <text x="80" y="886" font-size="9" fill="#5A6772">mittari t&#228;ss&#228; alapuolella &#8212; kelan kohdalla alapinnan on oltava sile&#228;</text>
