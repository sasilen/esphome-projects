  <rect x="70" y="692.2" width="30" height="13" rx="2" fill="#16212B"/>
  <text x="85" y="722.0" font-size="9" font-weight="700" fill="#16212B" text-anchor="middle">USB-C</text>

  <line x1="20" y1="790" x2="840" y2="790" stroke="#A8B3BC"/>
  <text x="52" y="816" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">USB-C RATKAISEE, JA B VOITTAA</text>
  <g font-size="11" fill="#16212B">
    <text x="52" y="844" font-weight="700">A</text>
    <text x="76" y="844">USB-C osoittaa yl&#246;s, eli suoraan <tspan font-weight="700">+5V- ja 3.3V-padien p&#228;&#228;lle</tspan>.</text>
    <text x="76" y="861" fill="#5A6772">Juuri niihin tulee hyppylangat, ja liitin on niiden tiell&#228;. Juotettavissa jos</text>
    <text x="76" y="877" fill="#5A6772">virtajohdot tekee ensin matalina &#8212; mutta huoltaminen my&#246;hemmin on hankalaa.</text>
    <text x="76" y="893" fill="#5A6772">Juotetaan: RST NSS MOSI BUSY &#183; hyppylangat: MISO SCK +5V 3.3V GND</text>

    <text x="52" y="925" font-weight="700">B</text>
    <text x="76" y="925">USB-C osoittaa alas, k&#228;ytt&#228;m&#228;tt&#246;mien <tspan font-weight="700">GPIO IRQ AUX REQ</tspan> -padien suuntaan.</text>
    <text x="76" y="942" fill="#5A6772">Virtapadit j&#228;&#228;v&#228;t vapaiksi ja liitin on ulottuvilla my&#246;s asennuksen j&#228;lkeen.</text>
    <text x="76" y="958" fill="#5A6772">Juotetaan: RST MISO SCK BUSY &#183; hyppylangat: NSS MOSI +5V 3.3V GND</text>
    <text x="76" y="974" fill="#5A6772">Sama m&#228;&#228;r&#228; juotoksia ja johtoja &#8212; ero on pelkk&#228;&#228; ty&#246;st&#228; ja huollettavuutta.</text>
  </g>
</svg>