<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 940" width="880" height="940" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="880" height="940" fill="#E9ECEF"/>
  <rect x="20" y="20" width="840" height="900" fill="none" stroke="#A8B3BC"/>
  <text x="40" y="58" font-size="20" font-weight="700" fill="#16212B" letter-spacing="1.4">NFC NODE &#8212; C3 ON TOP OF THE PN5180, STRAIGHT HEADER</text>
  <text x="40" y="79" font-size="11.5" fill="#5A6772">Black pad = header pin, line = enamelled wire &#183; grey GPIOs are pulled out of the header before assembly</text>
  <line x1="20" y1="96" x2="860" y2="96" stroke="#A8B3BC"/>
  <text x="40" y="126" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">PLAN VIEW &#183; PN5180-NFC 70 &#215; 39 mm</text>
    <rect x="170" y="170" width="560.0" height="312.0" rx="5" fill="#FFFFFF" stroke="#16212B" stroke-width="1.8"/>
  <rect x="410.0" y="186.0" width="304.0" height="280.0" rx="4" fill="#DDE4EA" stroke="#A8B3BC"/>
  <text x="562.0" y="338.0" font-size="13" fill="#5A6772" text-anchor="middle">antenna</text>
  <text x="366.0" y="330.0" font-size="9" fill="#A8B3BC" text-anchor="middle" transform="rotate(-90 366.0 330.0)">L1 L2 matching</text>
  <rect x="181.2" y="199.6" width="144.0" height="180.0" rx="4" fill="#16212B" fill-opacity="0.05" stroke="#16212B" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="250.0" y="403.6" font-size="10" fill="#5A6772" text-anchor="middle">ESP32-C3 SuperMini 22,5 &#215; 18 mm</text>
  <rect x="218.0" y="201.2" width="72.0" height="10.4" rx="1" fill="#16212B"/>
  <text x="298.0" y="212.4" font-size="9" font-weight="700" fill="#16212B">USB-C</text>
  <path d="M192.4 204.4 C244.4 204.4 263.6 245.0 315.6 245.0" fill="none" stroke="#16212B" stroke-width="1.3"/>
  <path d="M192.4 224.7 C244.4 224.7 263.6 285.7 315.6 285.7" fill="none" stroke="#16212B" stroke-width="1.3"/>
  <path d="M192.4 367.0 C244.4 367.0 263.6 265.4 315.6 265.4" fill="none" stroke="#16212B" stroke-width="1.3"/>
  <path d="M192.4 306.0 H315.6" fill="none" stroke="#16212B" stroke-width="1.3"/>
  <path d="M192.4 326.3 H315.6" fill="none" stroke="#16212B" stroke-width="1.3"/>
  <circle cx="192.4" cy="204.4" r="4.6" fill="#FFFFFF" stroke="#16212B" stroke-width="1.2"/>
  <text x="162" y="208.0" font-size="10" fill="#16212B" text-anchor="end">+5V</text>
  <circle cx="192.4" cy="224.7" r="4.6" fill="#FFFFFF" stroke="#16212B" stroke-width="1.2"/>
  <text x="162" y="228.3" font-size="10" fill="#16212B" text-anchor="end">3.3V</text>
  <circle cx="192.4" cy="245.0" r="4.6" fill="#16212B" stroke="#16212B" stroke-width="1.2"/>
  <text x="162" y="248.6" font-size="10" fill="#16212B" text-anchor="end">RST</text>
  <text x="200.4" y="242.0" font-size="8" fill="#16212B">GPIO5</text>
  <circle cx="315.6" cy="245.0" r="3.8" fill="#FFFFFF" stroke="#16212B" stroke-width="1.1"/>
  <text x="323.6" y="248.4" font-size="9" fill="#16212B">5V</text>
  <circle cx="192.4" cy="265.4" r="4.6" fill="#16212B" stroke="#16212B" stroke-width="1.2"/>
  <text x="162" y="269.0" font-size="10" fill="#16212B" text-anchor="end">NSS</text>
  <text x="200.4" y="262.4" font-size="8" fill="#16212B">GPIO6</text>
  <circle cx="315.6" cy="265.4" r="3.8" fill="#FFFFFF" stroke="#16212B" stroke-width="1.1"/>
  <text x="323.6" y="268.8" font-size="9" fill="#16212B">GND</text>
  <circle cx="192.4" cy="285.7" r="4.6" fill="#16212B" stroke="#16212B" stroke-width="1.2"/>
  <text x="162" y="289.3" font-size="10" fill="#16212B" text-anchor="end">MOSI</text>
  <text x="200.4" y="282.7" font-size="8" fill="#16212B">GPIO7</text>
  <circle cx="315.6" cy="285.7" r="3.8" fill="#FFFFFF" stroke="#16212B" stroke-width="1.1"/>
  <text x="323.6" y="289.1" font-size="9" fill="#16212B">3V3</text>
  <circle cx="192.4" cy="306.0" r="4.6" fill="#FFFFFF" stroke="#16212B" stroke-width="1.2"/>
  <text x="162" y="309.6" font-size="10" fill="#16212B" text-anchor="end">MISO</text>
  <text x="200.4" y="303.0" font-size="8" fill="#C2CAD1">GPIO8</text>
  <circle cx="315.6" cy="306.0" r="3.8" fill="#FFFFFF" stroke="#16212B" stroke-width="1.1"/>
  <text x="323.6" y="309.4" font-size="9" fill="#16212B">GPIO4</text>
  <circle cx="192.4" cy="326.3" r="4.6" fill="#FFFFFF" stroke="#16212B" stroke-width="1.2"/>
  <text x="162" y="329.9" font-size="10" fill="#16212B" text-anchor="end">SCK</text>
  <text x="200.4" y="323.3" font-size="8" fill="#C2CAD1">GPIO9</text>
  <circle cx="315.6" cy="326.3" r="3.8" fill="#FFFFFF" stroke="#16212B" stroke-width="1.1"/>
  <text x="323.6" y="329.7" font-size="9" fill="#16212B">GPIO3</text>
  <circle cx="192.4" cy="346.6" r="4.6" fill="#16212B" stroke="#16212B" stroke-width="1.2"/>
  <text x="162" y="350.2" font-size="10" fill="#16212B" text-anchor="end">BUSY</text>
  <text x="200.4" y="343.6" font-size="8" fill="#16212B">GPIO10</text>
  <circle cx="315.6" cy="346.6" r="3.8" fill="#FFFFFF" stroke="#16212B" stroke-width="1.1"/>
  <text x="323.6" y="350.0" font-size="9" fill="#16212B">GPIO2</text>
  <circle cx="192.4" cy="367.0" r="4.6" fill="#FFFFFF" stroke="#16212B" stroke-width="1.2"/>
  <text x="162" y="370.6" font-size="10" fill="#16212B" text-anchor="end">GND</text>
  <text x="200.4" y="364.0" font-size="8" fill="#C2CAD1">GPIO20</text>
  <circle cx="315.6" cy="367.0" r="3.8" fill="#FFFFFF" stroke="#16212B" stroke-width="1.1"/>
  <text x="323.6" y="370.4" font-size="9" fill="#16212B">GPIO1</text>
  <circle cx="192.4" cy="387.3" r="4.6" fill="#FFFFFF" stroke="#16212B" stroke-width="1.2"/>
  <text x="162" y="390.9" font-size="10" fill="#16212B" text-anchor="end">GPIO</text>
  <text x="200.4" y="384.3" font-size="8" fill="#C2CAD1">GPIO21</text>
  <circle cx="315.6" cy="387.3" r="3.8" fill="#FFFFFF" stroke="#16212B" stroke-width="1.1"/>
  <text x="323.6" y="390.7" font-size="9" fill="#16212B">GPIO0</text>
  <circle cx="192.4" cy="407.6" r="4.6" fill="#FFFFFF" stroke="#16212B" stroke-width="1.2"/>
  <text x="162" y="411.2" font-size="10" fill="#16212B" text-anchor="end">IRQ</text>
  <circle cx="192.4" cy="427.9" r="4.6" fill="#FFFFFF" stroke="#16212B" stroke-width="1.2"/>
  <text x="162" y="431.5" font-size="10" fill="#16212B" text-anchor="end">AUX</text>
  <circle cx="192.4" cy="448.2" r="4.6" fill="#FFFFFF" stroke="#16212B" stroke-width="1.2"/>
  <text x="162" y="451.8" font-size="10" fill="#16212B" text-anchor="end">REQ</text>
  <line x1="20" y1="560" x2="860" y2="560" stroke="#A8B3BC"/>
  <g>
    <rect x="80" y="626" width="230" height="11" fill="#FFFFFF" stroke="#16212B" stroke-width="1.4"/>
    <rect x="92" y="606" width="12" height="20" fill="#A8B3BC" stroke="#16212B"/>
    <rect x="80" y="595" width="145" height="11" fill="#FFFFFF" stroke="#16212B" stroke-width="1.4"/>
    <text x="325" y="637" font-size="9.5" fill="#5A6772">PN5180 1.6 mm &#8212; underside against the meter, smooth over the coil</text>
    <text x="325" y="618" font-size="9.5" fill="#5A6772">header: the C3 sits 2.5&#8211;6 mm up, the wires fit underneath</text>
    <text x="325" y="601" font-size="9.5" fill="#5A6772">C3 1.2 mm &#183; total height ~11 mm</text>
  </g>
  <text x="52" y="686" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">WIRING</text>
  <g font-size="10.5" fill="#16212B">
    <text x="52" y="712">header <tspan font-weight="700">RST</tspan>=GPIO5  <tspan font-weight="700">NSS</tspan>=GPIO6  <tspan font-weight="700">MOSI</tspan>=GPIO7  <tspan font-weight="700">BUSY</tspan>=GPIO10</text>
    <text x="52" y="732">wire   <tspan font-weight="700">MISO</tspan>=GPIO4  <tspan font-weight="700">SCK</tspan>=GPIO3  <tspan font-weight="700">+5V</tspan>  <tspan font-weight="700">3.3V</tspan>  <tspan font-weight="700">GND</tspan></text>
    <text x="52" y="752" fill="#5A6772">pulled from the header: GPIO8 GPIO9 (strapping) &#183; GPIO20 GPIO21 (UART0 &#8212; hangs SPI setup, do not use as replacements)</text>

    <text x="52" y="786" font-weight="700">Nothing matches the silkscreen.</text>
    <text x="52" y="803" fill="#5A6772">The C3's silkscreen says GPIO5=MISO, GPIO6=MOSI, GPIO7=SS &#8212; and MISO/SCK are swapped too.</text>
    <text x="52" y="819" fill="#5A6772">Functionally irrelevant, the C3 routes SPI through the matrix. Write the map on the board.</text>

    <text x="52" y="853" font-weight="700">The order is forced: there is no getting an iron under the C3 afterwards.</text>
    <text x="52" y="870" fill="#5A6772">1. five enamelled wires from JP1's pads &#8212; 2. header into four pads, soldered from below</text>
    <text x="52" y="886" fill="#5A6772">3. C3 onto the header, wire ends into the far row &#8212; 4. 100 &#181;F &#8212; 5. strain relief</text>
    <text x="52" y="906" fill="#5A6772">USB-C ends up above the supply pads: harmless during assembly, but a repair needs the C3 off.</text>
  </g>
</svg>