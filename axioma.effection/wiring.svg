  <line x1="248" y1="300" x2="512" y2="300" stroke="#0E6E7C" stroke-width="2"/>
  <text x="216" y="304" font-size="13" font-weight="700" fill="#16212B" text-anchor="end">GPIO18</text>
  <text x="544" y="304" font-size="13" font-weight="700" fill="#16212B">SCK</text>

  <rect x="232" y="339" width="16" height="12" fill="#2E5F8A"/>
  <rect x="512" y="339" width="16" height="12" fill="#2E5F8A"/>
  <line x1="248" y1="345" x2="512" y2="345" stroke="#2E5F8A" stroke-width="2"/>
  <text x="216" y="349" font-size="13" font-weight="700" fill="#16212B" text-anchor="end">GPIO23</text>
  <text x="544" y="349" font-size="13" font-weight="700" fill="#16212B">MOSI</text>

  <rect x="232" y="384" width="16" height="12" fill="#9A6B18"/>
  <rect x="512" y="384" width="16" height="12" fill="#9A6B18"/>
  <line x1="248" y1="390" x2="512" y2="390" stroke="#9A6B18" stroke-width="2"/>
  <text x="216" y="394" font-size="13" font-weight="700" fill="#16212B" text-anchor="end">GPIO19</text>
  <text x="544" y="394" font-size="13" font-weight="700" fill="#16212B">MISO</text>

  <rect x="232" y="429" width="16" height="12" fill="#6B4A8A"/>
  <rect x="512" y="429" width="16" height="12" fill="#6B4A8A"/>
  <line x1="248" y1="435" x2="512" y2="435" stroke="#6B4A8A" stroke-width="2"/>
  <text x="216" y="439" font-size="13" font-weight="700" fill="#16212B" text-anchor="end">GPIO5</text>
  <text x="544" y="439" font-size="13" font-weight="700" fill="#16212B">CSN</text>
  <text x="150" y="459" font-size="9" fill="#A3301F" text-anchor="middle">strapping &#8212; haluaa HIGH, CS lep&#228;&#228; HIGH</text>

  <rect x="232" y="474" width="16" height="12" fill="#3F7A3F"/>
  <rect x="512" y="474" width="16" height="12" fill="#3F7A3F"/>
  <line x1="248" y1="480" x2="512" y2="480" stroke="#3F7A3F" stroke-width="2"/>
  <text x="216" y="484" font-size="13" font-weight="700" fill="#16212B" text-anchor="end">GPIO4</text>
  <text x="544" y="484" font-size="13" font-weight="700" fill="#16212B">GDO0</text>
  <text x="588" y="484" font-size="10" fill="#8A959E">irq_pin</text>

  <rect x="512" y="519" width="16" height="12" fill="none" stroke="#A8B3BC"/>
  <line x1="512" y1="525" x2="440" y2="525" stroke="#A8B3BC" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="452" y1="517" x2="440" y2="533" stroke="#A3301F" stroke-width="2"/>
  <line x1="440" y1="517" x2="452" y2="533" stroke="#A3301F" stroke-width="2"/>
  <text x="544" y="529" font-size="13" font-weight="700" fill="#8A959E">GDO2</text>
  <text x="428" y="529" font-size="10" fill="#A3301F" text-anchor="end">&#196;L&#196; KYTKE</text>

  <line x1="20" y1="612" x2="740" y2="612" stroke="#A8B3BC"/>

  <text x="40" y="642" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">MODUULIN ASENTO &#8212; NASTOJA EI OLE MERKITTY KUMMALLEKAAN PUOLELLE</text>
  <text x="40" y="664" font-size="12" fill="#16212B">K&#228;&#228;nn&#228; levy niin ett&#228; <tspan font-weight="700">kide on yl&#246;sp&#228;in</tspan> ja teksti <tspan font-style="italic">CC11010 868MHz Module</tspan> lukee vasemmassa</text>
  <text x="40" y="682" font-size="12" fill="#16212B">reunassa pystyss&#228;. Silloin j&#228;rjestys on t&#228;m&#228;.</text>

  <rect x="300" y="706" width="170" height="170" rx="3" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <rect x="352" y="716" width="66" height="24" rx="2" fill="#E9ECEF" stroke="#A8B3BC"/>
  <text x="385" y="733" font-size="9" fill="#5A6772" text-anchor="middle">26.000</text>
  <text x="322" y="800" font-size="8" fill="#8A959E" transform="rotate(-90 322 800)" text-anchor="middle">CC11010 868MHz Module</text>
  <rect x="360" y="778" width="46" height="46" rx="2" fill="#16212B"/>
  <text x="383" y="806" font-size="8" fill="#FFFFFF" text-anchor="middle">CC1101</text>

  <circle cx="470" cy="726" r="4.5" fill="#FFFFFF" stroke="#6B4A8A" stroke-width="2"/>
  <text x="486" y="730" font-size="11" font-weight="700" fill="#16212B">1  CSN</text>
  <circle cx="470" cy="747" r="4.5" fill="#FFFFFF" stroke="#3F7A3F" stroke-width="2"/>
  <text x="486" y="751" font-size="11" font-weight="700" fill="#16212B">2  GDO0</text>
  <circle cx="470" cy="768" r="4.5" fill="#FFFFFF" stroke="#A8B3BC" stroke-width="2"/>
  <text x="486" y="772" font-size="11" font-weight="700" fill="#8A959E">3  GDO2</text>
  <text x="556" y="772" font-size="9" fill="#A3301F">ei kytket&#228;</text>
  <circle cx="470" cy="789" r="4.5" fill="#FFFFFF" stroke="#9A6B18" stroke-width="2"/>
  <text x="486" y="793" font-size="11" font-weight="700" fill="#16212B">4  MISO</text>
  <circle cx="470" cy="810" r="4.5" fill="#FFFFFF" stroke="#0E6E7C" stroke-width="2"/>
  <text x="486" y="814" font-size="11" font-weight="700" fill="#16212B">5  SCK</text>
  <circle cx="470" cy="831" r="4.5" fill="#FFFFFF" stroke="#2E5F8A" stroke-width="2"/>
  <text x="486" y="835" font-size="11" font-weight="700" fill="#16212B">6  MOSI</text>
  <circle cx="470" cy="852" r="4.5" fill="#FFFFFF" stroke="#16212B" stroke-width="2"/>
  <text x="486" y="856" font-size="11" font-weight="700" fill="#16212B">7  GND</text>
  <circle cx="470" cy="866" r="4.5" fill="#FFFFFF" stroke="#A3301F" stroke-width="2"/>
  <text x="486" y="870" font-size="11" font-weight="700" fill="#16212B">8  VCC</text>

  <circle cx="300" cy="748" r="4.5" fill="#FFFFFF" stroke="#16212B" stroke-width="2"/>
  <text x="284" y="752" font-size="11" font-weight="700" fill="#16212B" text-anchor="end">GND   9</text>
  <circle cx="300" cy="790" r="4.5" fill="#FFFFFF" stroke="#A3301F" stroke-width="2"/>
  <text x="284" y="794" font-size="11" font-weight="700" fill="#16212B" text-anchor="end">ANT  10</text>
  <circle cx="300" cy="832" r="4.5" fill="#FFFFFF" stroke="#16212B" stroke-width="2"/>
  <text x="284" y="836" font-size="11" font-weight="700" fill="#16212B" text-anchor="end">GND  11</text>

  <text x="40" y="906" font-size="10" fill="#8A959E">Reikien jako on <tspan font-weight="700">2,0 mm</tspan>, ei 2,54 mm &#8212; Dupont-hyppylangat eiv&#228;t mahdu. Juota langat suoraan.</text>

  <line x1="20" y1="928" x2="740" y2="928" stroke="#A8B3BC"/>

  <text x="40" y="958" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">KOLME ASIAA JOTKA RIKKOVAT T&#196;M&#196;N</text>

  <text x="40" y="988" font-size="12" fill="#16212B">1.  <tspan font-weight="700">5 V tappaa CC1101:n.</tspan>  Se on 3,3 V:n piiri ilman toleranssia. Ota j&#228;nnite 3V3-nastasta,</text>
  <text x="40" y="1006" font-size="12" fill="#16212B">    ei VIN- eik&#228; 5V-nastasta.</text>

  <text x="40" y="1036" font-size="12" fill="#16212B">2.  <tspan font-weight="700">GDO2 j&#228;&#228; kytkem&#228;tt&#228;.</tspan>  Nykyinen komponentti tarvitsee yhden keskeytyslinjan, ja se on</text>
  <text x="40" y="1054" font-size="12" fill="#16212B">    GDO0. Vanha kytkent&#228;taulukko vei GDO2:n GPIO2:een &#8212; <tspan fill="#A3301F">se on strapping-nasta</tspan>, ja siihen</text>
  <text x="40" y="1072" font-size="12" fill="#16212B">    ajava l&#228;ht&#246; est&#228;&#228; k&#228;ynnistyksen. Se on t&#228;m&#228;n projektin kirjattu boot-loop-syy.</text>

  <text x="40" y="1102" font-size="12" fill="#16212B">3.  <tspan font-weight="700">Mittaa VCC ja GND ennen virtaa.</tspan>  Vain ne kaksi voivat rikkoa piirin; loput kuusi ovat</text>
  <text x="40" y="1120" font-size="12" fill="#16212B">    3,3 V:n logiikkaa, joten v&#228;&#228;r&#228; arvaus niiss&#228; ei riko mit&#228;&#228;n. Pari tunnistuu siit&#228; ett&#228;</text>
  <text x="40" y="1138" font-size="12" fill="#16212B">    niiden v&#228;list&#228; vastuslukema <tspan font-weight="700">nousee hitaasti</tspan> ohituskondensaattorien varautuessa.</text>
</svg>
