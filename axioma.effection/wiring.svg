  <text x="40" y="58" font-size="21" font-weight="700" fill="#16212B" letter-spacing="1.5">KYTKENT&#196;</text>
  <text x="40" y="80" font-size="12" fill="#5A6772">Seitsem&#228;n hyppylankaa &#183; yksi antenni &#183; CC1101 kest&#228;&#228; vain 3,3 V</text>
  <line x1="20" y1="98" x2="740" y2="98" stroke="#A8B3BC"/>

  <text x="60" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">ESP32 DEVKIT &#183; 30 NASTAA</text>
  <text x="520" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">CC1101 868 MHz</text>

  <rect x="60" y="150" width="180" height="430" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <rect x="88" y="166" width="124" height="46" rx="2" fill="#E9ECEF" stroke="#A8B3BC"/>
  <text x="150" y="188" font-size="10" fill="#5A6772" text-anchor="middle">WROOM-32</text>
  <text x="150" y="203" font-size="9" fill="#8A959E" text-anchor="middle">printtiantenni</text>
  <text x="150" y="562" font-size="10" fill="#8A959E" text-anchor="middle">USB-C &#183; CH340C</text>

  <rect x="520" y="150" width="160" height="430" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <rect x="558" y="166" width="84" height="40" rx="2" fill="#E9ECEF" stroke="#A8B3BC"/>
  <text x="600" y="191" font-size="10" fill="#5A6772" text-anchor="middle">26 MHz</text>
  <text x="600" y="562" font-size="10" fill="#8A959E" text-anchor="middle">pigtail &#8594; SMA</text>

  <line x1="680" y1="300" x2="716" y2="300" stroke="#16212B" stroke-width="1.5"/>
  <line x1="716" y1="300" x2="716" y2="240" stroke="#16212B" stroke-width="1.5"/>
  <line x1="708" y1="248" x2="716" y2="240" stroke="#16212B" stroke-width="1.5"/>
