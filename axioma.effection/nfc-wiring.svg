<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 900" width="880" height="900" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="880" height="900" fill="#E9ECEF"/>
  <rect x="20" y="20" width="840" height="860" fill="none" stroke="#A8B3BC"/>

  <text x="40" y="58" font-size="21" font-weight="700" fill="#16212B" letter-spacing="1.5">NFC-REITTI &#8212; PN5180 QALCOSONIC W1:EEN</text>
  <text x="40" y="80" font-size="12" fill="#5A6772">Signaalikaavio, asento A &#183; RST ja NSS siirretty GPIO1/GPIO0:aan, ks. nfc-c3-mount.svg</text>
  <line x1="20" y1="98" x2="860" y2="98" stroke="#A8B3BC"/>

  <text x="52" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">ESP32-C3 SUPERMINI</text>
  <text x="392" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">PN5180 &#183; JP1</text>
  <text x="672" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">MITTARI</text>

  <rect x="52" y="146" width="168" height="374" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <rect x="392" y="146" width="168" height="374" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>

  <g font-size="11" fill="#16212B" text-anchor="end">
    <text x="208" y="190">5V</text>
    <text x="208" y="216">3V3</text>
    <text x="208" y="242">GPIO1</text>
    <text x="208" y="268">GPIO0</text>
    <text x="208" y="294">GPIO7</text>
    <text x="208" y="320">GPIO3</text>
    <text x="208" y="346">GPIO4</text>
    <text x="208" y="372">GPIO10</text>
    <text x="208" y="398">GND</text>
  </g>
  <g font-size="11" fill="#16212B">
    <text x="404" y="190">+5V</text>
    <text x="404" y="216">3.3V</text>
    <text x="404" y="242">RST</text>
    <text x="404" y="268">NSS</text>
    <text x="404" y="294">MOSI</text>
    <text x="404" y="320">MISO</text>
    <text x="404" y="346">SCK</text>
    <text x="404" y="372">BUSY</text>
    <text x="404" y="398">GND</text>
  </g>
  <g font-size="11" fill="#A8B3BC">
    <text x="404" y="424">GPIO</text>
    <text x="404" y="450">IRQ</text>
    <text x="404" y="476">AUX</text>
    <text x="404" y="502">REQ</text>
  </g>
  <text x="560" y="428" font-size="10" fill="#5A6772">nelj&#228; ylint&#228;</text>
  <text x="560" y="444" font-size="10" fill="#5A6772">j&#228;&#228;v&#228;t vapaaksi</text>
  <text x="560" y="460" font-size="10" fill="#5A6772">&#8212; komponentti</text>
  <text x="560" y="476" font-size="10" fill="#5A6772">ei k&#228;yt&#228; niit&#228;</text>

  <g stroke="#16212B" stroke-width="1.5" fill="none">
    <path d="M220 186 H392"/><path d="M220 212 H392"/><path d="M220 238 H392"/>
    <path d="M220 264 H392"/><path d="M220 290 H392"/><path d="M220 316 H392"/>
    <path d="M220 342 H392"/><path d="M220 368 H392"/><path d="M220 394 H392"/>
  </g>
  <g font-size="9" fill="#5A6772" text-anchor="middle">
    <text x="306" y="182">l&#228;hetinp&#228;&#228;</text>
    <text x="306" y="208">logiikka</text>
    <text x="306" y="364">valmiuslinja</text>
  </g>
  <text x="306" y="420" font-size="10" fill="#5A6772" text-anchor="middle">yhdeks&#228;n johtoa, ei risteyksi&#228;</text>
  <text x="306" y="436" font-size="10" fill="#5A6772" text-anchor="middle">&#8212; rimat ovat samassa j&#228;rjestyksess&#228;</text>

  <rect x="672" y="146" width="168" height="200" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <text x="756" y="176" font-size="12" font-weight="700" fill="#16212B" text-anchor="middle">Qalcosonic W1</text>
  <text x="756" y="200" font-size="10" fill="#5A6772" text-anchor="middle">NFC-V, ISO 15693</text>
  <text x="756" y="220" font-size="10" fill="#5A6772" text-anchor="middle">luku ilman salasanaa</text>
  <text x="756" y="240" font-size="10" fill="#5A6772" text-anchor="middle">kirjoitus lukittu</text>
  <text x="756" y="276" font-size="11" font-weight="700" fill="#16212B" text-anchor="middle">~20 min/kk</text>
  <text x="756" y="294" font-size="10" fill="#5A6772" text-anchor="middle">kommunikointikredit</text>
  <text x="756" y="318" font-size="10" fill="#5A6772" text-anchor="middle">rajan t&#228;yttyess&#228; lukko</text>
  <text x="756" y="334" font-size="10" fill="#5A6772" text-anchor="middle">tunnin vaihtumiseen</text>
  <path d="M560 240 H672" stroke="#16212B" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="616" y="232" font-size="9" fill="#5A6772" text-anchor="middle">kentt&#228;</text>

  <line x1="20" y1="550" x2="860" y2="550" stroke="#A8B3BC"/>
  <text x="52" y="576" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">NELJ&#196; ASIAA JOTKA MENEV&#196;T HELPOSTI V&#196;&#196;RIN</text>

  <g font-size="11" fill="#16212B">
    <text x="52" y="608" font-weight="700">1</text>
    <text x="76" y="608" font-weight="700">Molemmat j&#228;nnitteet, ei vain 3,3 V.</text>
    <text x="76" y="626" fill="#5A6772">L&#228;hetinp&#228;&#228; ottaa viisi volttia ja piikittaa satoja milliampeereja RF-purskeessa.</text>
    <text x="76" y="642" fill="#5A6772">100 &#181;F moduulin viereen. Tarkista ett&#228; SuperMinissa on 5V-nasta &#8212; kaikissa ei ole.</text>

    <text x="52" y="674" font-weight="700">2</text>
    <text x="76" y="674" font-weight="700">BUSY on pakollinen, ei valinnainen.</text>
    <text x="76" y="692" fill="#5A6772">PN5180 ei ole tavallinen SPI-orja: jokaisen komennon j&#228;lkeen on odotettava</text>
    <text x="76" y="708" fill="#5A6772">BUSY:n laskua. Ilman sit&#228; luku palauttaa roskaa eik&#228; virhett&#228;.</text>

    <text x="52" y="740" font-weight="700">3</text>
    <text x="76" y="740" font-weight="700">Nastat v&#228;ist&#228;v&#228;t strappingin ja USB:n.</text>
    <text x="76" y="758" fill="#5A6772">C3:lla SPI ei ole sidottu nastoihin. GPIO2, GPIO8 ja GPIO9 ovat strapping-nastoja</text>
    <text x="76" y="774" fill="#5A6772">ja GPIO18/19 on USB. Yll&#228; oleva valinta v&#228;ltt&#228;&#228; kaikki.</text>

    <text x="52" y="806" font-weight="700">4</text>
    <text x="76" y="806" font-weight="700">Koko levy menee mittaria vasten, ja C3 sen viereen.</text>
    <text x="76" y="824" fill="#5A6772">70 &#215; 39 mm, antenni oikeassa p&#228;&#228;ss&#228;, nelj&#228; kiinnitysreik&#228;&#228;. Antennia ei voi</text>
    <text x="76" y="840" fill="#5A6772">sijoittaa erilleen, ja SPI ei sied&#228; pitki&#228; johtoja &#8212; pid&#228; ne alle 20 cm:ss&#228;.</text>
    <text x="76" y="856" fill="#5A6772">Lukuet&#228;isyys on lyhyempi kuin erillisell&#228; antennilevyll&#228;: kohdistus on ty&#246;t&#228;.</text>
  </g>
</svg>
