<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 900" width="880" height="900" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="880" height="900" fill="#E9ECEF"/>
  <rect x="20" y="20" width="840" height="860" fill="none" stroke="#A8B3BC"/>

  <text x="40" y="58" font-size="21" font-weight="700" fill="#16212B" letter-spacing="1.5">NFC ROUTE &#8212; PN5180 TO THE QALCOSONIC W1</text>
  <text x="40" y="80" font-size="12" fill="#5A6772">Signal diagram, orientation A &#183; physical placement and solder order: nfc-c3-mount.svg</text>
  <line x1="20" y1="98" x2="860" y2="98" stroke="#A8B3BC"/>

  <text x="52" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">ESP32-C3 SUPERMINI</text>
  <text x="392" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">PN5180 &#183; JP1</text>
  <text x="672" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">METER</text>

  <rect x="52" y="146" width="168" height="374" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <rect x="392" y="146" width="168" height="374" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>

  <g font-size="11" fill="#16212B" text-anchor="end">
    <text x="208" y="190">5V</text>
    <text x="208" y="216">3V3</text>
    <text x="208" y="242">GPIO5</text>
    <text x="208" y="268">GPIO6</text>
    <text x="208" y="294">GPIO7</text>
    <text x="208" y="320">GPIO4</text>
    <text x="208" y="346">GPIO3</text>
    <text x="208" y="372">GPIO10</text>
    <text x="208" y="398">GND</text>
  </g>
  <g font-size="11" fill="#16212B">
    <text x="404" y="190">+5V</text>
    <text x="404" y="216">3.3V</text>
    <text x="404" y="242">RST</text>
    <text x="404" y="268">NSS</text>
    <text x="404" y="294">MOSI</text>
    <text x="404" y="320">MISO</text>
    <text x="404" y="346">SCK</text>
    <text x="404" y="372">BUSY</text>
    <text x="404" y="398">GND</text>
  </g>
  <g font-size="11" fill="#A8B3BC">
    <text x="404" y="424">GPIO</text>
    <text x="404" y="450">IRQ</text>
    <text x="404" y="476">AUX</text>
    <text x="404" y="502">REQ</text>
  </g>
  <text x="560" y="428" font-size="10" fill="#5A6772">top four</text>
  <text x="560" y="444" font-size="10" fill="#5A6772">stay unused</text>
  <text x="560" y="460" font-size="10" fill="#5A6772">&#8212; the component</text>
  <text x="560" y="476" font-size="10" fill="#5A6772">does not use them</text>

  <g stroke="#16212B" stroke-width="1.5" fill="none">
    <path d="M220 186 H392"/><path d="M220 212 H392"/><path d="M220 238 H392"/>
    <path d="M220 264 H392"/><path d="M220 290 H392"/><path d="M220 316 H392"/>
    <path d="M220 342 H392"/><path d="M220 368 H392"/><path d="M220 394 H392"/>
  </g>
  <g font-size="9" fill="#5A6772" text-anchor="middle">
    <text x="306" y="182">transmitter</text>
    <text x="306" y="208">logic</text>
    <text x="306" y="364">ready line</text>
  </g>
  <text x="306" y="420" font-size="10" fill="#5A6772" text-anchor="middle">nine wires, no crossings</text>
  <text x="306" y="436" font-size="10" fill="#5A6772" text-anchor="middle">&#8212; the headers are in the same order</text>

  <rect x="672" y="146" width="168" height="200" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <text x="756" y="176" font-size="12" font-weight="700" fill="#16212B" text-anchor="middle">Qalcosonic W1</text>
  <text x="756" y="200" font-size="10" fill="#5A6772" text-anchor="middle">NFC-V, ISO 15693</text>
  <text x="756" y="220" font-size="10" fill="#5A6772" text-anchor="middle">read without a password</text>
  <text x="756" y="240" font-size="10" fill="#5A6772" text-anchor="middle">writing locked</text>
  <text x="756" y="276" font-size="11" font-weight="700" fill="#16212B" text-anchor="middle">~20 min/month</text>
  <text x="756" y="294" font-size="10" fill="#5A6772" text-anchor="middle">communication credit</text>
  <text x="756" y="318" font-size="10" fill="#5A6772" text-anchor="middle">at the limit it locks</text>
  <text x="756" y="334" font-size="10" fill="#5A6772" text-anchor="middle">until the hour turns</text>
  <path d="M560 240 H672" stroke="#16212B" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="616" y="232" font-size="9" fill="#5A6772" text-anchor="middle">field</text>

  <line x1="20" y1="550" x2="860" y2="550" stroke="#A8B3BC"/>
  <text x="52" y="576" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">FOUR THINGS THAT EASILY GO WRONG</text>

  <g font-size="11" fill="#16212B">
    <text x="52" y="608" font-weight="700">1</text>
    <text x="76" y="608" font-weight="700">Both supplies, not just 3.3 V.</text>
    <text x="76" y="626" fill="#5A6772">The transmitter side takes five volts and peaks at hundreds of milliamps in an RF burst.</text>
    <text x="76" y="642" fill="#5A6772">100 &#181;F next to the module. Check the SuperMini has a 5V pin &#8212; not all do.</text>

    <text x="52" y="674" font-weight="700">2</text>
    <text x="76" y="674" font-weight="700">BUSY is mandatory, not optional.</text>
    <text x="76" y="692" fill="#5A6772">The PN5180 is not an ordinary SPI slave: after every command you must wait</text>
    <text x="76" y="708" fill="#5A6772">for BUSY to fall. Without it a read returns rubbish rather than an error.</text>

    <text x="52" y="740" font-weight="700">3</text>
    <text x="76" y="740" font-weight="700">The pins avoid strapping and USB.</text>
    <text x="76" y="758" fill="#5A6772">On the C3 SPI is not tied to pins. GPIO2, GPIO8 and GPIO9 are strapping pins</text>
    <text x="76" y="774" fill="#5A6772">and GPIO18/19 is USB. The choice above avoids all of them.</text>

    <text x="52" y="806" font-weight="700">4</text>
    <text x="76" y="806" font-weight="700">The whole board goes against the meter, and the C3 beside it.</text>
    <text x="76" y="824" fill="#5A6772">70 &#215; 39 mm, antenna at the right end, four mounting holes. The antenna cannot</text>
    <text x="76" y="840" fill="#5A6772">be placed apart, and SPI does not tolerate long wires &#8212; keep them under 20 cm.</text>
    <text x="76" y="856" fill="#5A6772">Read distance is shorter than with a separate antenna board: alignment is work.</text>
  </g>
</svg>
