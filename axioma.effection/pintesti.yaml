# Pin test — run this on a bare C3 BEFORE soldering anything
#
# Drives every pin the wiring will use high, unconditionally, with no NFC
# component. Measure each pad against ground: **all of them must read
# ~3.3 V.**
#
# **Why this exists.** On 23.9.2026 a node was built whose nine connections
# were measured three times over and found good, and the PN5180 still did
# not answer. The fault was in the C3: the `GPIO5` and `GPIO6` pads never
# rose at all. The break was inside the board between the pad and the die,
# so a continuity measurement from JP1 to the pad passed and told the wrong
# story.
#
# **Continuity proves a conductor exists. This proves a signal gets
# through.** Those are different things, and only the second one found it.
#
# A pin does not reveal its fault until it is used: that board had been
# flashed and had run Wi-Fi faultlessly with those two broken the whole
# time.
#
# ---------------------------------------------------------------------
# **BARE BOARD ONLY.** If the PN5180 is already connected, remove `GPIO3`
# (`MISO`) and `GPIO10` (`BUSY`) — they are the module's outputs then, and
# two outputs must never be driven against each other.
# ---------------------------------------------------------------------
#
# Usage:
#   podman cp axioma.effection/pintesti.yaml esphome:/config/
#   podman exec esphome esphome compile /config/pintesti.yaml
#   sudo esptool --chip esp32c3 --port /dev/ttyACM0 write_flash 0x0 firmware.factory.bin
#
# The device name is the same as the real node, so no second device appears
# in Home Assistant. Restore `axioma-nfc.yaml` once the measurements are
# done.

esphome:
  name: axioma-nfc
  friendly_name: Axioma NFC

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  ap:
    ssid: "Axioma NFC fallback"
    password: !secret ap_password

captive_portal:

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

switch:
  # **Control.** Not part of the wiring and nothing is connected to it. If
  # this one does not rise, the fault is in the test or the measurement —
  # not in the board.
  - platform: gpio
    pin: GPIO1
    name: "Test GPIO1 control"
    restore_mode: ALWAYS_ON

  # The six pins the wiring uses, in the order of the diagram
  - platform: gpio
    pin: GPIO5
    name: "Test GPIO5 RST"
    restore_mode: ALWAYS_ON
  - platform: gpio
    pin: GPIO6
    name: "Test GPIO6 NSS"
    restore_mode: ALWAYS_ON
  - platform: gpio
    pin: GPIO7
    name: "Test GPIO7 MOSI"
    restore_mode: ALWAYS_ON
  - platform: gpio
    pin: GPIO3
    name: "Test GPIO3 MISO"
    restore_mode: ALWAYS_ON
  - platform: gpio
    pin: GPIO4
    name: "Test GPIO4 SCK"
    restore_mode: ALWAYS_ON
  - platform: gpio
    pin: GPIO10
    name: "Test GPIO10 BUSY"
    restore_mode: ALWAYS_ON
