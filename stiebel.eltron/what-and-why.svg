<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1240" width="760" height="1240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="760" height="1240" fill="#E9ECEF"/>
  <rect x="20" y="20" width="720" height="1200" fill="none" stroke="#A8B3BC"/>

  <text x="40" y="58" font-size="21" font-weight="700" fill="#16212B" letter-spacing="1.5">WHAT THIS PROJECT IS DOING &#8212; AND WHY</text>
  <text x="40" y="80" font-size="12" fill="#5A6772">Phase 1 listens and runs &#183; phase 2 asks, then sets &#183; the C3 now holds the bus at X27</text>
  <line x1="20" y1="98" x2="740" y2="98" stroke="#A8B3BC"/>

  <!-- ============ WHY ============ -->
  <text x="50" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">WHY &#8212; THE LEVER THAT EXISTS IS THE WRONG SHAPE</text>

  <rect x="50" y="150" width="310" height="150" rx="4" fill="#F3F5F7" stroke="#B4BCC3" stroke-width="1.5"/>
  <text x="74" y="178" font-size="11.5" font-weight="700" fill="#8A959E">TODAY &#8212; EVU CONTACT (SHELLY)</text>
  <g font-size="10.5" fill="#5A6772">
    <text x="74" y="208">one bit &#183; on or off</text>
    <text x="74" y="228">can only take load away</text>
    <text x="74" y="248">SG Ready states 1 and 2</text>
    <text x="74" y="268">peak shaving, hard blocking</text>
  </g>
  <text x="74" y="290" font-size="10" fill="#A3301F">cannot fill a store</text>

  <line x1="364" y1="225" x2="390" y2="225" stroke="#16212B" stroke-width="1.5"/>
  <polygon points="390,219 400,225 390,231" fill="#16212B"/>

  <rect x="400" y="150" width="310" height="150" rx="4" fill="#FFFFFF" stroke="#0E6E7C" stroke-width="1.5"/>
  <rect x="400" y="150" width="6" height="150" fill="#0E6E7C"/>
  <text x="424" y="178" font-size="11.5" font-weight="700" fill="#0E6E7C">WANTED &#8212; CAN PARAMETER WRITES</text>
  <g font-size="10.5" fill="#16212B">
    <text x="424" y="208">continuous, proportional</text>
    <text x="424" y="228">adds load when the sun pays</text>
    <text x="424" y="248">works with the pump's own logic</text>
    <text x="424" y="268">curve &#183; room setpoint &#183; DHW</text>
  </g>
  <text x="424" y="290" font-size="10" fill="#0E6E7C">fills the store</text>

  <text x="50" y="326" font-size="11.5" fill="#16212B">Surplus solar has to go somewhere. <tspan font-weight="700">The building mass and the DHW tank are that store</tspan>, and</text>
  <text x="50" y="344" font-size="11.5" fill="#16212B">raising a setpoint fills them. Blocking, the only instrument wired today, can never do that.</text>

  <line x1="20" y1="366" x2="740" y2="366" stroke="#A8B3BC"/>

  <!-- ============ WHAT ============ -->
  <text x="50" y="396" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">WHAT &#8212; TWO PHASES ON ONE BUS</text>

  <rect x="50" y="418" width="310" height="196" rx="4" fill="#FFFFFF" stroke="#0E6E7C" stroke-width="1.5"/>
  <rect x="50" y="418" width="6" height="196" fill="#0E6E7C"/>
  <text x="74" y="446" font-size="11.5" font-weight="700" fill="#0E6E7C">PHASE 1 &#8212; READ &#183; RUNNING NOW</text>
  <g font-size="10.5" fill="#16212B">
    <text x="74" y="476">C3 + SN65HVD230 at X27</text>
    <text x="74" y="496">listen only &#8212; never transmits</text>
    <text x="74" y="516">20 kbps confirmed on the wire</text>
    <text x="74" y="536">200 frames/min, no gap over 5 s</text>
    <text x="74" y="556">elements named from the capture</text>
  </g>
  <text x="74" y="584" font-size="10.5" fill="#0E6E7C">decoding moved across and</text>
  <text x="74" y="600" font-size="10.5" fill="#0E6E7C">publishing &#183; history intact</text>

  <line x1="364" y1="500" x2="390" y2="500" stroke="#16212B" stroke-width="1.5"/>
  <polygon points="390,494 400,500 390,506" fill="#16212B"/>
  <text x="382" y="484" font-size="9.5" fill="#5A6772" text-anchor="middle">gives</text>
  <text x="382" y="522" font-size="9.5" fill="#5A6772" text-anchor="middle">the</text>
  <text x="382" y="534" font-size="9.5" fill="#5A6772" text-anchor="middle">addresses</text>

  <rect x="400" y="418" width="310" height="196" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <text x="424" y="444" font-size="11.5" font-weight="700" fill="#16212B">PHASE 2 &#8212; TRANSMIT &#183; NEXT</text>

  <rect x="414" y="456" width="282" height="66" rx="3" fill="#FFFFFF" stroke="#0E6E7C"/>
  <text x="428" y="476" font-size="10.5" font-weight="700" fill="#0E6E7C">2a  ASK &#8212; READ REQUESTS</text>
  <g font-size="10" fill="#16212B">
    <text x="428" y="494">asks for what the bus does</text>
    <text x="428" y="510">not volunteer &#183; changes nothing</text>
  </g>

  <rect x="414" y="530" width="282" height="78" rx="3" fill="#FFF0EE" stroke="#A3301F"/>
  <text x="428" y="550" font-size="10.5" font-weight="700" fill="#A3301F">2b  SET &#8212; PARAMETER WRITES</text>
  <g font-size="10" fill="#16212B">
    <text x="428" y="568">DHW 0x180/0x0013 goes first</text>
    <text x="428" y="584">curve 0x601/0x010E waits on</text>
    <text x="428" y="600">manifold balancing</text>
  </g>

  <text x="50" y="640" font-size="11.5" fill="#16212B">Both halves need the same two things &#8212; a transceiver that drives the bus, and identity <tspan font-weight="700">0x680</tspan>.</text>
  <text x="50" y="658" font-size="11.5" fill="#16212B">Only 2b can harm the machine, so <tspan font-weight="700">2a goes first, with the write path left out of the config.</tspan></text>

  <line x1="20" y1="680" x2="740" y2="680" stroke="#A8B3BC"/>

  <!-- ============ DECISION ============ -->
  <text x="50" y="710" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">DECIDED ON THE WIRE &#8212; THE C3 READS THIS BUS</text>

  <rect x="230" y="732" width="300" height="70" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <text x="380" y="758" font-size="11.5" font-weight="700" fill="#0E6E7C" text-anchor="middle">LISTEN-ONLY ON THE LIVE BUS</text>
  <text x="380" y="778" font-size="10.5" fill="#5A6772" text-anchor="middle">237 frames/min at 20 kbps, and</text>
  <text x="380" y="792" font-size="10.5" fill="#5A6772" text-anchor="middle">nothing malformed after startup</text>

  <line x1="300" y1="802" x2="205" y2="836" stroke="#16212B" stroke-width="1.5"/>
  <polygon points="210,826 200,840 214,838" fill="#16212B"/>
  <line x1="460" y1="802" x2="555" y2="836" stroke="#16212B" stroke-width="1.5"/>
  <polygon points="550,826 560,840 546,838" fill="#16212B"/>

  <rect x="50" y="846" width="310" height="116" rx="4" fill="#FFFFFF" stroke="#0E6E7C" stroke-width="1.5"/>
  <rect x="50" y="846" width="6" height="116" fill="#0E6E7C"/>
  <text x="74" y="874" font-size="11.5" font-weight="700" fill="#0E6E7C">C3 RECEIVES &#8212; C3 TAKES IT</text>
  <g font-size="10.5" fill="#16212B">
    <text x="74" y="902">wiring-phase2a.svg draws it:</text>
    <text x="74" y="920">no SPI, no lifted pin, no</text>
    <text x="74" y="938">crystal question, no level</text>
    <text x="74" y="954">shifting, no receive stall</text>
  </g>

  <rect x="400" y="846" width="310" height="116" rx="4" fill="#F3F5F7" stroke="#B4BCC3" stroke-width="1.5"/>
  <text x="424" y="874" font-size="11.5" font-weight="700" fill="#5A6772">IT DOES NOT &#8212; ORIGINAL PLAN</text>
  <g font-size="10.5" fill="#5A6772">
    <text x="424" y="902">MCP2515 + VP230 as drawn in</text>
    <text x="424" y="920">phase2-transceiver.svg</text>
    <text x="424" y="938">the SPI rework and the lifted</text>
    <text x="424" y="954">pin all stay</text>
  </g>

  <text x="50" y="988" font-size="11.5" fill="#16212B"><tspan font-weight="700">It is now a frame on a wire, not a compiler agreeing to build.</tspan> The node sits at X27 in</text>
  <text x="50" y="1006" font-size="11.5" fill="#16212B">listen-only, the bus reads 63 &#8486; with it fitted, and the MCP2515 leaves this project.</text>

  <line x1="20" y1="1028" x2="740" y2="1028" stroke="#A8B3BC"/>

  <!-- ============ GUARD RAILS ============ -->
  <rect x="50" y="1052" width="660" height="148" fill="#FFFFFF" stroke="#A3301F" stroke-width="1.5"/>
  <rect x="50" y="1052" width="6" height="148" fill="#A3301F"/>
  <text x="74" y="1078" font-size="12" font-weight="700" fill="#A3301F">FOUR THINGS THAT CONSTRAIN THE WHOLE PLAN</text>
  <g font-size="11.5" fill="#16212B">
    <text x="74" y="1104"><tspan font-weight="700">Bench before bus.</tspan> A wrong bit rate is harmless on the desk, and not on a live machine.</text>
    <text x="74" y="1126"><tspan font-weight="700">X27 takes one node.</tspan> A spring terminal holds one conductor per pole, so a second node is</text>
    <text x="74" y="1142">a swap or a splice in the drop, never an extra drop.</text>
    <text x="74" y="1164"><tspan font-weight="700">Rate-limit the writes.</tspan> On change, deadband, 15&#8211;30 min. The memory that wears is the pump's.</text>
    <text x="74" y="1186"><tspan font-weight="700">Make the raise self-clearing.</tspan> If HA dies with the curve up, the house overheats on its own.</text>
  </g>
</svg>
