<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 880" width="760" height="880" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="760" height="880" fill="#E9ECEF"/>
  <rect x="20" y="20" width="720" height="840" fill="none" stroke="#A8B3BC"/>

  <text x="40" y="58" font-size="21" font-weight="700" fill="#16212B" letter-spacing="1.5">BUS CONNECTION &#8212; X27 ON BOARD A2</text>
  <text x="40" y="80" font-size="12" fill="#5A6772">From the WPC 04&#8211;13 cool wiring diagram &#183; the FE7 / FEK room-control bus &#183; verify before connecting</text>
  <line x1="20" y1="98" x2="740" y2="98" stroke="#A8B3BC"/>

  <text x="50" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">HEAT PUMP &#183; A2 &#183; X27</text>
  <text x="470" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">SNIFFER NODE</text>

  <!-- X27 connector -->
  <rect x="50" y="150" width="220" height="230" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <text x="160" y="176" font-size="13" font-weight="700" fill="#16212B" text-anchor="middle">X27</text>
  <text x="160" y="192" font-size="10" fill="#5A6772" text-anchor="middle">4-pin, board A2</text>

  <rect x="74" y="212" width="172" height="34" fill="#EDF3F6" stroke="#A8B3BC"/>
  <text x="86" y="234" font-size="13" font-weight="700" fill="#16212B">1</text>
  <text x="112" y="234" font-size="13" font-weight="700" fill="#16212B">H</text>
  <text x="150" y="234" font-size="11" fill="#5A6772">CAN high</text>
  <rect x="262" y="223" width="16" height="12" fill="#0E6E7C"/>

  <rect x="74" y="252" width="172" height="34" fill="#EDF3F6" stroke="#A8B3BC"/>
  <text x="86" y="274" font-size="13" font-weight="700" fill="#16212B">2</text>
  <text x="112" y="274" font-size="13" font-weight="700" fill="#16212B">L</text>
  <text x="150" y="274" font-size="11" fill="#5A6772">CAN low</text>
  <rect x="262" y="263" width="16" height="12" fill="#2E5F8A"/>

  <rect x="74" y="292" width="172" height="34" fill="#EDF3F6" stroke="#A8B3BC"/>
  <text x="86" y="314" font-size="13" font-weight="700" fill="#16212B">3</text>
  <text x="112" y="314" font-size="13" font-weight="700" fill="#16212B">?</text>
  <text x="150" y="314" font-size="11" fill="#5A6772">ground &#8212; inferred</text>
  <rect x="262" y="303" width="16" height="12" fill="#16212B"/>

  <rect x="74" y="332" width="172" height="34" fill="#FFF0EE" stroke="#A3301F"/>
  <text x="86" y="354" font-size="13" font-weight="700" fill="#A3301F">4</text>
  <text x="112" y="354" font-size="13" font-weight="700" fill="#A3301F">+12V</text>
  <text x="160" y="354" font-size="11" fill="#A3301F">measures 17.4 V</text>

  <!-- node -->
  <rect x="470" y="150" width="230" height="230" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <text x="585" y="176" font-size="13" font-weight="700" fill="#16212B" text-anchor="middle">MCP2515 + D1 mini</text>
  <text x="585" y="192" font-size="10" fill="#5A6772" text-anchor="middle">listen only, 3.3 V</text>
  <rect x="462" y="223" width="16" height="12" fill="#0E6E7C"/>
  <text x="488" y="234" font-size="13" font-weight="700" fill="#16212B">H</text>
  <text x="520" y="234" font-size="11" fill="#5A6772">screw terminal</text>
  <rect x="462" y="263" width="16" height="12" fill="#2E5F8A"/>
  <text x="488" y="274" font-size="13" font-weight="700" fill="#16212B">L</text>
  <text x="520" y="274" font-size="11" fill="#5A6772">screw terminal</text>
  <rect x="462" y="303" width="16" height="12" fill="#16212B"/>
  <text x="488" y="314" font-size="13" font-weight="700" fill="#16212B">GND</text>
  <text x="530" y="314" font-size="11" fill="#5A6772">J4 pin, not the terminal</text>

  <!-- wires -->
  <line x1="278" y1="229" x2="462" y2="229" stroke="#0E6E7C" stroke-width="2.5"/>
  <line x1="278" y1="269" x2="462" y2="269" stroke="#2E5F8A" stroke-width="2.5"/>
  <line x1="278" y1="309" x2="462" y2="309" stroke="#16212B" stroke-width="2.5"/>
  <text x="370" y="222" font-size="10" fill="#8A959E" text-anchor="middle">twisted pair</text>

  <!-- pin 4 stop -->
  <line x1="278" y1="349" x2="330" y2="349" stroke="#A3301F" stroke-width="2.5" stroke-dasharray="5 4"/>
  <path d="M338 341 l16 16 M354 341 l-16 16" stroke="#A3301F" stroke-width="3"/>
  <text x="372" y="345" font-size="11" font-weight="700" fill="#A3301F">never to the transceiver</text>
  <text x="372" y="360" font-size="10.5" fill="#5A6772">but it is the supply an LM2596 can use, set to 5.0 V</text>

  <line x1="20" y1="408" x2="740" y2="408" stroke="#A8B3BC"/>

  <text x="50" y="436" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">WHAT THE DIAGRAM ACTUALLY SAYS</text>
  <text x="50" y="458" font-size="11.5" fill="#16212B">The legend printed beside X27 reads <tspan font-weight="700">1 = H</tspan>, <tspan font-weight="700">2 = L</tspan>, <tspan font-weight="700">3 =</tspan> a symbol, <tspan font-weight="700">4 = +12V</tspan>. Elsewhere the same</text>
  <text x="50" y="476" font-size="11.5" fill="#16212B">bus is labelled <tspan font-weight="700">H</tspan>, <tspan font-weight="700">L</tspan>, <tspan font-weight="700">&#8220;+&#8221;</tspan>. Pin 3 is ground by elimination, not by a label that was read.</text>

  <rect x="50" y="500" width="660" height="128" fill="#FFFFFF" stroke="#A3301F" stroke-width="1.5"/>
  <rect x="50" y="500" width="6" height="128" fill="#A3301F"/>
  <text x="74" y="524" font-size="12" font-weight="700" fill="#A3301F">VERIFY BEFORE CONNECTING &#8212; THREE MEASUREMENTS</text>
  <text x="74" y="548" font-size="11.5" fill="#16212B"><tspan font-weight="700">1. Pump powered down.</tspan> Measured here: pins 1 to 2 read <tspan font-weight="700">150 &#8486;</tspan> &#8212; so there is <tspan font-weight="700">no 120 &#8486; terminator</tspan></text>
  <text x="74" y="566" font-size="11.5" fill="#16212B">on this bus. A parallel combination can never exceed its smallest member. Add none at this end either.</text>
  <text x="74" y="588" font-size="11.5" fill="#16212B"><tspan font-weight="700">2. Do not expect pin 3 to reach chassis earth.</tspan> The supply is a floating SELV rail; no continuity is normal.</text>
  <text x="74" y="610" font-size="11.5" fill="#16212B"><tspan font-weight="700">3. Pump powered up.</tspan> Measured here: pins 1 and 2 at a steady <tspan font-weight="700">2.5 V</tspan>, pin 4 at <tspan font-weight="700">17.4 V</tspan> &#8212; not the 12 V printed.</text>

  <text x="50" y="662" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">THEN, IN THIS ORDER</text>
  <text x="50" y="684" font-size="11.5" fill="#16212B">Power the node from anything <tspan font-weight="700">without an earth pin</tspan> for the first test &#8212; a battery pack or an</text>
  <text x="50" y="702" font-size="11.5" fill="#16212B">ordinary phone charger. A mains-earthed laptop plus the pump's bus is the arrangement that</text>
  <text x="50" y="716" font-size="11.5" fill="#16212B">drives loop current through the CAN conductors. If frames come in erratically, swap the charger</text>
  <text x="50" y="730" font-size="11.5" fill="#16212B">for a battery pack before suspecting the wiring: switch-mode supplies leak through their Y-caps.</text>
  <text x="50" y="724" font-size="11.5" fill="#16212B">Connect <tspan font-weight="700">H, L and ground only</tspan>. Twisted pair for H and L. Leave pin 4 alone until the permanent</text>
  <text x="50" y="742" font-size="11.5" fill="#16212B">install, where it feeds the LM2596 and gives the single ground reference this project wants.</text>
  <text x="50" y="764" font-size="11.5" fill="#16212B">Add nothing else: the heat pump terminates the bus itself, so <tspan font-weight="700">no 120 &#8486; at this end</tspan>.</text>

  <rect x="50" y="790" width="660" height="60" fill="#16212B"/>
  <text x="74" y="814" font-size="11" font-weight="700" fill="#7C8B99" letter-spacing="1">THE NODE CANNOT DISTURB THE BUS</text>
  <text x="74" y="836" font-size="11.5" fill="#E9ECEF">mode: LISTENONLY means no ACK and no error frames, whatever bit rate is compiled in.</text>
</svg>
