# Validation-only config. It is never flashed and it drives no hardware.
#
# It exists to answer one question that decides the whole of phase 2: does the
# installed ESPHome accept 20 kbps on the ESP32's built-in TWAI controller?
#
#   esphome config cantest.yaml
#
#   passes  -> esp32_can is available. The MCP2515 goes away, and with it the
#              SPI wiring, the crystal question, the level shifting and the
#              receive-stall bug. Phase 2 becomes an ESP32 plus a transceiver.
#   fails   -> "Bit rate 20KBPS is not supported on ESP32". Stay on the
#              MCP2515, which does 20 kbps unconditionally.
#
# The rejection recorded in CLAUDE.md was tested on ESPHome 2026.7.4. It is an
# ESPHome limit and not a silicon one — the board on hand is an ESP32-D0WD-V3
# rev v3.1, whose BRP divider reaches 20 kbps, and a working Tecalor project
# runs this same Elster bus at this rate on stock `esp32_can`. So the answer
# changes with the ESPHome version, which is why this file is kept rather than
# retyped: an instruction to run a file that does not exist is not a procedure.
#
# Nothing here is secret and nothing is board-specific beyond the pins, which
# are placeholders — validation never touches them.

esphome:
  name: cantest

# The variant was the whole experiment, and it is now settled. ESPHome 2026.8.2
# tabulates supported bit rates per variant, and the refusal message names
# `ESP32` specifically — it meant it.
#
#   esp32dev              20 kbps REFUSED
#   esp32-s3-devkitc-1    20 kbps accepted
#   esp32-c3-devkitm-1    20 kbps accepted   <- the cheap one
#   esp32-c6-devkitc-1    20 kbps accepted   <- and this one also does 802.15.4
#
# All three tested on 2026.8.2 by swapping the board line and re-running
# `esphome config`. Nothing was flashed and no hardware was involved.
#
# Three of the four take it, so price and capability decide rather than the bus.
# The C3 is the cheap one; the C6 does everything the C3 does and adds an
# 802.15.4 radio, which is the one capability none of the others can be given
# later. Both have native USB, so the CH34x-vs-CP210x driver question that this
# repo keeps tripping over disappears with either.
#
# Watch the strapping pins, which differ per variant and are the reason two of
# these four tests failed on a pin before they could fail or pass on the rate:
#
#   C3   pins stop at GPIO21;  GPIO2, 8, 9 are strapping
#   C6   GPIO4, 5, 8, 9, 15 are strapping — GPIO4/5 below are wrong for a
#        real C6 build even though validation only warns
#   S3   GPIO0, 3, 45, 46 are strapping
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
  # board: esp32dev              # 20 kbps refused
  # board: esp32-s3-devkitc-1    # 20 kbps accepted, needs esp-idf

logger:

canbus:
  - platform: esp32_can
    # Valid on C3 (pins stop at 21) and on S3, and neither is a strapping pin
    # on either part. Placeholders regardless — nothing is flashed.
    tx_pin: GPIO4
    rx_pin: GPIO5
    can_id: 0x680
    bit_rate: 20KBPS
