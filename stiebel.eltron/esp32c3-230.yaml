  - {platform: template, id: hours_nhz2, name: "Reheat hours stage 2", state_class: total_increasing, unit_of_measurement: "h", accuracy_decimals: 0, entity_category: diagnostic, update_interval: never}
  - {platform: template, id: hours_nhz_both, name: "Reheat hours both stages", state_class: total_increasing, unit_of_measurement: "h", accuracy_decimals: 0, entity_category: diagnostic, update_interval: never}

  # ---- named on the second walk -----------------------------------------
  - {platform: template, id: pump_power_heat, name: "Heating pump power setting", unit_of_measurement: "%", accuracy_decimals: 0, entity_category: diagnostic, update_interval: never}
  - {platform: template, id: pump_power_dhw, name: "DHW pump power setting", unit_of_measurement: "%", accuracy_decimals: 0, entity_category: diagnostic, update_interval: never}
  - {platform: template, id: hp_sensor_max, name: "High pressure sensor maximum", device_class: pressure, unit_of_measurement: "bar", accuracy_decimals: 1, entity_category: diagnostic, update_interval: never}
  - {platform: template, id: rest_time, name: "Remaining rest time", unit_of_measurement: "min", accuracy_decimals: 0, entity_category: diagnostic, update_interval: never}

  # The machine's status code, raw. 0 in normal running; 8246 is the utility
  # block. A real fault would arrive here too, which is the reason to keep a
  # number nobody looks at most days.
  - {platform: template, id: status_code, name: "Status code", accuracy_decimals: 0, entity_category: diagnostic, update_interval: never}

  # ---- energy, assembled from three parts each ---------------------------
  # Heat delivered against electricity consumed, which is the pair a seasonal
  # COP is made of. The machine keeps both and has done since it was
  # installed; nothing here computes a ratio, because a ratio of two numbers
  # that update once per panel walk would be a number pretending to be a
  # measurement.
  - {platform: template, id: energy_heat, name: "Heat delivered heating (compressor)", device_class: energy, state_class: total_increasing, unit_of_measurement: "kWh", accuracy_decimals: 3, update_interval: never}
  - {platform: template, id: energy_dhw, name: "Heat delivered DHW (compressor)", device_class: energy, state_class: total_increasing, unit_of_measurement: "kWh", accuracy_decimals: 3, update_interval: never}
  - {platform: template, id: power_heat, name: "Electricity used heating (compressor)", device_class: energy, state_class: total_increasing, unit_of_measurement: "kWh", accuracy_decimals: 3, update_interval: never}
  - {platform: template, id: power_dhw, name: "Electricity used DHW (compressor)", device_class: energy, state_class: total_increasing, unit_of_measurement: "kWh", accuracy_decimals: 3, update_interval: never}
  - {platform: template, id: energy_nhz_heat, name: "Heat delivered reheat heating", device_class: energy, state_class: total_increasing, unit_of_measurement: "kWh", accuracy_decimals: 0, entity_category: diagnostic, update_interval: never}
  - {platform: template, id: energy_nhz_dhw, name: "Heat delivered reheat DHW", device_class: energy, state_class: total_increasing, unit_of_measurement: "kWh", accuracy_decimals: 0, entity_category: diagnostic, update_interval: never}

  # The return temperature as the module reports it, independent of whether
  # the panel is awake and polling 0x180. Same physical value as "Return
  # temperature", read by a different node under a different index.
  - platform: template
    id: return_temp_mod
    name: "Return temperature (module)"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never
    # A single 0.0 °C landed here between two 26 °C readings during the panel
    # walk, and the sentinel guard cannot catch it: 0x0000 is a legal value,
    # just not a possible one for heating water at 26 °C. Zero such samples in
    # eleven hours of clean running and three in 47 minutes of walking, all
    # inside the window bracketed by two watchdog restarts — so it is receiver
    # stress, not the bus, and it only appears in the mode that causes it.
    #
    # A median of three removes an isolated spike completely and invents no
    # threshold, which a range check would have to. These arrive every five
    # seconds, so the cost is about ten seconds of lag on a heating flow
    # temperature — nothing depends on that. send_every must be set: the
    # default is 5, which would also drop the update rate to once every 25 s.
    filters:
      - median:
          window_size: 3
          send_every: 1
          send_first_at: 1
      # **Mediaani ensin, sitten delta.** Järjestys ratkaisee: piikki 26 -> 0,0
      # on deltalle iso muutos ja menisi suoraan läpi, mutta mediaani poistaa
      # sen ennen kuin delta näkee sen. Toisin päin suodatin julkaisisi juuri
      # sen arvon jonka takia se on olemassa.
      #
      # **Kuusi entiteettiä julkaisi viiden sekunnin välein** eli 1226 kertaa
      # kahdessa tunnissa kukin. Se on 0x700:n pollausjakso eikä mittauksen
      # nopeus — arvot eivät muutu sitä tahtia, ne vain kysytään sitä tahtia.
      - or: &muutos_or
          - delta: 0.2
          - heartbeat: 15min

  # Both are flow temperatures, and both are the *module's* reading — the one
  # that keeps arriving every five seconds whether or not anyone is at the
  # panel. Same relationship the return already has: 0x0016 from 0x180 needs a
  # panel, 0xFDF4 from 0x700 does not. Prefer these two for anything that has
  # to work at three in the morning.
  - platform: template
    id: flow_temp_mod
    name: "Flow temperature (module)"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never
    # A single 0.0 °C landed here between two 26 °C readings during the panel
    # walk, and the sentinel guard cannot catch it: 0x0000 is a legal value,
    # just not a possible one for heating water at 26 °C. Zero such samples in
    # eleven hours of clean running and three in 47 minutes of walking, all
    # inside the window bracketed by two watchdog restarts — so it is receiver
    # stress, not the bus, and it only appears in the mode that causes it.
    #
    # A median of three removes an isolated spike completely and invents no
    # threshold, which a range check would have to. These arrive every five
    # seconds, so the cost is about ten seconds of lag on a heating flow
    # temperature — nothing depends on that. send_every must be set: the
    # default is 5, which would also drop the update rate to once every 25 s.
    filters:
      - median:
          window_size: 3
          send_every: 1
          send_first_at: 1
      - or: *muutos_or

  - platform: template
    id: flow_temp_nhz_mod
    name: "Flow temperature reheat (module)"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never
    # A single 0.0 °C landed here between two 26 °C readings during the panel
    # walk, and the sentinel guard cannot catch it: 0x0000 is a legal value,
    # just not a possible one for heating water at 26 °C. Zero such samples in
    # eleven hours of clean running and three in 47 minutes of walking, all
    # inside the window bracketed by two watchdog restarts — so it is receiver
    # stress, not the bus, and it only appears in the mode that causes it.
    #
    # A median of three removes an isolated spike completely and invents no
    # threshold, which a range check would have to. These arrive every five
    # seconds, so the cost is about ten seconds of lag on a heating flow
    # temperature — nothing depends on that. send_every must be set: the
    # default is 5, which would also drop the update rate to once every 25 s.
    filters:
      - median:
          window_size: 3
          send_every: 1
          send_first_at: 1
      - or: *muutos_or

  # The second handle on 0xFE07: it steps within seconds of it, so it is a
  # temperature in the circuit 0xFE1B stops.
  - platform: template
    id: elem_fe09
    name: "Element 0xFE09"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never
    filters:
      - or: *muutos_or

  - platform: template
    id: elem_fe0a
    name: "Element 0xFE0A"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never
    filters:
      - or: *muutos_or



switch:
  # Pysäyttää kaiken pollauksen ilman uutta käännöstä. Se on ainoa asia
  # toimivan väylän ja neljänkymmenenviiden pyynnön välissä, ja jokainen
  # `interval`-lohko tarkistaa sen.
  #
  # **Tämä katosi kerran** kun viereistä kytkintä muokattiin alueenkorvauksella,
  # ja oire oli `Couldn't find ID 'poll_setpoints'` — käännösvirhe eikä
  # hiljainen vika, mutta se maksoi silti flashauskierroksen.
  - platform: template
    name: "Poll setpoints"
    id: poll_setpoints
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

  # ------------------------------------------- phase 2b, the first write
  # **This is the only thing in this file that changes the machine.** It
  # mirrors a frame the panel was caught sending, byte for byte, with the
  # sender changed:
  #
  #     100>180 wr ex=0101 = 256      the panel, captured
  #     680>180 wr ex=0101 = 256      this node
  #
  #   byte 0  0x30 — receiver 0x180 (0x30 << 3), command nibble 0 = write
  #   byte 1  0x00 — 0x180 has no low bits to carry
  #   2-4     FA 01 01 — extended marker, element 0x0101
  #   5-6     01 00 for on, 00 00 for off; et_little_endian puts the number
  #           in the high byte, so "1" is 0x0100
  #
  # **The guard is not optional.** This parameter lives in EEPROM, and the
  # realistic way to exhaust a finite write count is not a person pressing a
  # button but an automation that flaps. Ten minutes between writes is far
  # more than a legionella schedule can use and turns an unbounded risk into
  # a bounded one.
  #
  # The state is not optimistic: it comes from the machine's own answer via
  # element 0x0101, so a refused or lost write shows up as the switch
  # returning to where it was.
  - platform: template
    name: "Legionella treatment"
    id: legionella_sw
    icon: mdi:water-boiler
    # **`DISABLED`, ei oletusta.** Template-kytkimen oletus on
    # `RESTORE_DEFAULT_OFF`, joka julkaisee `OFF`:n käynnistyksessä **ennen
    # kuin lambdaa on kysytty** — ja se ohitti koko tuntematon-tilan:
    #
    #     [07:46:11][S][switch]: 'Legionella treatment' >> OFF
    #
    # Kytkin väitti "pois" 30 sekuntia ennen kuin konetta oli ehditty kysyä.
    # `DISABLED` ei palauta eikä aseta alkutilaa, jolloin lambda saa päättää
    # ja tila on tuntematon kunnes 0x0101 on luettu.
    restore_mode: DISABLED
    # Tuntematon kunnes kone on vastannut. HA näyttää sen `unknown`-tilana
    # eikä "pois"-tilana, mikä on ainoa rehellinen vaihtoehto ennen kuin
    # elementti 0x0101 on luettu kertaakaan.
    lambda: |-
      if (!id(legionella_seen))
        return {};
      return id(legionella_on);
    turn_on_action:
      - if:
          condition:
            lambda: |-
              const uint32_t now = millis();
              if (id(legionella_last_write) != 0 && now - id(legionella_last_write) < 600000) {
                ESP_LOGW("can", "legionella write refused: %lu s since the last one",
                         (unsigned long) ((now - id(legionella_last_write)) / 1000));
                return false;
              }
              id(legionella_last_write) = now;
              return true;
          then:
            - lambda: 'ESP_LOGW("can", "TX 0x680: 30 00 FA 01 01 01 00  (legionella ON)");'
            - canbus.send: {canbus_id: can0, can_id: 0x680, use_extended_id: false,
                            data: [0x30, 0x00, 0xFA, 0x01, 0x01, 0x01, 0x00]}
            # **Lue takaisin.** Kirjoitusta ei kuitata — se todettiin
            # lämpökäyrän kohdalla — joten ilman tätä kytkin napsahtaa
            # takaisin vanhaan tilaansa riippumatta siitä menikö kirjoitus
            # läpi. Tila tulee koneen vastauksesta, ei komennosta.
            - delay: 1500ms
            - canbus.send: {canbus_id: can0, can_id: 0x680, use_extended_id: false,
                            data: [0x31, 0x00, 0xFA, 0x01, 0x01, 0x00, 0x00]}
    turn_off_action:
      - if:
          condition:
            lambda: |-
              const uint32_t now = millis();
              if (id(legionella_last_write) != 0 && now - id(legionella_last_write) < 600000) {
                ESP_LOGW("can", "legionella write refused: %lu s since the last one",
                         (unsigned long) ((now - id(legionella_last_write)) / 1000));
                return false;
              }
              id(legionella_last_write) = now;
              return true;
          then:
            - lambda: 'ESP_LOGW("can", "TX 0x680: 30 00 FA 01 01 00 00  (legionella OFF)");'
            - canbus.send: {canbus_id: can0, can_id: 0x680, use_extended_id: false,
                            data: [0x30, 0x00, 0xFA, 0x01, 0x01, 0x00, 0x00]}
            # **Lue takaisin.** Kirjoitusta ei kuitata — se todettiin
            # lämpökäyrän kohdalla — joten ilman tätä kytkin napsahtaa
            # takaisin vanhaan tilaansa riippumatta siitä menikö kirjoitus
            # läpi. Tila tulee koneen vastauksesta, ei komennosta.
            - delay: 1500ms
            - canbus.send: {canbus_id: can0, can_id: 0x680, use_extended_id: false,
                            data: [0x31, 0x00, 0xFA, 0x01, 0x01, 0x00, 0x00]}

  # Per-frame logging, off at every boot. See the frame handler for why.
  - platform: template
    id: log_frames
    name: "Log every frame"
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config

  # The menu-walk switch: adds unclaimed read requests to the log, so a
  # screen's elements are named by what the panel asks for and not only by
  # what answers.
  #
  # RESTORE_DEFAULT_OFF and not ALWAYS_OFF like the one above, and the
  # difference is the watchdog. A stall trips it, the node is back in 14
  # seconds, and ALWAYS_OFF would have quietly switched the logging off in
  # the meantime — which during a walk means writing down screens that no
  # longer reach the log, and finding out afterwards. Restoring the state
  # across a restart costs nothing and removes a whole class of lost session.
  #
  # It still boots off after a flash, which is what matters for the default.
  # Leaving it on is wasteful rather than dangerous: read requests are 44 %
  # of traffic, so about 1.3 lines a second against the ~4 that stalled the
  # receiver. Turn it back off when the walk is done.
  - platform: template
    id: log_reads
    name: "Log read requests"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config


binary_sensor:
  # Status code 8246, which marks the EVU load block. On this installation
  # Home Assistant closes that input on the expensive spot hours, so this is
  # the machine reporting back on a block HA asked for — the half of the loop
  # HA has never been able to see.
  #
  # **It is a signal, not the block itself, and the arithmetic is what says
  # so.** The configured delays make any block at least 20 minutes long. The
  # register is written every 52 seconds without a gap, and across 211 writes
  # in one night it read 8246 for at most 13 minutes 5 seconds — bounded by a
  # 0 at 19:48:51 and the next 0 at 20:01:58. A code that clears while the
  # block is still running cannot be the block's state.
  #
  # So the name says signal, and **the latching belongs in Home Assistant**,
  # which knows its own delays. Encoding a 20-minute timer here would bake one
  # installation's automation settings into a heat pump reader, and it would be
  # wrong the day those settings change.
  #
  # Whether 8246 marks the request or the engagement is still open: the
  # capture cannot separate them, because the compressor would not have run in
  # that window either way.
  #
  # No device_class: `problem` would be wrong, because this is normal
  # contracted operation, and `running` inverts the sense.
  #
  # And no `update_interval` either, unlike every publish-only sensor above:
  # a template binary sensor is not a polling component, so the option that
  # says "never poll" is rejected rather than ignored. With no lambda it is
  # already publish-only, which is what the sensors need the option to say.
  - platform: template
    id: evu_block
    name: "EVU signal"

  # The contact as the machine reports it, from 0x0074. **ON means the pump is
  # permitted to run**, which is the same counter-intuitive direction the Shelly
  # relay has — see ../aidon/. The name says `permitted` rather than `block`
  # precisely because an automation written against the wrong sense would stop
  # the heating in January and look correct while doing it.
  - platform: template
    id: evu_permitted
    name: "EVU permitted"
    device_class: running

  # **Käyntitila johdetaan paine-erosta.** Kaksi aiempaa lähdettä on hylätty
  # ja kumpikin samasta syystä: ne olivat koneelle annettuja tai koneen
  # kertomia tiloja, eivät mittauksia siitä mitä tapahtuu.
  #
  # `0xFE1D` oli managerin *käsky* 0x700:lle. `0x4E5E` bitti 9 näytti
  # paremmalta — se vaihtuu siirtymässä — mutta se osoittautui
  # käyttövesilataukseksi eikä kompressoriksi: 21.9. iltapäivänä kompressori
  # kävi 104 painenäytteessä joissa bitti oli pois, ja 15 näytteessä joissa
  # bitti oli päällä se kävi aina. Bitti on siis riittävä muttei
  # välttämätön ehto, ja entiteetti luki pois päältä koko lämmitysajon.
  #
  # **Paine-ero on itse ilmiö.** Seisovalla koneella korkea ja matala
  # tasaantuvat 0,3–0,6 baarin päähän; käyvällä ne ovat 7–30 baaria
  # erillään. Väliin jäävät arvot esiintyvät vain pysähtymisen jälkeisessä
  # tasaantumisessa, joten kynnyksiä on kaksi eikä yksi:
  #
  #     yli 5 bar   -> käy
  #     alle 2 bar  -> seisoo
  #     väliin      -> pidä edellinen
  #
  # Hinta on karkeus: paineet pollataan kahden minuutin välein, joten tila on
  # enintään sen verran myöhässä. Väärässä se ei ole.
  #
  # **Vanhentunut paine palauttaa tyhjän.** Pollaus riippuu
  # `poll_setpoints`-kytkimestä, ja entiteetti joka jäätyy viimeiseen
  # arvoonsa lähteen kadotessa on juuri se vika jonka tämä korvaa.
  - platform: template
    id: compressor
    name: "Compressor"
    device_class: running
    lambda: |-
      if (id(pressure_seen_at) == 0) return {};
      if (millis() - id(pressure_seen_at) > 6 * 60 * 1000) return {};
      if (!id(pressure_high).has_state() || !id(pressure_low).has_state())
        return {};

      const float ero = id(pressure_high).state - id(pressure_low).state;
      bool tila = id(c_state);
      if (ero > 5.0f)       tila = true;
      else if (ero < 2.0f)  tila = false;

      if (!id(c_known) || tila != id(c_state)) {
        const bool nousi = tila && !id(c_state);
        id(c_known)     = true;
        id(c_state)     = tila;
        id(c_change_ms) = millis();
        if (nousi) id(c_rise_ms) = millis();
      }
      return tila;

  # **Tilasana ja kone eivät enää liiku yhdessä.** Kaksi ehtoa, kumpikin
  # vertaa managerin omaa kertomaa siihen mitä paineet näyttävät.
  #
  # 20.9. tilasana `0x4E5E` jäätyi kesken käyttövesilatausta arvoon 689 eikä
  # liikkunut 29 tuntiin. Bitti 9 eli kompressori jäi siihen päälle. Kone ei
  # lämmittänyt mitään koko sinä aikana: varaaja valui 54,3:sta 38,5:een,
  # jokainen sallinta luki vihreää eikä paneelissa ollut vikailmoitusta.
  # Sekunnin virtakatko ohjaimessa vapautti sen.
  #
  # **Ehdoksi ei kelpaa "sana ei ole muuttunut hetkeen".** Sana muuttuu vain
  # siirtymissä, ja seisova kone pitää arvon 1 tai 65 tunteja — 19.9. se
  # seisoi paikallaan 2 h 16 min täysin terveenä. Aikaraja joka ei laukea
  # siitä ei laukea jumistakaan.
  #
  # **Ehdoksi kelpaa ristiriita.** Seisovalla koneella korkea ja matala paine
  # tasaantuvat kolmen kymmenyksen päähän toisistaan; käyvällä ne erkanevat
  # kahteenkymmeneen baariin. Se on fysiikkaa eikä tilabitti, ja se oli koko
  # jumin ajan ainoa asia joka kertoi totuuden. Kun bitti 9 ja paine-ero ovat
  # eri mieltä tarpeeksi kauan, jompikumpi on rikki — ja se on aina bitti.
  #
  # **Viisitoista minuuttia**, koska käynnistyksessä ne ovat oikeasti eri
  # mieltä hetken: 21.9. bitti nousi 06:22:37 ja paineet olivat erkaantuneet
  # viimeistään 06:24:34, eli alle kahdessa minuutissa. Marginaali on
  # seitsenkertainen eikä jumi kestänyt 29 tuntia sen takia että se olisi
  # ollut rajatapaus.
  #
  # **Vanhentunut paine ei ole "ei jumia".** Paineet pollataan vain kun
  # `poll_setpoints` on päällä, joten niiden lähde voi olla poissa. Silloin
  # tämä palauttaa tyhjän eikä epätoden: vahdin hiljaisuus ja vahdin sokeus
  # eivät saa näyttää samalta. Sama virhe tehtiin tässä projektissa jo kerran
  # legionellavahdin kanssa.
  - platform: template
    id: manager_stuck
    name: "Manager state stuck"
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      // Ilman tilasanaa ei ole väitettä, jota verrata.
      if (!id(compressor_from_status)) return {};

      // Paineparin on oltava tuore. Kaksi minuuttia on pollausväli, kuusi
      // antaa kahden epäonnistuneen kierroksen verran löysää.
      if (id(pressure_seen_at) == 0) return {};
      if (millis() - id(pressure_seen_at) > 6 * 60 * 1000) return {};

      if (!id(pressure_high).has_state() || !id(pressure_low).has_state())
        return {};
      const float hp = id(pressure_high).state;
      const float lp = id(pressure_low).state;

      const bool claims_running = id(compressor).state;
      const bool equalised = (hp - lp) < 2.0f;

      if (claims_running && equalised) {
        if (id(stuck_since) == 0) id(stuck_since) = millis();
        if ((millis() - id(stuck_since)) > 15 * 60 * 1000) return true;
      } else {
        id(stuck_since) = 0;
      }

      // **Ehto B: kompressori vaihtoi tilaa eikä tilasana seurannut.**
      //
      // Ehto A yllä näkee vain latauksen aikaisen jumin, koska bitti 9 on
      // pois lämmitysajossa. 20.9. jumi sattui osumaan lataukseen; se oli
      // tuuria eikä kattavuutta.
      //
      // Yleinen tuntomerkki ei ole sanan arvo vaan se, **etteivät sana ja
      // kone enää liiku yhdessä.** Terveessä ajossa sana vaihtuu sekunneissa
      // jokaisessa kompressorin siirtymässä. Jumissa kompressori pysähtyi
      // 02:00 eikä sana ollut liikkunut 01:06 jälkeen.
      //
      // "Sana ei ole muuttunut hetkeen" ei yksin kelpaa kummassakaan
      // suunnassa: seisova kone pitää arvon tunteja, ja kesken latauksen
      // sana oli 21.9. paikallaan 76 minuuttia täysin terveenä.
      //
      // **Vain nouseva reuna, ja se on mitattu eikä valittu.**
      // Käynnistyksessä paineet erkanevat kahdessa minuutissa: 06:22:37 ->
      // 06:24:34 ja 10:54:00 -> 10:55:40, molemmat pollausväli mukaan
      // lukien. Pysähdyksessä ne purkautuvat 0-19 minuuttia riippuen siitä
      // kuinka korkealle lauhdutuspaine ehti — pitkän latauksen jälkeen
      // 06:46:51 pysähdyksestä kesti 07:06 asti.
      //
      // Molemmat reunat mukaan ottava versio antoi tästä syystä 3,5 tunnin
      // väärän hälytyksen tämän päivän täysin terveestä EVU-estosta.
      // Nouseva reuna yksin ei anna yhtään.
      //
      // Viisi minuuttia tolerointia, kymmenen vahvistusta. Ehto purkautuu
      // itsestään heti kun sana seuraavan kerran vaihtuu.
      if (id(c_known) && id(w_change_ms) != 0 && id(c_rise_ms) != 0) {
        const uint32_t c = id(c_rise_ms), w = id(w_change_ms);
        if (c > w && (c - w) > 5 * 60 * 1000 &&
            (millis() - c) > 10 * 60 * 1000)
          return true;
      }

      // **Mitä tämä ei vieläkään näe.** Jos tilakone jäätyy lämmitysajon
      // aikana *ja* kone pysähtyy kokonaan, bitti 9 on pois (ehto A ei
      // laukea) eikä uutta käynnistystä tule (ehto B ei laukea). Sellainen
      // jumi näkyisi vain siitä että lämmintä vettä ei tule — eli varaajan
      // valumisesta asetusarvon alle tuntikausiksi kompressorin seistessä.
      // Se on eri kysymys ja ansaitsee oman entiteettinsä; tämä ei teeskentele
      // kattavansa sitä.
      return false;
    # Lokiin WARN-tasolla, jotta lokia lukevat vahdit näkevät tämän ilman
    # HA:ta — samalla tavalla kuin legionellalipun siirtymä.
    on_press:
      - logger.log:
          level: WARN
          format: "manager stuck: 0x4E5E and the compressor no longer agree"
    on_release:
      - logger.log:
          level: WARN
          format: "manager stuck: cleared"


text_sensor:
  - platform: template
    id: operating_mode
    name: "Operating mode"
    update_interval: never

  # Not decoration: this is how the eleven-minute clock drift was found, and
  # it is how anyone notices it drifting again.
  - platform: template
    id: pump_clock
    name: "Heat pump clock"
    entity_category: diagnostic
    update_interval: never
