# Stiebel Eltron WPC 07 — phase 1 CAN sniffer
#
# Listen-only. This node never drives the bus: it confirmed the bit rate, and it
# now captures frames, decoded, for mapping against the element lists.
#
# Hardware for this phase (see CLAUDE.md, "Phase 1: sniffing before the final
# circuit"): the plain MCP2515 + TJA1050 module run entirely at 3.3 V.
# Measured on this module: H to L reads 49 kOhm, so the on-board 120 Ohm is
# already out of circuit and needs no work. TJA1050 pin 1 (TXD) lifted and tied
# to VCC is the remaining option, and only if `mode: LISTENONLY` below is
# rejected by the installed ESPHome. A transceiver purchase belongs to phase 2.
#
# Wemos D1 mini pins (hardware SPI):
#   D5 = SCK, D6 = SO (MISO), D7 = SI (MOSI), D8 = CS
# The module's INT pin stays unconnected — ESPHome's mcp2515 polls, it takes no
# interrupt pin. If the board fails to boot, move CS off D8: GPIO15 must be low
# at boot and a floating CS line can hold it high.

substitutions:
  # Confirmed from the module in hand: X1 is marked 8.000, so 8 MHz. Re-check
  # the marking if a different module is used — a 16 MHz board configured as
  # 8 MHz gets the bit rate wrong by a factor of two and nothing decodes.
  can_clock: "8MHZ"

  # Measured on this machine, no sweep needed: frames appeared at the first
  # configured value. Kept as a substitution because the rate is fixed at
  # compile time — changing it is an edit and a re-flash, never a runtime knob.
  can_bit_rate: "20KBPS"

esphome:
  name: wpc-can
  friendly_name: WPC 07 CAN

esp8266:
  board: d1_mini

logger:
  # INFO, not DEBUG. At DEBUG the canbus and mcp2515 components log every frame
  # themselves, on top of the on_frame handler below — and on a busy bus that is
  # slow enough to fill the MCP2515's two receive buffers, which then reports
  # "receive buffer overrun" and drops frames. INFO keeps our own capture lines
  # and drops the duplicates.
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# The watchdog restarts this node every 20 s while the MCP2515 is misbehaving,
# and on the default one-minute boot_is_good_after that is indistinguishable
# from a boot loop: ten restarts and the node comes up in safe mode, without
# the canbus component, without saying anything anyone would notice. Fifteen
# seconds is below the watchdog's own window, so a node that is merely being
# restarted always counts as having booted successfully.
safe_mode:
  boot_is_good_after: 15s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "WPC CAN fallback"
    password: !secret ap_password

captive_portal:


# ------------------------------------------------------------------------ CAN
# mode: LISTENONLY is the whole point of this phase — a node in NORMAL mode
# acknowledges frames and emits error frames even when it sends nothing of its
# own, and with the wrong bit rate that disturbs the heat pump's own traffic.
# It compiles on the installed ESPHome, so nothing was lifted in hardware. If a
# future upgrade ever rejects `mode:`, that is a safe failure — but it also
# removes the only thing keeping this node passive, so lift the TJA1050's pin 1
# before flashing rather than after.
#
# can_id is the transmit identifier. Nothing is ever transmitted here, but the
# schema requires it.

canbus:
  - platform: mcp2515
    id: can0
    cs_pin: D8
    clock: ${can_clock}
    bit_rate: ${can_bit_rate}
    mode: LISTENONLY
    can_id: 0x000

    on_frame:
      # can_id_mask 0x000 matches every identifier — this is a sniffer, not a
      # filter. The extended-id trigger that used to sit beside this one is
      # gone: it existed to prove the protocol really is 11-bit standard ids,
      # it stayed silent through the first capture, and that is proof enough.
      - can_id: 0x000
        can_id_mask: 0x000
        use_extended_id: false
        then:
          - lambda: |-
              // Decode into the log rather than dumping hex, because the byte
              // layout is now confirmed by capture (CLAUDE.md, "Prior art"):
              //
              //   byte 0  receiver's high bits (>> 3) in the high nibble,
              //           command in the low nibble
              //   byte 1  receiver's low 7 bits — nonzero only for a
              //           sub-addressed node such as 0x301
              //   byte 2  element index, or 0xFA meaning "index in bytes 3-4"
              //
              // Reading a capture then needs no mental arithmetic, which is
              // the whole job of the next step: matching element indices
              // against the published element list.
              //
              // Fixed buffers, no std::string: this runs once per frame and
              // the ESP8266 heap does not want per-frame allocations.
              id(frame_count) += 1;

              const uint8_t n = x.size();
              const uint8_t cmd = n >= 1 ? (x[0] & 0x0F) : 0xFF;

              // Shape check before decoding, and the bounds come from the
              // capture rather than from optimism:
              //
              //   n != 7      not an Elster telegram at all
              //   cmd > 5     system frames (6, 7) do not use this layout —
              //               their byte 1 carries 0x79, which is no address,
              //               so decoding a receiver from it invents nodes
              //   x[2] > 0xFA the only defined marker is 0xFA. A frame with
              //               0xFB there appeared twice, seconds before a
              //               receive stall, and decoded to nonsense
              //
              // Everything excluded is logged raw. A decoder that mis-decodes
              // silently is worse than no decoder — raw hex in the log is how
              // these three cases were found in the first place.
              if (n != 7 || cmd > 5 || x[2] > 0xFA) {
                char raw[25] = {0};
                for (uint8_t i = 0; i < n && i < 8; i++)
                  sprintf(raw + i * 3, "%02X ", x[i]);
                ESP_LOGI("can", "%03X raw dlc=%u  %s",
                         (unsigned) can_id, (unsigned) n, raw);
                return;
              }

              static const char *const CMD[6] = {
                  "wr", "rd", "resp", "ack", "wack", "wres"};

              const uint16_t receiver =
                  ((uint16_t) (x[0] & 0xF0) << 3) | (x[1] & 0x7F);
              const bool ext = x[2] == 0xFA;
              const uint16_t element =
                  ext ? ((uint16_t) x[3] << 8 | x[4]) : x[2];
              const uint16_t value = ext ? ((uint16_t) x[5] << 8 | x[6])
                                         : ((uint16_t) x[3] << 8 | x[4]);

              // A read request's value bytes are padding, so printing them
              // would invent data that is not on the bus.
              char val[24] = {0};
              if (cmd != 1)
                snprintf(val, sizeof(val), " = %d (0x%04X)",
                         (int) (int16_t) value, value);

              // The short form leaves bytes 5-6 outside the documented
              // layout, and they are not always zero: 45 frames in a two-hour
              // capture carried a small value in byte 6, unexplained. Show
              // them rather than drop them.
              char tail[16] = {0};
              if (!ext && (x[5] || x[6]))
                snprintf(tail, sizeof(tail), " +%02X%02X", x[5], x[6]);

              // Off by default, and the reason is measured: logging every
              // frame is ~4 lines a second serialised and encrypted over the
              // API, and the node was stalling after 26-77 seconds of it. The
              // entity publishes below carry the data that is actually wanted
              // overnight, and they cost a fraction of this. Turn the switch
              // on in Home Assistant for a minute when raw frames are needed.
              //
              // The raw fallback above is NOT gated — those are rare and they
              // are how 0x704 and the command-10 frames were found at all.
              if (id(log_frames).state)
                ESP_LOGI("can", "%03X>%03X %-4s %2s=%04X%s%s",
                         (unsigned) can_id, (unsigned) receiver, CMD[cmd],
                         ext ? "ex" : "e", element, val, tail);

              // ---- publish the named elements ---------------------------
              // Dispatch on sender AND element. The same index means
              // different things on different devices, which is the main
              // lesson of matching the capture against the element list:
              // 0xFDF4 from 0x700 is a return temperature, and the list's
              // name for that index is something else entirely.

              if (cmd == 2 && can_id == 0x180) {
                // et_dec_val: tenths, signed, negatives are legal
                const float t = (int16_t) value / 10.0f;
                switch (element) {
                  case 0x0003: id(dhw_setpoint).publish_state(t); break;
                  case 0x000C: id(outdoor_temp).publish_state(t); break;
                  case 0x000E: id(dhw_temp).publish_state(t);     break;
                  case 0x0016: id(return_temp).publish_state(t);  break;
                }
              } else if (cmd == 2 && can_id == 0x301 && element == 0x0004) {
                id(flow_setpoint).publish_state((int16_t) value / 10.0f);
              } else if (cmd == 2 && can_id == 0x700) {
                // Neither of these is in the element list, so both are named
                // from behaviour and neither gets a scaling it has not
                // earned. The list's tenths apply to et_dec_val elements;
                // an element with no entry has no type either.
                switch (element) {
                  case 0xFE1D:
                    // The compressor. The manager commands 0 or 100 and the
                    // module reports 1 or 98 back, and its on-window is the
                    // only one in the capture that matches heat actually
                    // being made: tank rising, flow and return at 53-54.
                    // Binary because 0 and 100 are the only commands seen —
                    // if a middle value ever appears this wants to become a
                    // percentage instead.
                    id(compressor).publish_state(value > 50);
                    break;
                  // 0xFE1B is the command whose consequence 0xFE07 measures,
                  // so identifying one needs the other visible. 0xFE1C is
                  // here because it modulates (0, 12, 100) and is the only
                  // other output that moves. Raw, unnamed, diagnostic — the
                  // same rule as 0xFE07.
                  case 0xFE1B: id(elem_fe1b).publish_state((int16_t) value); break;
                  case 0xFE1C: id(elem_fe1c).publish_state((int16_t) value); break;
                  case 0xFE07:
                    // Published raw, and named after nothing, because it is
                    // not identified. What is known: 0xFE1B commands it and
                    // this measures the result, inverted — commanding 0xFE1B
                    // to 100 is what stops it. It has three operating points,
                    // 0 and about 56 and about 52 with the compressor
                    // running, and it takes ten seconds to move between them,
                    // coasting down through 7 and overshooting to 59 on the
                    // way up. Something with mass in it, so a pump or a flow.
                    // Which pump and in what units is open; see CLAUDE.md,
                    // and check the heat pump's own display first.
                    id(elem_fe07).publish_state((int16_t) value);
                    break;
                }
              } else if ((cmd == 0 || cmd == 2) && can_id == 0x480) {
                // The clock and the mode are et_little_endian: the number is
                // the high byte and the low byte is padding. Writes count as
                // well as responses here — the manager writes the minute
                // every 60 s and is only asked for the date now and then.
                const uint8_t n = value >> 8;
                switch (element) {
                  case 0x0112: {
                    static const char *const MODE[6] = {
                        "Emergency", "Standby", "Automatic",
                        "Day", "Setback", "DHW only"};
                    id(operating_mode).publish_state(n < 6 ? MODE[n] : "?");
                    break;
                  }
                  case 0x0122: id(clk_day)   = n; break;
                  case 0x0123: id(clk_month) = n; break;
                  case 0x0124: id(clk_year)  = n; break;
                  case 0x0125: id(clk_hour)  = n; break;
                  case 0x0126:
                    id(clk_minute) = n;
                    // The minute is the only part that arrives every minute,
                    // so it is what triggers a publish. Publish only a date
                    // that is actually a date: unknown is honest, and both
                    // "2000-00-00" and a corrupt frame's "2026-255-05" are
                    // not. Every part is refreshed whenever the panel polls,
                    // so a rejected reading costs one minute, not a stuck
                    // entity.
                    if (id(clk_month) >= 1 && id(clk_month) <= 12 &&
                        id(clk_day) >= 1 && id(clk_day) <= 31 &&
                        id(clk_hour) <= 23 && id(clk_minute) <= 59 &&
                        id(clk_year) <= 99) {
                      char stamp[24];
                      snprintf(stamp, sizeof(stamp),
                               "20%02u-%02u-%02u %02u:%02u",
                               id(clk_year), id(clk_month), id(clk_day),
                               id(clk_hour), id(clk_minute));
                      id(pump_clock).publish_state(stamp);
                    }
                    break;
                }
              }

spi:
  clk_pin: D5
  mosi_pin: D7
  miso_pin: D6


# -------------------------------------------------------------- Frame counter
# The one number that answers "is the bit rate right?" without reading the log.
# Stays at zero on a wrong bit rate; climbs steadily on a correct one.

globals:
  - id: frame_count
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Watchdog state. See "the silent stall" below.
  - id: last_seen_count
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: quiet_checks
    type: uint8_t
    restore_value: false
    initial_value: "0"

  # The heat pump's own clock, assembled from five elements that arrive
  # separately. clk_month stays 0 until a date has actually been seen, which
  # is what the frame handler tests before publishing.
  - id: clk_day
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: clk_month
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: clk_year
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: clk_hour
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: clk_minute
    type: uint8_t
    restore_value: false
    initial_value: "0"


# ------------------------------------------------------------------ Watchdog
# The MCP2515 latches an overflow flag when both receive buffers fill, and
# reception then stops for good until the chip is reset — the node stays online,
# the log stays clean, and no frames ever arrive again. Observed on 2026-09-05
# after a burst of "receive buffer overrun" messages.
#
# A stalled node is indistinguishable from a quiet bus by eye, which is what
# makes it dangerous during an overnight capture. So: if the counter has not
# moved, restart and say so in the log.
#
# The window was 30 minutes while the bus's rhythm was unknown. A two-hour
# capture measured it, and the answer is blunt: the longest gap between frames
# is 4.7 s, both stalls lasted 2070 s, and there is nothing in between. The
# distribution has two peaks and no middle, so the threshold can sit almost
# anywhere between them.
#
# Two minutes was the second guess, and it was still far too long. A later run
# stalled after 26 to 77 seconds of operation rather than once in half an hour,
# so the window cost more than the fault did: 150 seconds dead for every 26
# alive. **The watchdog window has to be shorter than the fault is frequent**,
# and the fault turned out to be much more frequent than the first capture
# suggested.
#
# Twenty seconds still leaves a fourfold margin over the worst natural gap of
# 4.7 s, which is the only number here that has not moved.
#
# Restarting this often *would* trip safe mode on the defaults, and that is the
# trap this comment exists for: boot_is_good_after is one minute, so a node
# that runs 26 seconds and restarts never resets the boot loop counter, and
# after ten of those it boots into safe mode with no CAN at all — quietly, for
# the rest of the night. Hence the safe_mode block above.

interval:
  - interval: 10s
    then:
      - lambda: |-
          if (id(frame_count) == id(last_seen_count)) {
            id(quiet_checks) += 1;
          } else {
            id(quiet_checks) = 0;
            id(last_seen_count) = id(frame_count);
          }
      - if:
          condition:
            lambda: "return id(quiet_checks) >= 2;"
          then:
            - logger.log:
                level: WARN
                format: "No frames for 20 s - restarting to clear the MCP2515 overflow latch"
            - button.press: restart_button

button:
  - platform: restart
    name: "Restart"
    id: restart_button
    entity_category: diagnostic

sensor:
  - platform: template
    name: "CAN frames"
    id: can_frames
    accuracy_decimals: 0
    update_interval: 10s
    unit_of_measurement: "frames"
    state_class: total_increasing
    entity_category: diagnostic
    lambda: "return id(frame_count);"


# ------------------------------------------------------------------ Sensors
# The elements that matching the capture against the published element list
# named with confidence. Entity names are English, matching this project's
# documents rather than the list's German.
#
# All of these are `update_interval: never` and carry no lambda: they are
# publish-only, and the frame handler pushes into them as values arrive on the
# bus. Polling them would invent an update rate the bus does not have.
#
# Four of the five update on their own, because the panel polls 0x180 every
# ten seconds without anyone touching the machine. **The two setpoints do
# not** — they were asked for once in a two-hour capture, so they stay unknown
# until something on the bus asks. That is worth knowing before wondering why
# an entity is empty.
#
# Deliberately absent: IMPULSRATE, DYNAMIK and BRENNER. They are named in the
# list, but each appeared once or twice in two hours, none has a verified
# meaning on this machine, and an entity that is unknown forever is noise.
# Also absent is everything from 0x700 — that range is not in the list at all.
# The compressor is legible there anyway (0xFE07 and 0xFE1D switch together),
# and it is one `case` away once those two are confirmed.

  - platform: template
    id: return_temp
    name: "Return temperature"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: dhw_temp
    name: "DHW tank temperature"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: dhw_setpoint
    name: "DHW setpoint"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: flow_setpoint
    name: "Flow setpoint"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never

  # Read the capture before trusting this one: it sat at exactly 15.3 °C for
  # two hours without a tenth of movement. Either no outdoor sensor feeds this
  # bus or the value is a placeholder — and heating curve control, which is
  # what phase 2 is for, depends on the answer.
  - platform: template
    id: outdoor_temp
    name: "Outdoor temperature"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never

  # No unit and no device class on purpose: 0xFE07 is not in the element list,
  # so nothing is known about its scaling and the raw integer is the only
  # honest thing to publish. Rename it the day it is identified.
  - platform: template
    id: elem_fe07
    name: "Element 0xFE07"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: elem_fe1b
    name: "Element 0xFE1B"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: elem_fe1c
    name: "Element 0xFE1C"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never


switch:
  # Per-frame logging, off at every boot. See the frame handler for why.
  - platform: template
    id: log_frames
    name: "Log every frame"
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config


binary_sensor:
  # Named from behaviour rather than from the list — see the frame handler.
  - platform: template
    id: compressor
    name: "Compressor"
    device_class: running


text_sensor:
  - platform: template
    id: operating_mode
    name: "Operating mode"
    update_interval: never

  # Not decoration: this is how the eleven-minute clock drift was found, and
  # it is how anyone notices it drifting again.
  - platform: template
    id: pump_clock
    name: "Heat pump clock"
    entity_category: diagnostic
    update_interval: never
