<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1450" width="760" height="1450" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="760" height="1450" fill="#E9ECEF"/>
  <rect x="20" y="20" width="720" height="1410" fill="none" stroke="#A8B3BC"/>

  <text x="40" y="58" font-size="21" font-weight="700" fill="#16212B" letter-spacing="1.5">PHASE 2a &#8212; THE ASKING NODE</text>
  <text x="40" y="80" font-size="12" fill="#5A6772">ESP32-C3 + SN65HVD230 &#183; no MCP2515, no SPI, no lifted pin &#183; same wiring serves the listen test</text>
  <line x1="20" y1="98" x2="740" y2="98" stroke="#A8B3BC"/>

  <text x="50" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">NODE</text>
  <text x="332" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">TRANSCEIVER</text>
  <text x="592" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">HEAT PUMP</text>

  <!-- C3 -->
  <rect x="50" y="150" width="180" height="250" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <text x="140" y="176" font-size="13" font-weight="700" fill="#16212B" text-anchor="middle">ESP32-C3</text>
  <text x="140" y="192" font-size="10" fill="#5A6772" text-anchor="middle">SuperMini</text>
  <g font-size="11" fill="#16212B">
    <text x="150" y="204">3V3</text>
    <text x="150" y="240">GND</text>
    <text x="126" y="276">GPIO4</text>
    <text x="126" y="312">GPIO3</text>
  </g>
  <text x="140" y="372" font-size="11" font-weight="700" fill="#16212B" text-anchor="middle">5V</text>
  <text x="140" y="388" font-size="9.5" fill="#5A6772" text-anchor="middle">from the buck below</text>

  <!-- VP230 -->
  <rect x="330" y="150" width="180" height="250" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <text x="420" y="176" font-size="13" font-weight="700" fill="#16212B" text-anchor="middle">SN65HVD230</text>
  <text x="420" y="192" font-size="10" fill="#5A6772" text-anchor="middle">VP230 breakout</text>
  <g font-size="11" fill="#16212B">
    <text x="340" y="204">3V3</text>
    <text x="340" y="240">GND</text>
    <text x="340" y="276">CTX</text>
    <text x="340" y="312">CRX</text>
    <text x="466" y="348" text-anchor="end">CANH</text>
    <text x="466" y="384" text-anchor="end">CANL</text>
  </g>
  <rect x="356" y="326" width="70" height="16" rx="2" fill="#FFFFFF" stroke="#0E6E7C"/>
  <text x="391" y="339" font-size="9.5" font-weight="700" fill="#0E6E7C" text-anchor="middle">R1 9.5 k&#8486;</text>
  <rect x="356" y="360" width="70" height="16" rx="2" fill="#FFFFFF" stroke="#0E6E7C"/>
  <text x="391" y="373" font-size="9.5" font-weight="700" fill="#0E6E7C" text-anchor="middle">R2 115 &#8486;</text>

  <!-- X27 -->
  <rect x="590" y="150" width="120" height="250" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <text x="650" y="176" font-size="13" font-weight="700" fill="#16212B" text-anchor="middle">X27</text>
  <text x="650" y="192" font-size="10" fill="#5A6772" text-anchor="middle">board A2</text>
  <g font-size="11" fill="#16212B">
    <text x="602" y="348">1  H</text>
    <text x="602" y="384">2  L</text>
    <text x="602" y="240">3  &#9179;</text>
  </g>
  <rect x="598" y="404" width="104" height="30" rx="2" fill="#FFF0EE" stroke="#A3301F"/>
  <text x="608" y="424" font-size="11" font-weight="700" fill="#A3301F">4  +12V</text>

  <!-- wires -->
  <g stroke="#0E6E7C" stroke-width="1.5" fill="none">
    <line x1="230" y1="200" x2="330" y2="200"/>
    <line x1="230" y1="272" x2="330" y2="272"/>
    <line x1="510" y1="344" x2="590" y2="344"/>
  </g>
  <g stroke="#2E5F8A" stroke-width="1.5" fill="none">
    <line x1="230" y1="308" x2="330" y2="308"/>
    <line x1="510" y1="380" x2="590" y2="380"/>
  </g>
  <!-- ground: one net, drawn heavy so it cannot be mistaken for a signal -->
  <g stroke="#16212B" stroke-width="3" fill="none">
    <line x1="230" y1="236" x2="590" y2="236"/>
    <line x1="550" y1="236" x2="550" y2="546"/>
    <line x1="550" y1="546" x2="420" y2="546"/>
    <line x1="420" y1="546" x2="420" y2="530"/>
  </g>
  <g fill="#16212B">
    <circle cx="330" cy="236" r="4"/>
    <circle cx="510" cy="236" r="4"/>
    <circle cx="550" cy="236" r="4"/>
  </g>
  <g stroke="#16212B" stroke-width="2" fill="none">
    <line x1="668" y1="236" x2="690" y2="236"/>
    <line x1="684" y1="230" x2="684" y2="242"/>
    <line x1="687" y1="234" x2="687" y2="238"/>
  </g>
  <g font-size="9.5" fill="#5A6772">
    <text x="280" y="194" text-anchor="middle">3.3 V</text>
    <text x="280" y="266" text-anchor="middle">CTX</text>
    <text x="280" y="302" text-anchor="middle">CRX</text>
    <text x="400" y="228" font-weight="700" fill="#16212B" text-anchor="middle">COMMON GROUND &#8212; ONE NET</text>
    <text x="550" y="338" text-anchor="middle">H</text>
    <text x="550" y="374" text-anchor="middle">L</text>
  </g>

  <text x="420" y="424" font-size="10.5" font-weight="700" fill="#0E6E7C" text-anchor="middle">native 3.3 V part &#8212; one rail, no level shifting</text>

  <!-- power path -->
  <rect x="330" y="470" width="180" height="60" rx="4" fill="#FFFFFF" stroke="#A3301F" stroke-width="1.5"/>
  <text x="420" y="494" font-size="12" font-weight="700" fill="#A3301F" text-anchor="middle">LM2596 buck</text>
  <text x="420" y="512" font-size="10" fill="#16212B" text-anchor="middle">set to 5.0 V BEFORE the load</text>
  <g stroke="#A3301F" stroke-width="1.5" fill="none">
    <path d="M 650 434 L 650 500 L 510 500"/>
    <path d="M 330 500 L 140 500 L 140 400"/>
  </g>
  <text x="580" y="464" font-size="9.5" fill="#A3301F" text-anchor="middle">17.4 V measured</text>
  <text x="222" y="492" font-size="9.5" fill="#A3301F" text-anchor="middle">5 V to the board</text>
  <text x="486" y="566" font-size="9.5" font-weight="700" fill="#16212B" text-anchor="end">IN&#8722; and OUT&#8722;</text>

  <text x="50" y="596" font-size="11.5" fill="#16212B"><tspan font-weight="700">Four wires, not two.</tspan> The LM2596 is <tspan font-weight="700">not isolated</tspan>: its IN&#8722; and OUT&#8722; are the same node, and</text>
  <text x="50" y="614" font-size="11.5" fill="#16212B">that node is this ground. A buck with only its + connected passes no current at all — the</text>
  <text x="50" y="632" font-size="11.5" fill="#16212B">return path is not optional, it is half the circuit.</text>

  <text x="50" y="660" font-size="11.5" fill="#16212B"><tspan font-weight="700">And CAN needs the same ground for a second reason.</tspan> The pair is differential, but CANH and</text>
  <text x="50" y="678" font-size="11.5" fill="#16212B">CANL are still measured against something. Without a shared reference the common-mode voltage</text>
  <text x="50" y="696" font-size="11.5" fill="#16212B">can drift outside the transceiver's window, and the failure is intermittent rather than silent.</text>

  <text x="50" y="724" font-size="11.5" fill="#16212B"><tspan font-weight="700">Take it from X27 pin 3, not from elsewhere.</tspan> Every ground in the machine is the same net, so</text>
  <text x="50" y="742" font-size="11.5" fill="#16212B">any point works electrically — but the supply return for this node draws up to a couple of</text>
  <text x="50" y="760" font-size="11.5" fill="#16212B">hundred milliamps, and that current should not travel through a different path than the one the</text>
  <text x="50" y="778" font-size="11.5" fill="#16212B">CAN reference uses. One connector, one node, no current between two pick-up points.</text>

  <text x="50" y="806" font-size="11.5" fill="#16212B"><tspan font-weight="700">The transceiver board is connected twice on purpose.</tspan> Its GND pad on the logic header and its</text>
  <text x="50" y="824" font-size="11.5" fill="#16212B">GND on the bus side are one plane — the two wires are not redundant, they bring <tspan font-weight="700">two different</tspan></text>
  <text x="50" y="842" font-size="11.5" fill="#16212B"><tspan font-weight="700">external grounds onto it</tspan>: the ESP32's on one side and the heat pump's on the other. That is what</text>
  <text x="50" y="860" font-size="11.5" fill="#16212B">makes them common, and it is the whole job of the third wire.</text>

  <text x="50" y="888" font-size="11.5" fill="#16212B"><tspan font-weight="700">Pin 4 never reaches the transceiver.</tspan> The legend says +12 V and the rail measures 17.4 V at light</text>
  <text x="50" y="906" font-size="11.5" fill="#16212B">load, so the buck's output must be set with a meter before anything is connected to it.</text>

  <line x1="20" y1="930" x2="740" y2="930" stroke="#A8B3BC"/>

  <text x="50" y="958" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">BOTH RESISTORS MEASURED &#183; NEITHER NEEDS REWORK</text>
  <text x="50" y="980" font-size="11.5" fill="#16212B"><tspan font-weight="700">R2 measures 115 &#8486;</tspan> across CANH and CANL with the board off the bus, so the terminator is</text>
  <text x="50" y="998" font-size="11.5" fill="#16212B">in circuit. Leave it: this bus measured 150 &#8486;, so adding it gives &#8776; 66 &#8486;, near CAN's own 60.</text>
  <text x="50" y="1020" font-size="11.5" fill="#16212B"><tspan font-weight="700">R1 measures 9.5 k&#8486;</tspan>, i.e. Rs (pin 8) goes to ground through a resistor and the driver is</text>
  <text x="50" y="1038" font-size="11.5" fill="#16212B">already slope-limited &#8212; free EMC at 20 kbps, and proof it is not stuck in standby.</text>

  <line x1="20" y1="1060" x2="740" y2="1060" stroke="#A8B3BC"/>

  <text x="50" y="1088" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">CONFIGURATION</text>
  <rect x="50" y="1104" width="330" height="128" rx="4" fill="#FFFFFF" stroke="#A8B3BC"/>
  <g font-size="11" fill="#16212B">
    <text x="66" y="1128">canbus:</text>
    <text x="66" y="1146">  - platform: esp32_can</text>
    <text x="66" y="1164">    tx_pin: GPIO4</text>
    <text x="66" y="1182">    rx_pin: GPIO3</text>
    <text x="66" y="1200">    can_id: 0x680</text>
    <text x="66" y="1218">    bit_rate: 20kbps</text>
  </g>
  <g font-size="11" fill="#16212B">
    <text x="400" y="1128"><tspan font-weight="700">The board line is what unlocks</tspan></text>
    <text x="400" y="1144">20 kbps. ESPHome tabulates the</text>
    <text x="400" y="1160">rate per variant and refuses it</text>
    <text x="400" y="1176">on the plain ESP32.</text>
    <text x="400" y="1202"><tspan font-weight="700">0x680</tspan> never appeared in two</text>
    <text x="400" y="1218">hours of capture. 0x301 did.</text>
  </g>
  <text x="50" y="1254" font-size="11.5" fill="#16212B"><tspan font-weight="700">GPIO4 and GPIO3 share an edge with 3V3 and GND</tspan>, so all four wires leave one side. Neither</text>
  <text x="50" y="1272" font-size="11.5" fill="#16212B">is strapping; GPIO2 is, and a bridge from GPIO3 to it reads as a dead board, not a silent bus.</text>

  <rect x="50" y="1296" width="660" height="114" fill="#FFFFFF" stroke="#A3301F" stroke-width="1.5"/>
  <rect x="50" y="1296" width="6" height="114" fill="#A3301F"/>
  <text x="74" y="1322" font-size="12" font-weight="700" fill="#A3301F">BEFORE THIS TOUCHES THE HEAT PUMP</text>
  <text x="74" y="1346" font-size="11.5" fill="#16212B"><tspan font-weight="700">Bench first:</tspan> two of these, nothing connected to the pump &#8212; each board brings its own 120 &#8486;.</text>
  <text x="74" y="1368" font-size="11.5" fill="#16212B"><tspan font-weight="700">X27 takes one node</tspan> &#8212; one conductor per pole, so this is a swap or a splice in the drop.</text>
  <text x="74" y="1390" font-size="11.5" fill="#16212B"><tspan font-weight="700">Listen-only on esp32_can exists</tspan> &#8212; it compiles, so this node can join the bus passively.</text>
</svg>
