# Enervent Pegasos Eco ECE — phase 1: the fault output, and nothing else
#
# This configuration reads one contact and publishes one binary sensor. That is
# the whole of it, and it is deliberate: the fault light is the only reason this
# unit's panel is ever looked at, so moving that one signal into Home Assistant
# is where the project's value is. Everything else — speed relays, duct
# temperatures — is optional and can come later. See README.md, "Is this worth
# building?".
#
# **This replaces a Modbus probe that could never have worked.** The unit has
# ECC05 automation and no Modbus anywhere; the previous configuration was built
# on documentation for EDA boards. The reasoning is in CLAUDE.md, "The Modbus
# route is closed".
#
# WIRING
#
#   unit COM  →  ESP32 GND
#   unit NO   →  GPIO, internal pull-up
#
# The contact is potential-free and carries only what this node puts on it, so
# the signal side is harmless. **The enclosure it lives in is not** — the same
# board carries 230 VAC and the unit may be 400 V. Opening it is an
# electrician's job in Finland, and it is the same visit that would fit the
# phase 2 relays.

substitutions:
  # `fault_inverted` — which contact state means trouble.
  #
  # NC, COM and NO are all brought out, so either polarity is available and the
  # wiring decides it. **Do not assume.** This repo has already been caught by
  # exactly this inversion on the heat pump's EVU contact, where the entity
  # meant the opposite of what its name said. Trigger a fault deliberately —
  # pulling a temperature sensor is the usual way — and watch which way the
  # sensor moves before trusting it.
  fault_inverted: "true"

esphome:
  name: pegasos
  friendly_name: Pegasos

esp32:
  # The 30-pin DevKit allocated to this project. One GPIO is needed, so any
  # board on the shelf would do.
  board: esp32dev

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  ap:
    # The AP name is broadcast and is not a secret. The password is.
    ssid: "Pegasos Fallback"
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

binary_sensor:
  - platform: gpio
    name: "Fault"
    device_class: problem
    pin:
      number: GPIO16
      mode:
        input: true
        pullup: true
      inverted: ${fault_inverted}

    # A ventilation unit's fault relay does not chatter, and a bounce filter
    # costs nothing here. This is long enough to swallow contact bounce and far
    # too short to hide a real event.
    filters:
      - delayed_on: 200ms
      - delayed_off: 200ms

sensor:
  - platform: wifi_signal
    name: "Wi-Fi"
    update_interval: 60s

  - platform: uptime
    # The line that separates a restart from a log client reconnecting.
    name: "Uptime"
    update_interval: 60s

# ---------------------------------------------------------------------------
# Phase 2, when and if it is wanted
# ---------------------------------------------------------------------------
#
# Relays on `S1`–`S4` select fan speed and `OVERP` is a momentary boost. They
# are potential-free contacts and the manufacturer documents an external
# humidity hygrostat wired to exactly those terminals, so a relay doing the same
# thing is the sanctioned way to control this unit from outside.
#
# Nothing goes to `TF CTRL` or `PF CTRL`. Those are the board's own 0–10 V
# outputs *to* the EC fans, and driving them means fighting the board's driver
# and bypassing defrost and frost protection. CLAUDE.md has the detail.
#
# Validate before flashing:
#
#   podman exec esphome esphome config /config/pegasos.enervent.yaml
