<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="900" height="700" fill="#E9ECEF"/>
  <rect x="20" y="20" width="860" height="660" fill="none" stroke="#A8B3BC"/>

  <text x="40" y="58" font-size="21" font-weight="700" fill="#16212B" letter-spacing="1.5">WIRING</text>
  <text x="40" y="80" font-size="12" fill="#5A6772">Four wires to the module &#183; three to the unit &#183; pin 1 is a supply and stays unconnected</text>
  <line x1="20" y1="98" x2="880" y2="98" stroke="#A8B3BC"/>

  <text x="60" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">ESP32 DEVKIT &#183; 30 PINS</text>
  <text x="420" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">JZK TTL &#8596; RS-485</text>
  <text x="700" y="128" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">FREEWAY &#183; 4P4C</text>

  <rect x="60" y="150" width="180" height="290" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <rect x="88" y="166" width="124" height="42" rx="2" fill="#E9ECEF" stroke="#A8B3BC"/>
  <text x="150" y="186" font-size="10" fill="#5A6772" text-anchor="middle">ESP-32</text>
  <text x="150" y="200" font-size="9" fill="#8A959E" text-anchor="middle">PCB antenna</text>
  <text x="150" y="424" font-size="9" fill="#8A959E" text-anchor="middle">USB-C &#183; CH340C</text>

  <rect x="420" y="150" width="150" height="290" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <rect x="444" y="166" width="102" height="42" rx="2" fill="#E9ECEF" stroke="#A8B3BC"/>
  <text x="495" y="186" font-size="10" fill="#5A6772" text-anchor="middle">MAX485-type</text>
  <text x="495" y="200" font-size="9" fill="#8A959E" text-anchor="middle">auto direction</text>
  <text x="495" y="424" font-size="9" fill="#8A959E" text-anchor="middle">no DE / RE pins</text>

  <rect x="700" y="150" width="140" height="290" rx="4" fill="#FFFFFF" stroke="#16212B" stroke-width="1.5"/>
  <rect x="716" y="166" width="108" height="42" rx="2" fill="#E9ECEF" stroke="#A8B3BC"/>
  <text x="770" y="186" font-size="10" fill="#5A6772" text-anchor="middle">4 positions</text>
  <text x="770" y="200" font-size="9" fill="#8A959E" text-anchor="middle">not RJ11</text>
  <text x="770" y="424" font-size="9" fill="#8A959E" text-anchor="middle">computer board</text>

  <rect x="232" y="223" width="16" height="12" fill="#A3301F"/>
  <rect x="412" y="223" width="16" height="12" fill="#A3301F"/>
  <line x1="248" y1="229" x2="412" y2="229" stroke="#A3301F" stroke-width="2"/>
  <text x="220" y="233" font-size="13" font-weight="700" fill="#16212B" text-anchor="end">3V3</text>
  <text x="440" y="233" font-size="13" font-weight="700" fill="#16212B">VCC</text>

  <rect x="232" y="273" width="16" height="12" fill="#2E5F8A"/>
  <rect x="412" y="273" width="16" height="12" fill="#2E5F8A"/>
  <line x1="248" y1="279" x2="412" y2="279" stroke="#2E5F8A" stroke-width="2"/>
  <text x="220" y="283" font-size="13" font-weight="700" fill="#16212B" text-anchor="end">GPIO17 TX</text>
  <text x="440" y="283" font-size="13" font-weight="700" fill="#16212B">RXD</text>

  <rect x="232" y="323" width="16" height="12" fill="#6B4A8A"/>
  <rect x="412" y="323" width="16" height="12" fill="#6B4A8A"/>
  <line x1="248" y1="329" x2="412" y2="329" stroke="#6B4A8A" stroke-width="2"/>
  <text x="220" y="333" font-size="13" font-weight="700" fill="#16212B" text-anchor="end">GPIO16 RX</text>
  <text x="440" y="333" font-size="13" font-weight="700" fill="#16212B">TXD</text>

  <text x="330" y="308" font-size="9" fill="#8A959E" text-anchor="middle">crossover</text>

  <rect x="232" y="394" width="16" height="12" fill="#16212B"/>
  <rect x="412" y="394" width="16" height="12" fill="#16212B"/>
  <line x1="248" y1="400" x2="412" y2="400" stroke="#16212B" stroke-width="2"/>
  <text x="220" y="404" font-size="13" font-weight="700" fill="#16212B" text-anchor="end">GND</text>
  <text x="440" y="404" font-size="13" font-weight="700" fill="#16212B">GND</text>

  <rect x="562" y="273" width="16" height="12" fill="#A3301F"/>
  <rect x="692" y="273" width="16" height="12" fill="#A3301F"/>
  <line x1="578" y1="279" x2="692" y2="279" stroke="#A3301F" stroke-width="2"/>
  <text x="550" y="283" font-size="13" font-weight="700" fill="#16212B" text-anchor="end">A</text>
  <text x="716" y="277" font-size="13" font-weight="700" fill="#16212B">2 Data +</text>
  <text x="716" y="291" font-size="9" fill="#8A959E">red</text>

  <rect x="562" y="323" width="16" height="12" fill="#3F7A3F"/>
  <rect x="692" y="323" width="16" height="12" fill="#3F7A3F"/>
  <line x1="578" y1="329" x2="692" y2="329" stroke="#3F7A3F" stroke-width="2"/>
  <text x="550" y="333" font-size="13" font-weight="700" fill="#16212B" text-anchor="end">B</text>
  <text x="716" y="327" font-size="13" font-weight="700" fill="#16212B">3 Data &#8722;</text>
  <text x="716" y="341" font-size="9" fill="#8A959E">green</text>

  <rect x="692" y="223" width="16" height="12" fill="#16212B"/>
  <line x1="692" y1="229" x2="640" y2="229" stroke="#16212B" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="626" y1="221" x2="642" y2="237" stroke="#A3301F" stroke-width="2.5"/>
  <line x1="642" y1="221" x2="626" y2="237" stroke="#A3301F" stroke-width="2.5"/>
  <text x="716" y="227" font-size="13" font-weight="700" fill="#16212B">1 +5 VDC</text>
  <text x="716" y="241" font-size="9" fill="#8A959E">black</text>
  <text x="634" y="207" font-size="10" font-weight="700" fill="#A3301F" text-anchor="middle">leave open</text>

  <rect x="692" y="373" width="16" height="12" fill="#9A6B18"/>
  <path d="M 692 379 H 660 V 470 H 330 V 400" fill="none" stroke="#9A6B18" stroke-width="2"/>
  <circle cx="330" cy="400" r="4" fill="#9A6B18"/>
  <text x="716" y="377" font-size="13" font-weight="700" fill="#16212B">4 Ground</text>
  <text x="716" y="391" font-size="9" fill="#8A959E">yellow</text>
  <text x="500" y="486" font-size="10" fill="#5A6772" text-anchor="middle">unit ground joins the module&#8217;s GND &#183; one net, one reference</text>

  <line x1="20" y1="512" x2="880" y2="512" stroke="#A8B3BC"/>

  <text x="40" y="540" font-size="11" font-weight="700" fill="#5A6772" letter-spacing="1">BEFORE ANYTHING IS PLUGGED IN</text>
  <text x="40" y="562" font-size="11.5" fill="#16212B">Count the positions in the jack. Four means this drawing; six means the source is wrong for this unit.</text>
  <text x="40" y="582" font-size="11.5" fill="#16212B">Handset cords are reversed end to end &#8212; identify the conductors by colour, then confirm with a meter</text>
  <text x="40" y="598" font-size="11.5" fill="#16212B">which colour reaches which contact. Pin numbers do not survive the cable.</text>
  <text x="40" y="618" font-size="11.5" fill="#16212B">Read the Modbus address from the control panel. If it reads 0, change it to 1 &#8212; zero is broadcast and</text>
  <text x="40" y="634" font-size="11.5" fill="#16212B">never answers, however correct the wiring is.</text>
  <text x="40" y="654" font-size="11.5" fill="#16212B">If nothing answers: swap A and B first, then try 19200 baud. The pinout is documented for Pingvin,</text>
  <text x="40" y="670" font-size="11.5" fill="#16212B">Pandion, Pelican and LTR-3 &#8212; not for Pegasos, so treat it as a hypothesis.</text>
</svg>
